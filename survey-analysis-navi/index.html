*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#eef3f5;color:#18303b;font:16px/1.75 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:860px;margin:auto;padding:16px 14px 48px}
header{padding:14px 0 6px}
h1{font-size:28px;line-height:1.3;margin:0}
h2{font-size:22px;line-height:1.45;margin:6px 0 10px}
h3{font-size:18px;line-height:1.5;margin:22px 0 8px;padding-left:10px;border-left:5px solid #087887}
p{margin:6px 0 12px}
.card{background:#fff;border:1px solid #cbd9de;border-radius:16px;padding:18px;margin-bottom:14px}
.tag{font-size:14px;color:#356473;font-weight:bold}
.lead{color:#38515b}
.choice{display:block;width:100%;text-align:left;background:#f6fafb;border:1px solid #a8c3cc;border-radius:12px;padding:13px 14px;margin:10px 0;color:#18303b;font:inherit;cursor:pointer;touch-action:manipulation}
.choice strong{display:block;color:#075c68;font-size:17px}
.choice span{display:block;font-size:14.5px;color:#405a64}
@media (hover:hover){.choice:hover{background:#e0f2f3}}
.choice:focus-visible{outline:3px solid #087887;outline-offset:1px}
.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0 16px}
button{font:inherit;min-height:44px;padding:8px 15px;border:1px solid #9cb4be;border-radius:10px;background:#fff;color:#18303b;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
#reset{margin-left:auto;color:#8b4228;border-color:#d3a58f}
.primary{background:#086875;color:#fff;border:0}
.note{background:#edf6f6;border-left:4px solid #087887;padding:10px 12px;margin:12px 0;border-radius:0 8px 8px 0}
.warn{background:#fff6e4;border-left:4px solid #a66a16;padding:10px 12px;margin:12px 0;border-radius:0 8px 8px 0}
.status{background:#f3f7f8;border:1px dashed #a8c3cc;border-radius:10px;padding:8px 12px;font-size:14.5px;margin-bottom:10px}
.status b{color:#075c68}
.namebox{margin:6px 0 4px}
.namebox label{font-size:14.5px;color:#405a64;display:block}
.namebox input{font:inherit;width:100%;max-width:420px;padding:9px 11px;border:1px solid #a8c3cc;border-radius:9px;min-height:44px}
.concl{background:linear-gradient(135deg,#e2f4f1,#f4fbfa);border:2px solid #087887;border-radius:16px;padding:16px 18px;margin:8px 0 6px}
.concl .m{font-size:24px;font-weight:bold;color:#064f59;line-height:1.35;margin:2px 0 8px}
.concl dl{display:grid;grid-template-columns:7.5em 1fr;gap:4px 10px;margin:0}
.concl dt{font-weight:bold;color:#356473}
.concl dd{margin:0}
.why{font-size:14.5px;color:#405a64;margin-top:8px}
ol.steps{padding-left:0;list-style:none;counter-reset:st}
ol.steps>li{counter-increment:st;position:relative;padding:8px 0 8px 44px;border-bottom:1px dashed #d6e3e7}
ol.steps>li::before{content:counter(st);position:absolute;left:4px;top:8px;width:30px;height:30px;border-radius:50%;background:#087887;color:#fff;font-weight:bold;text-align:center;line-height:30px}
code,.f{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14.5px;background:#eef4f6;padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.xlwrap{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
table.xl{border-collapse:collapse;font-size:14px;background:#fff;min-width:max-content}
table.xl th{background:#e9eef0;color:#526a73;font-weight:normal;text-align:center;border:1px solid #c5d3d8;padding:2px 6px;min-width:26px}
table.xl td{border:1px solid #d5dfe3;padding:3px 8px;white-space:nowrap;position:relative}
table.xl td.n{text-align:right}
table.xl td.h{background:#f6fafb;font-weight:bold}
table.xl td.mk{outline:3px solid #d1453b;outline-offset:-3px;background:#fff1ee}
table.xl td.mk2{outline:3px solid #d39a14;outline-offset:-3px;background:#fff8e6}
.bd{display:inline-block;background:#d1453b;color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;font-size:12px;font-weight:bold;margin-right:5px;vertical-align:1px}
.bd.y{background:#b47c00}
.cap{font-size:14px;color:#526a73;margin:4px 0 10px}
.formulas{font-size:14.5px;margin:6px 0 12px;padding-left:20px}
.read{display:grid;gap:8px;margin:10px 0}
.read>div{background:#f8fbfc;border:1px solid #d6e3e7;border-radius:10px;padding:10px 12px}
.read b.k{display:inline-block;min-width:8.5em;color:#064f59}
.guide{background:#fbfdfd;border:1px solid #cfe0e4;border-radius:12px;padding:12px 14px;margin:12px 0}
.guide>b{display:block;color:#064f59;margin-bottom:4px}
table.rule{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
table.rule td,table.rule th{border:1px solid #c8d8dd;padding:6px 8px;text-align:left;vertical-align:top}
table.rule th{background:#edf6f6}
.report{background:#fffdf6;border:1px solid #e4d6a8;border-radius:12px;padding:12px 14px;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
details{margin:12px 0}
summary{cursor:pointer;min-height:44px;font-weight:bold;display:flex;align-items:center;gap:8px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'';width:0;height:0;border-left:8px solid #087887;border-top:6px solid transparent;border-bottom:6px solid transparent;transition:transform .15s;flex:none}
details[open]>summary::before{transform:rotate(90deg)}
details.adv{border:1px solid #d6e3e7;border-radius:12px;padding:4px 14px;background:#fafcfc}
.term{display:inline;border:0;background:none;padding:0;min-height:0;font:inherit;color:#06606c;text-decoration:underline dotted 1.5px;text-underline-offset:3px;cursor:pointer}
.term:focus-visible{outline:2px solid #087887}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.tabs button{min-height:40px;padding:6px 12px;font-size:14.5px}
.tabs button[aria-selected=true]{background:#086875;color:#fff;border-color:#086875}
.chartbox{overflow:auto;max-height:72vh;border:1px solid #d6e3e7;border-radius:12px;background:#fcfefe;-webkit-overflow-scrolling:touch}
.chartbox svg{display:block}
.chartbox.fit svg{width:100%;height:auto}
.legend{font-size:14px;color:#405a64;display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}
.legend i{display:inline-block;width:18px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
svg .nd rect,svg .nd polygon{fill:#fff;stroke:#8fb1ba;stroke-width:1.5}
svg .nd.auto rect{stroke-dasharray:5 3;fill:#f6f8f9}
svg .nd.sub rect{fill:#f2f8f9}
svg .nd.sub .inner{fill:none;stroke:#8fb1ba;stroke-width:1}
svg .nd.leaf rect{fill:#eef7ff;stroke:#7d9fc4}
svg .nd.out rect{fill:#f3f1fb;stroke:#9b8fc4}
svg .nd text{font-size:12px;fill:#18303b}
svg .nd.leaf{cursor:pointer}
svg .nd.leaf:hover rect{fill:#dcefff}
svg .nd.past rect{fill:#d8f0ec;stroke:#0c8a7a;stroke-width:2}
svg .nd.cur rect{fill:#ffe7a8;stroke:#c27c00;stroke-width:3}
svg .ed path{fill:none;stroke:#9db4bb;stroke-width:1.4}
svg .ed text{font-size:11px;fill:#2f5763;paint-order:stroke;stroke:#fcfefe;stroke-width:4px;stroke-linejoin:round}
svg .ed.taken path{stroke:#0c8a7a;stroke-width:3.2}
svg .ed.taken text{fill:#064f59;font-weight:bold}
svg .ttl{font-size:15px;font-weight:bold;fill:#064f59}
dialog{border:0;border-radius:16px;padding:0;max-width:min(860px,96vw);width:96vw;max-height:92vh;box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,30,40,.45)}
.dlghead{position:sticky;top:0;background:#fff;border-bottom:1px solid #d6e3e7;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.dlgbody{padding:6px 18px 20px}
#termdlg{max-width:480px}
.lib a,.lib button.lnk{display:block;text-align:left;width:100%;margin:6px 0}
.dict dt{font-weight:bold;color:#064f59;margin-top:10px}
.dict dd{margin:2px 0 0 0}
footer{font-size:13px;color:#526a73;margin-top:20px}
.small{font-size:14px;color:#526a73}
#printChart{display:none}
@media (max-width:420px){body{font-size:15.5px}h1{font-size:25px}h2{font-size:20px}.concl .m{font-size:21px}.concl dl{grid-template-columns:6.5em 1fr}.card{padding:15px}}
@media print{
 body{background:#fff;font-size:11.5pt}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 main{max-width:none;padding:0}
 .nav,header p,footer,button:not(.term),#chartPanel,#libPanel,dialog,.namebox{display:none!important}
 .term{text-decoration:none;color:inherit}
 .card{border:0;padding:0}
 details>*{display:block}
 details.trail{display:block}
 .xlwrap{overflow:visible}
 h3{break-after:avoid}
 table.xl,.read>div,.report,.guide{break-inside:avoid}
 table.xl{font-size:9pt}
 table.xl td{padding:2px 5px}
 .concl{border-width:1.5px}
 body.print-chart main{display:none}
 body.print-chart #printChart{display:block}
 #printChart svg{width:269mm;height:182mm}
}
</style>

 if(typeof v!=='number')return v;
 if(Number.isInteger(v))return String(v);
 const a=Math.abs(v);
 if(a<1e-4){let [m,e]=v.toExponential(5).split('e');m=String(parseFloat(m));const ex=parseInt(e,10);return m+'E'+(ex<0?'-':'+')+String(Math.abs(ex)).padStart(2,'0');}

 return String(parseFloat(v.toFixed(dec)));
}

/* ========== 状態とウィザード ========== */
const fresh=()=>({node:'start',purpose:'',vars:{},names:{},sub:null,trail:[],btrail:[],done:false});
let state=fresh(),history=[];
function settle(){
 for(let guard=0;guard<50;guard++){
  const n=G[state.node];
  if(n.t==='sub'){
   if(!state.sub||state.sub.main!==state.node){state.sub={main:state.node,i:0,slot:n.slots[0],slotKey:(state.purpose==='single'?'v1s':n.slots[0])};state.btrail=[];state.node='B_how';continue}
  }
  if(n.t==='out'){
   const sb=state.sub;state.vars[sb.slot]={kind:n.kind,likert:!!n.likert};
   sb.i++;const m=G[sb.main];
   if(sb.i<m.slots.length){sb.slot=m.slots[sb.i];sb.slotKey=m.slots[sb.i];state.btrail=[];state.node='B_how';continue}
   const key=m.decide(state);const e=m.ed.find(x=>x.key===key);
   if(!e)throw new Error('判定先なし '+sb.main+' '+key);
   state.trail.push({from:sb.main,to:e.to,edge:e.edge,auto:true});state.sub=null;state.node=e.to;continue;
  }
  if(n.t==='auto'){
   const key=n.decide(state);const e=n.ed.find(x=>x.key===key);
   if(!e)throw new Error('判定先なし '+state.node+' '+key);
   state.trail.push({from:state.node,to:e.to,edge:e.edge,auto:true});state.node=e.to;continue;
  }
  break;
 }
}
function choose(i,nameVal){
 const n=G[state.node];const c=n.ch[i];if(!c)return;
 history.push(JSON.stringify(state));
 if(n.sub){const k=state.sub.slot;if(state.node==='B_how'){const v=(nameVal||'').trim().slice(0,30);if(v)state.names[k]=v;else delete state.names[k]}
  state.btrail.push({from:state.node,to:c.to,edge:c.edge});
  state.trail.push({from:state.node,to:c.to,edge:c.edge,inB:true,slot:k,title:resolve(n.title),label:c.label});
 }else{
  if(c.set)Object.assign(state,c.set);
  state.trail.push({from:state.node,to:c.to,edge:c.edge,title:resolve(n.title),label:c.label});
 }
 state.node=c.to;settle();
}
const resolve=v=>typeof v==='function'?v(state):v;

/* ========== 判断基準の囲み ========== */
const GUIDE={
 p:()=>T(`<div class="guide"><b>p値の読み方</b><p>{{p値}}は、<strong>本当は差や関係がないと仮定したとき、今回と同じくらい、またはそれ以上に極端な結果が偶然に出る確率</strong>です。</p><p>たとえば、ふつうのコインを10回投げて、<strong>表が</strong>9回以上出る確率は約1.1％です（表に偏る向きだけを数える＝{{片側検定|片側}}）。<strong>表か裏のどちらかに</strong>9回以上偏る確率は約2.1％です（両方の向きを数える＝{{両側検定|両側}}）。どちらにしても、ふつうのコインではめったに起きない結果なので、「このコイン、偏っているのでは？」と考えます。このナビのt検定（T.TESTの3つ目の数を2）は両側です。</p><p>p値が小さいほど、「差や関係がないとしたら、めったに起きない結果」だといえます。</p><table class="rule"><tr><th>p値</th><th>判断</th></tr><tr><td>p＜0.01</td><td>1％水準で統計的に有意</td></tr><tr><td>0.01≦p＜0.05</td><td>5％水準で統計的に有意</td></tr><tr><td>p≧0.05</td><td>5％水準では統計的に有意とはいえない</td></tr></table><p>「{{有意|統計的に有意}}」とは、「差や関係がないと仮定すると、今回の結果はめったに起きない（p値が基準より小さい）」という意味です。</p></div>`),
 r:()=>T(`<div class="guide"><b>相関係数 r の読み方（この授業の目安）</b><p>r は−1から＋1までの数です。<strong>＋かーか</strong>で関係の向き、<strong>0からどれだけ離れているか（絶対値）</strong>で関係の強さを表します。</p><p>＋：一方が大きい人ほど、もう一方も大きい。−：一方が大きい人ほど、もう一方は小さい。</p><table class="rule"><tr><th>rの絶対値</th><th>読み方</th></tr><tr><td>0.2未満</td><td>ほとんど相関がない、または非常に弱い</td></tr><tr><td>0.2以上0.4未満</td><td>弱い相関</td></tr><tr><td>0.4以上0.7未満</td><td>中程度の相関</td></tr><tr><td>0.7以上</td><td>強い相関</td></tr></table></div>`),
 R2:()=>T(`<div class="guide"><b>{{決定係数|決定係数 R²}} の読み方（この授業の目安）</b><p>R²は0から1までの数で、「結果（Y）の人による違いのうち、Xで説明できる割合」です。0.40なら40％を説明できています。</p><table class="rule"><tr><th>R²</th><th>読み方</th></tr><tr><td>0.2未満</td><td>説明できる部分は小さい</td></tr><tr><td>0.2以上0.5未満</td><td>ある程度説明できている</td></tr><tr><td>0.5以上</td><td>比較的多くの部分を説明できている</td></tr></table><p>R²は合格・不合格の基準ではありません。人の行動や意見はたくさんの要因で決まるので、アンケート調査ではR²が小さくなることがよくあります。R²が小さくても、係数から「関係の向きと大きさ」を読み取ることには意味があります。ただし、R²が小さいときは、Xだけで1人ひとりのYを言い当てるのは難しい、と考えます。R²が大きくても、XがYの原因だとは限りません。</p><p>Xを増やすとR²は必ず増える（減らない）ので、Xの数がちがう式どうしを比べるときは{{補正R²}}を使います。</p></div>`),
 F:()=>T(`<div class="guide"><b>{{有意F}}と係数の読み方</b><p><strong>有意 F</strong>は、「Xはどれも Y と関係がない」と仮定したとき、今回と同じくらい、またはそれ以上にYを説明できる結果が出る確率（p値）です。0.05未満なら、式全体として有意です。</p><p><strong>{{係数}}</strong>は「Xが1増えると、Yがどれだけ増えるか（−なら減るか）」です。その行の<strong>P-値</strong>が0.05未満なら、その項目の関係は5％水準で有意です。単位がちがう項目どうし（時間と点数など）の係数の大きさを、そのまま比べてはいけません。</p></div>`),
 E:()=>T(`<div class="guide"><b>「6.14E-08」のような表示</b><p>Excelは、とても小さい数を{{E表記}}で表示します。<code>6.14E-08</code>は「6.14の小数点を左へ8けた動かした数」＝0.0000000614のことです。0.001よりずっと小さいので、レポートでは「p&lt;0.001」と書きます。</p></div>`),
 E5:()=>T(`<div class="guide"><b>{{期待度数}}の条件</b><p>期待度数の表の数が小さすぎると、p値が正しく出ません。目安は次のとおりです。</p><table class="rule"><tr><td>2×2の表</td><td>4つのマスがすべて5以上</td></tr><tr><td>それより大きい表</td><td>1未満のマスがなく、5未満のマスが全体の20％以下</td></tr></table><p><b>満たさないときの考え方</b></p><ul><li>人数と割合の表（クロス集計）を示し、「人数が少ないため検定は行わなかった」と書く。これだけでもレポートになります。</li><li>意味が近く、まとめても問いが変わらない選択肢（例：「とても満足」と「満足」）を、<strong>分析の前に決めた方針で</strong>まとめるのはかまいません。</li><li>検定をするためだけに、意味の異なる選択肢（例：「寮」と「一人暮らし」、「経済学部」と「文学部」）をまとめてはいけません。問いそのものが変わってしまいます。</li><li>どうしても検定が必要なときは、先生に相談してください。</li></ul>${E5ex()}</div>`)
};

function E5ex(){
 const O=[[5,1],[4,2],[2,2],[1,3]],rl=['経済','社会','法','文'],cl=['賛成','反対'];
 const R=O.map(r=>r[0]+r[1]),Cc=[0,1].map(j=>O.reduce((a,r)=>a+r[j],0)),N=R.reduce((a,b)=>a+b,0);
 const E=O.map((r,i)=>r.map((v,j)=>R[i]*Cc[j]/N));const flat=E.flat();const small=flat.filter(v=>v<5).length,tiny=flat.filter(v=>v<1).length;

   `複数回答の質問は、選択肢ごと（見本：Instagramの1／0の列）に別々の表を作る。`],
  sample:()=>{const s=S.cross;const cnt=grid({cols:['A','B','C','D'],r0:3,rows:[['個数 / アルバイト','列ラベル'],['行ラベル','あり','なし','総計'],...s.rows.map((r,i)=>[r,...s.O[i],s.R[i]]),['総計',...s.C,s.N]],hd:(i,j)=>i<=1||j===0});
   const per=grid({cols:['A','B','C','D'],r0:3,rows:[['個数 / アルバイト','列ラベル'],['行ラベル','あり','なし','総計'],...s.rows.map((r,i)=>[r,xpct(s.rowpct[i][0]/100),xpct(s.rowpct[i][1]/100),'100.00%']),['総計',xpct(s.C[0]/s.N),xpct(s.C[1]/s.N),'100.00%']],mk:{B5:['①'],B6:['①'],B7:['①']},hd:(i,j)=>i<=1||j===0});
   return '<p class="cap">人数の表（計算の種類＝計算なし）</p>'+cnt+'<p class="cap">割合の表（計算の種類＝行集計に対する比率）</p>'+per+'<p class="cap">見本データ。行の並び順は、データによって変わることがあります。</p>'},
  read:()=>{const s=S.cross;const r=s.rowpct.map(x=>x[0]);return [['① どこを見るか','割合の表のB列（アルバイト「あり」の割合）を、行どうしで比べる。'],['② 数字の意味',`アルバイトをしている割合は、実家${pct(r[0])}、一人暮らし${pct(r[1])}、寮${pct(r[2])}。一人暮らしと寮では${(r[1]-r[2]).toFixed(1)}ポイントの差がある。`],['③ わかったこと','一人暮らしの学生はアルバイトをしている割合が高く、寮の学生は低い。この差が統計的に有意かどうかは、カイ二乗検定で確かめられる。']]},
  guide:()=>T(`<div class="guide"><b>どちらを「行」にする？</b><p>比べたいグループ（原因と考える側。見本では居住形態）を「行」にして、「行集計に対する比率」を出します。こうすると、グループごとの割合を縦に並べて比べられます。</p><p>差は「何ポイント」で表します（50.0％と83.3％なら33.3ポイントの差）。</p></div>`)+`<div class="btnrow"><button type="button" data-open="chi23">この差を検定する：カイ二乗検定の説明を見る</button></div>`,
  report:()=>{const s=S.cross;const r=s.rowpct.map(x=>x[0]);return `居住形態別にアルバイトをしている割合をみると、一人暮らしが${pct(r[1])}（${s.R[1]}人中${s.O[1][0]}人）と最も高く、実家が${pct(r[0])}（${s.R[0]}人中${s.O[0][0]}人）、寮が${pct(r[2])}（${s.R[2]}人中${s.O[2][0]}人）であった。`},
  adv:()=>`<p>人数が少ないグループの割合は大きく動きます。見本の寮（12人）では、1人ちがうだけで割合が約8ポイント変わります。割合と一緒に人数も書きましょう。</p>`},

 chi22:{title:'カイ二乗検定（2×2の表）',look:'CHISQ.TESTで求めたp値と、割合の差',rule:'p＜0.05なら「関連がある」。差は何ポイントかで書く',
  what:u=>`答えが2つずつの2つの質問（${u.gen?'例：アルバイトの有無とサークル加入':u.v1+'と'+u.v2}）で、グループによる割合の違いが、<strong>関係がないと仮定したときに起こりにくい差か</strong>を確かめます。「アルバイトをしている人は、サークルに入っている割合がちがう？」に、p値で答えを出せます。`,
  steps:u=>chiSteps(u,'2×2','B3:C4','B8:C9','$D3*B$5/$D$5','D5',2,2),
  sample:()=>chiGrid(X22,['あり','なし'],['加入','未加入'],'加入の割合','実際の人数（行：アルバイト、列：サークル）'),
  read:()=>{const s=X22;const a=s.O[0][0]/s.R[0]*100,b=s.O[1][0]/s.R[1]*100;return [['① どこを見るか','B11のp値と、E列の割合。'],['② 数字の意味',`${pT(s.p)}。0.05よりずっと大きい。サークルに加入している割合は、アルバイトあり${pct(a)}、なし${pct(b)}で、差は${(a-b).toFixed(1)}ポイント。`],['③ わかったこと','関係がないと仮定しても、この程度の差は十分に起こりうる（p≧0.05）。アルバイトの有無とサークル加入に関連があるとはいえない。']]},
  guide:()=>GUIDE.p()+T(`<div class="guide"><b>2×2の表の読み方</b><p>p値で「関連があるか」を判断し、関連の中身は割合の差（何ポイント）で書きます。</p></div>`)+GUIDE.E5(),
  report:()=>{const s=X22;const a=s.O[0][0]/s.R[0]*100,b=s.O[1][0]/s.R[1]*100;return `アルバイトの有無とサークル加入の関連をカイ二乗検定で調べた。サークルに加入している割合は、アルバイトをしている学生で${pct(a)}、していない学生で${pct(b)}であり、統計的に有意な関連はみられなかった（χ²(1)=${f2(s.chi2)}, ${pT(s.p)}）。`},
  adv:()=>chiAdv(X22,'B12','B13','B3:C4','B8:C9','D5','MIN(2,2)')+T(`<p>期待度数に5未満のマスがある2×2の表では、「フィッシャーの正確確率検定」を使います（Excelには専用の関数がありません）。</p><p>ExcelのCHISQ.TESTは、2×2の表でも補正（イェーツの補正）をしない計算です。教科書によって補正をする場合があり、p値が少しちがうことがあります。</p>`)},

 chi23:{title:'カイ二乗検定（2×3以上の表）',look:'CHISQ.TESTで求めたp値と、グループごとの割合',rule:'p＜0.05なら「表のどこかに偏りがある」。どこかは割合で見る',
  what:u=>`選択肢が3つ以上ある質問を含む人数表（${u.gen?'例：居住形態×アルバイトの有無':u.v1+'×'+u.v2}）で、グループによる割合の違いが、<strong>関係がないと仮定したときに起こりにくい差か</strong>を確かめます。「居住形態によって、アルバイトをしている割合はちがう？」に、p値で答えを出せます。`,
  steps:u=>chiSteps(u,'3×2','B3:C5','B9:C11','$D3*B$6/$D$6','D6',3,2),
  sample:()=>chiGrid(X23,X23.rows,['あり','なし'],'ありの割合','実際の人数（行：居住形態、列：アルバイト）'),
  read:()=>{const s=X23;const r=s.rows.map((x,i)=>s.O[i][0]/s.R[i]*100);return [['① どこを見るか','B13のp値と、E列の割合。'],['② 数字の意味',`${pT(s.p)}で、0.01≦p＜0.05なので5％水準で統計的に有意。アルバイトをしている割合は、実家${pct(r[0])}、一人暮らし${pct(r[1])}、寮${pct(r[2])}。`],['③ わかったこと','居住形態によって、アルバイトをしている割合はちがう。p値だけでは「どのグループが」はわからないので、割合を見る：一人暮らしが高く、寮が低い。']]},
  guide:()=>GUIDE.p()+T(`<div class="guide"><b>2×3以上の表の読み方</b><p>p値が小さいことは、「関係がないと仮定すると起こりにくい偏りが、表のどこかにある」ことだけを示します。どのグループが多い・少ないかは、割合の表で探して書きます。</p></div>`)+GUIDE.E5(),
  report:()=>{const s=X23;const r=s.rows.map((x,i)=>s.O[i][0]/s.R[i]*100);return `居住形態とアルバイトの有無の関連をカイ二乗検定で調べたところ、5％水準で統計的に有意な関連がみられた（χ²(${s.df})=${f2(s.chi2)}, ${pT(s.p)}）。アルバイトをしている割合は、一人暮らしで${pct(r[1])}と高く、寮では${pct(r[2])}と低かった（実家は${pct(r[0])}）。`},
  adv:()=>chiAdv(X23,'B14','B15','B3:C5','B9:C11','D6','MIN(3,2)')+`<p>どのマスが特に多い・少ないかを統計的に確かめる「残差分析」という方法もあります（このナビの範囲外）。</p>`},

 pairedcat:{title:'回答の変化を調べる（同じ質問を2回）',look:'答えが変わった人数と、マクネマー検定のp値',rule:'変わった向きの人数を比べ、p＜0.05なら「変化がある」',
  what:u=>`同じ人に同じ質問を2回（授業の前と後など）したときは、「何人の答えが、どちらの向きに変わったか」を数えます。「反対→賛成」に変わった人と「賛成→反対」に変わった人の数の差が、本当は変化がないと仮定したときに起こりにくい差かを、{{マクネマー検定}}で確かめられます。`,
  steps:u=>[`1行に1人で、1回目の答え（見本：M列 授業前の賛否）と2回目の答え（N列 授業後の賛否）を並べる。`,
   `ピボットテーブルを作る：1回目の答えを「<b>行</b>」、2回目の答えを「<b>列</b>」、どちらかを「<b>値</b>」（個数）へ。「行ラベル」と「列ラベル」の両方の▼で「(空白)」のチェックを外す（どちらかに答えていない人を除くため）。`,
   `人数の部分を総計ごとコピーし、新しいシートのA2で右クリック → 「貼り付けのオプション」の「<b>値</b>」。見本の形（B3:C4に人数）に整える。`,
   `表の読み方：左上（賛成→賛成）と右下（反対→反対）は答えが変わらなかった人。右上（C3：賛成→反対）と左下（B4：反対→賛成）が変わった人。`,
   `答えが2つ（2×2）のとき、p値を出す：<code>=CHISQ.DIST.RT((C3-B4)^2/(C3+B4),1)</code>`,
   `答えが3つ以上のときは、変わった人数と割合を表にして示す（検定はこのナビの範囲外）。`],
  sample:()=>{const s=PC;return grid({cols:['A','B','C','D'],r0:2,rows:[['授業前＼授業後','賛成','反対','合計'],['賛成',s.O[0][0],s.O[0][1],s.O[0][0]+s.O[0][1]],['反対',s.O[1][0],s.O[1][1],s.O[1][0]+s.O[1][1]],['合計',s.O[0][0]+s.O[1][0],s.O[0][1]+s.O[1][1],S.n],[],['p値',s.p]],mk:{C3:['①','y'],B4:['①','y'],B7:['②']},hd:(i,j)=>i===0||j===0})+'<p class="cap">見本データ（授業前と授業後の賛否）。B7は <code>=CHISQ.DIST.RT((C3-B4)^2/(C3+B4),1)</code>。</p>'},
  read:()=>{const s=PC;return [['① どこを見るか','答えが変わった人数（C3とB4）と、B7のp値。'],['② 数字の意味',`反対→賛成が${s.c}人、賛成→反対が${s.b}人。${pT(s.p)}で、p＜0.01なので1％水準で統計的に有意。`],['③ わかったこと',`授業の後、賛成は${s.pre_yes}人から${s.post_yes}人に増えた。賛成に変わった人のほうが多く、この差は1％水準で統計的に有意。`]]},
  guide:()=>GUIDE.p()+T(`<div class="guide"><b>変わった人数が少ないとき</b><p>答えが変わった人の合計（見本では${PC.b}＋${PC.c}＝${PC.b+PC.c}人）が25人未満のときは、「発展」にある正確なp値の式を使います。</p></div>`),
  report:()=>{const s=PC;return `授業の前後で同じ質問をしたところ、賛成は${s.pre_yes}人（${pct(s.pre_yes/S.n*100)}）から${s.post_yes}人（${pct(s.post_yes/S.n*100)}）に増えた。反対から賛成に変わった学生は${s.c}人、賛成から反対に変わった学生は${s.b}人であり、マクネマー検定の結果、この変化は1％水準で統計的に有意であった（χ²(1)=${f2(s.chi2)}, ${pT(s.p)}）。`},
  adv:()=>`<p>変わった人の合計が25人未満のときの正確なp値：<code>=MIN(1,2*BINOM.DIST(MIN(C3,B4),C3+B4,0.5,TRUE))</code>（見本データでは ${f3(PC.p_exact)}）。</p><p>同じ人を2回数えた表なので、ふつうのカイ二乗検定（CHISQ.TEST）は使いません。</p>`},

 corr:{title:'相関係数（ピアソンの r）',look:'相関係数 r と、そのp値',rule:'rの絶対値で強さ、＋−で向きを読む。p＜0.05なら有意',
  what:u=>`「勉強時間が長い人ほど、テストの点数も高い？」のように、2つの数値（${u.gen?'例：勉強時間とテストの点数':u.v1+'と'+u.v2}）が一緒に動くかを、−1〜＋1の1つの数（{{相関係数}} r）で表します。{{散布図}}と一緒に見ると、関係の形がひと目でわかります。`,
  steps:u=>[`同じ人の2つの数値を同じ行に並べる（見本：H列 勉強時間、J列 期末テスト）。`,
   missStep('勉強時間（H列）と期末テスト（J列）'),
   `散布図を描く：2つの列を選ぶ（離れた列は Ctrl キー〔Macは command キー〕を押しながら選ぶ）→ <b>挿入</b> → 「散布図」。点が右上がりに並べば＋、右下がりなら−の相関。`,
   `空いているセルに <code>=CORREL(H2:H61,J2:J61)</code> と入れて r を出す。`,
   `p値を出す：「データ分析」→「回帰分析」で、入力 Y 範囲に一方（J1:J61）、入力 X 範囲にもう一方（H1:H61）を入れ、「ラベル」にチェックして実行。X の行（勉強時間）の「P-値」が、相関係数のp値と同じ値になる。`],
  sample:()=>grid({cols:['Q','R','S'],rows:[['相関係数 r',C.r,'=CORREL(H2:H61,J2:J61)'],['人数',C.n,'=COUNT(H2:H61)'],['p値',C.p,'回帰分析の出力 E18 の値']],mk:{R1:['①'],R3:['②']},hd:(i,j)=>j===0})+'<p class="cap">見本データ（1週間の勉強時間と期末テストの点数）。S列は説明のために書いたもの。</p>',
  read:()=>[['① どこを見るか','R1の r と、R3のp値（回帰分析のP-値）。'],['② 数字の意味',`r=${f2(C.r)}。＋なので「勉強時間が長いほど点数が高い」向き。絶対値${f2(C.r)}は0.4以上0.7未満なので中程度の相関。p値の ${xl(C.p)} は0.001よりずっと小さい（1％水準で統計的に有意）。`],['③ わかったこと','勉強時間と期末テストの点数には、中程度の正の相関がある（1％水準で統計的に有意）。']],
  guide:()=>GUIDE.r()+GUIDE.p()+GUIDE.E(),
  report:()=>`1週間の勉強時間と期末テストの点数の間には、中程度の正の相関がみられた（r=${f2(C.r)}, ${pT(C.p)}, n=${C.n}）。`,
  adv:()=>`<p>rの区切り（0.2、0.4、0.7）は、読みやすくするための便宜的な目安です。0.39と0.41に本質的なちがいはありません。分野によって別の目安が使われることもあります。</p><p>rは「直線的な関係」の強さです。山なりのような曲線の関係はうまく表せないので、必ず散布図も見ます。極端な値の人が1人いるだけで r が大きく変わることもあります。</p><p>相関は「原因と結果」の証明ではありません（勉強時間が点数を上げたのか、得意な人が長く勉強するのかは、rだけでは区別できません）。</p><p>同じデータで単回帰分析をすると、R²＝r²（${f2(C.r)}×${f2(C.r)}≒${f2(C.r*C.r)}）になります。</p><p>5段階以上の評価どうしの関係には、順位を使う「スピアマンの順位相関」も使えます（<code>=RANK.AVG</code>で順位にしてからCORREL）。</p>`},

 paired:{title:'対応のあるt検定',look:'T.TESTで求めたp値と、平均の差',rule:'p＜0.05なら「平均が変わった」。何点変わったかも書く',
  what:u=>`同じ人を2回測った数値（${u.gen?'例：授業の前と後の小テスト':u.v1+'と'+u.v2}）の平均が、変わったといえるかを確かめます。1人ひとりの「後−前」の差をもとに判断するので、人による元々の得意・不得意に邪魔されにくい方法です。`,
  steps:u=>[`同じ人の1回目と2回目を同じ行に並べる（見本：K列 小テスト前、L列 小テスト後）。`,
   missStep('小テスト前（K列）と小テスト後（L列）'),
   `空いているセル（見本ではQ列から）に、それぞれの平均：<code>=AVERAGE(K2:K61)</code>、<code>=AVERAGE(L2:L61)</code>`,
   `平均の差（後−前）を計算する。`,
   T(`p値：<code>=T.TEST(K2:K61,L2:L61,2,1)</code>。3つ目の「2」は{{両側検定}}（上がったか下がったかを決めつけない）、4つ目の「1」は「同じ人の2回（{{対応あり}}）」という意味。`)],
  sample:()=>grid({cols:['Q','R','S'],rows:[['前の平均',P.m1,'=AVERAGE(K2:K61)'],['後の平均',P.m2,'=AVERAGE(L2:L61)'],['差（後−前）',P.diff,'=R2-R1'],['p値',P.p,'=T.TEST(K2:K61,L2:L61,2,1)'],['人数',P.n,'=COUNT(K2:K61)']],mk:{R3:['①','y'],R4:['②']},hd:(i,j)=>j===0})+'<p class="cap">見本データ（授業の前と後の小テスト、100点満点）。</p>',
  read:()=>[['① どこを見るか','R4のp値と、R3の平均の差。'],['② 数字の意味',`${pT(P.p)}で、0.01≦p＜0.05なので5％水準で統計的に有意。平均は${f1(P.m1)}点から${f1(P.m2)}点へ、${f1(P.diff)}点上がった。`],['③ わかったこと',`授業の後、小テストの平均点は${f1(P.diff)}点上がり、その差は5％水準で統計的に有意だった。`]],
  guide:()=>GUIDE.p()+T(`<div class="guide"><b>差の大きさも書く</b><p>p値からわかるのは、「差がないと仮定したら、めったに起きない結果かどうか」だけです。差の大きさはわからないので、「何点上がったか」も必ず書きます。</p></div>`),
  report:()=>`授業の前後で小テストの点数を比べたところ、平均点は${f1(P.m1)}点から${f1(P.m2)}点へ${f1(P.diff)}点上がり、対応のあるt検定の結果、5％水準で統計的に有意な差がみられた（${pT(P.p)}, n=${P.n}）。`,
  adv:()=>`<p>「データ分析」の「t 検定: 一対の標本による平均の検定」を使うと、t値（見本では${f2(P.t)}）も表で出ます。レポートで t(${P.n-1})=${f2(P.t)} のように書く場合に使います。</p><p>同じ人の、単位が同じ2つの数値（数学と英語の点数など）の平均を比べるときにも使えます。</p><p>差（後−前）に極端な値の人がいないかも確かめます。</p>`},

 welch:{title:'対応のないt検定（Welch法）',look:'T.TESTで求めたp値と、グループごとの平均',rule:'p＜0.05なら「平均に差がある」。どれくらい差があるかも書く',
  what:u=>`別々の人の2つのグループ（${u.gen?'例：アルバイトをしている人／していない人':u.grp+'の2つのグループ'}）で、${u.gen?'数値':u.num}の平均に差があるといえるかを確かめます。2つのグループのばらつきがちがっていても使える、標準的な方法です。`,
  steps:u=>welchSteps(u,3),
  sample:()=>welchGrid('R6'),
  read:()=>[['① どこを見るか','R6のp値と、3行目の平均。'],['② 数字の意味',`${pT(W.p)}で、0.01≦p＜0.05なので5％水準で統計的に有意。平均睡眠時間は、アルバイトあり${f2(W.m1)}時間、なし${f2(W.m2)}時間。`],['③ わかったこと',`アルバイトをしている学生は、していない学生より睡眠時間が平均${f2(W.m2-W.m1)}時間（約${Math.round((W.m2-W.m1)*60)}分）短い。この差は5％水準で統計的に有意。`]],
  guide:()=>GUIDE.p(),
  report:()=>`アルバイトをしている学生（n=${W.n1}）の1日の平均睡眠時間は${f2(W.m1)}時間で、していない学生（n=${W.n2}）の${f2(W.m2)}時間より短かった。Welchのt検定の結果、この差は5％水準で統計的に有意であった（${pT(W.p)}）。`,
  adv:()=>welchAdv()},

 equal:{title:'対応のないt検定（等分散を仮定）',look:'T.TESTで求めたp値と、グループごとの平均',rule:'p＜0.05なら「平均に差がある」',
  what:u=>`Welch法と同じく、別々の人の2つのグループで数値の平均を比べます。「2つのグループのばらつきは同じ」と考える理由があるとき（先生の指示など）に使います。迷ったらWelch法を使います。`,
  steps:u=>welchSteps(u,2),
  sample:()=>welchGrid('R7'),
  read:()=>[['① どこを見るか','R7のp値（等分散を仮定）と、3行目の平均。'],['② 数字の意味',`${pT(W.p_equal)}で、p＜0.01なので1％水準で統計的に有意（同じデータのWelch法は ${pT(W.p)}）。`],['③ わかったこと','アルバイトをしている学生は、していない学生より睡眠時間が短い。']],
  guide:()=>GUIDE.p(),
  report:()=>`アルバイトをしている学生（n=${W.n1}）の1日の平均睡眠時間は${f2(W.m1)}時間、していない学生（n=${W.n2}）は${f2(W.m2)}時間であり、t検定（等分散を仮定）の結果、1％水準で統計的に有意な差がみられた（${pT(W.p_equal)}）。`,
  adv:()=>`<p>この方法は、0と1のダミー変数を使った単回帰分析と同じ結果になります（見本では、どちらも p=${f3(DS.pF)}）。</p>`+welchAdv()},

 anova3:{title:'3グループ以上の平均比較（ダミー変数の回帰分析）',look:'有意 F（全体の差）と、各グループの係数',rule:'有意F＜0.05なら「グループによって平均がちがう」。係数＝基準グループとの差',
  what:u=>`実家・一人暮らし・寮のように、3つ以上のグループ（${u.gen?'例：居住形態':u.grp}）で${u.gen?'数値':u.num}の平均に差があるかを確かめます。t検定を何度もくり返すと偶然の「有意」が出やすくなるので、{{ダミー変数}}だけを使った回帰分析で、<strong>1回で</strong>調べます（「分散分析」と同じ結論になります）。`,
  steps:u=>[`基準にするグループを1つ決める（ふつうは人数が多いグループ。見本：実家）。`,
   `データの右の空いた列に、基準<b>以外</b>のグループの列を作る：O1に「一人暮らし」、P1に「寮」と見出しを入れる。`,
   `O2に <code>=IF(B2="","",IF(B2="一人暮らし",1,0))</code>、P2に <code>=IF(B2="","",IF(B2="寮",1,0))</code> と入れ、61行目まで下へコピーする。基準（実家）の人は両方とも0、居住形態が無回答の人は<b>空欄</b>になる（無回答の人を基準グループに入れないため）。`,
   missStep('睡眠時間（I列）と居住形態（B列）'),
   toolpak(),
   regRun('Yにする数値の列（見本：睡眠時間 I1:I61）','ダミー変数の列（O1:P61）'),
   regOpt(),
   `グループごとの平均も出しておく：<code>=AVERAGEIF(B2:B61,"実家",I2:I61)</code>（"一人暮らし"、"寮"も同じように）。`],
  sample:()=>'<p class="cap">ダミー変数の列を作ったところ（見本データの最初の5人）</p>'+grid({cols:['B','I','O','P'],rows:[['居住形態','睡眠時間','一人暮らし','寮'],...ROWS.slice(0,5).map(r=>[r['居住形態'],r['睡眠時間'],+(r['居住形態']==='一人暮らし'),+(r['居住形態']==='寮')])],hd:i=>i===0})+regGrid(A3,{F12:['①'],B17:['②','y'],B18:['③'],E18:['③'],B19:['④'],E19:['④']}),
  read:()=>{const gm=A3.groupmeans;return [['① どこを見るか','F12の「有意 F」。'],['② 数字の意味',`有意F＝${f3(A3.pF)}で、p＜0.01なので1％水準で統計的に有意。B17の切片${f2(A3.coef[0])}は、基準（実家）の平均睡眠時間。`],['③ 一人暮らし',`係数${f2(A3.coef[1])}＝実家より${f2(-A3.coef[1])}時間短い（平均${f2(gm['一人暮らし'])}時間）。P-値${f3(A3.p[1])}で1％水準で統計的に有意。`],['④ 寮',`係数＋${f2(A3.coef[2])}＝実家より${f2(A3.coef[2])}時間長い（平均${f2(gm['寮'])}時間）。P-値${f3(A3.p[2])}で、実家との差は有意とはいえない。`],['わかったこと',`居住形態によって睡眠時間の平均はちがう。特に一人暮らしの学生は、実家の学生より約${Math.round(-A3.coef[1]*60)}分短い。`]]},
  guide:()=>GUIDE.F()+GUIDE.p()+GUIDE.R2(),
  report:()=>{const gm=A3.groupmeans;return `居住形態によって1日の平均睡眠時間が異なるかを、実家を基準としたダミー変数による回帰分析で調べたところ、全体として1％水準で統計的に有意な差がみられた（F(${A3.df_reg},${A3.df_res})=${f2(A3.F)}, ${pT(A3.pF)}）。一人暮らしの学生の平均睡眠時間（${f2(gm['一人暮らし'])}時間）は実家の学生（${f2(gm['実家'])}時間）より${f2(-A3.coef[1])}時間短く、この差は1％水準で統計的に有意であった（${pT(A3.p[1])}）。寮の学生（${f2(gm['寮'])}時間）と実家の学生の差は有意ではなかった（${pT(A3.p[2])}）。`},
  adv:()=>`<p>一人暮らしと寮のように、基準<b>以外</b>のグループどうしを比べたいときは、基準を変えて（例：一人暮らしを基準にして）もう一度回帰分析をします。</p><p>「データ分析」の「分散分析: 一元配置」でも、同じF値とp値（見本：F=${f2(A3.F)}、p=${f3(A3.pF)}）が出ます。</p><p>ダミー変数は「グループの数−1本」です。基準のグループの列まで作って全部入れると、計算がおかしくなります。</p>`},

 simple:{title:'単回帰分析',look:'係数とそのP-値、R²、有意 F',rule:'係数の＋−と大きさで関係を読み、P-値＜0.05なら有意',
  what:u=>`「勉強時間が1時間増えると、テストの点数は何点上がる？」のように、1つの項目（X）で数値（Y）を説明し、その関係を直線の式で表します。${u.gen?'':'あなたの分析では、Y＝'+u.y+'、X＝'+u.x+'です。'}`,
  steps:u=>[missStep('期末テスト（J列）と勉強時間（H列）'),toolpak(),regRun('Y（見本：期末テスト J1:J61）','X（見本：勉強時間 H1:H61）'),regOpt(),`散布図（XとYの2列を選んで 挿入 → 散布図）も描いて、点がおおむね直線に沿っているかを確かめる。`],
  sample:()=>regGrid(SR,{B5:['①'],F12:['②'],B18:['③'],E18:['④']}),
  read:()=>[['① 重決定 R2（B5）',`R²=${f2(SR.R2)}。期末テストの点数の、人による違いの約${Math.round(SR.R2*100)}％を勉強時間で説明できている（0.2以上0.5未満なので「ある程度説明できている」）。`],['② 有意 F（F12）',`${xl(SR.pF)}（0.001よりずっと小さい）。式全体として1％水準で統計的に有意。`],['③ 係数（B18）',`${f2(SR.coef[1])}。1週間の勉強時間が1時間長いと、点数が平均で約${f1(SR.coef[1])}点高い。切片（B17）${f2(SR.coef[0])}は、勉強時間0時間のときの予測点。`],['④ P-値（E18）',`${xl(SR.p[1])}で1％水準で統計的に有意。`],['わかったこと','勉強時間が長い学生ほど、期末テストの点数が高い。勉強時間だけで、点数の違いの約4割を説明できる。']],
  guide:()=>GUIDE.R2()+GUIDE.F()+GUIDE.p()+GUIDE.E(),
  report:()=>`期末テストの点数を1週間の勉強時間で説明する単回帰分析を行った。勉強時間の係数は${f2(SR.coef[1])}であり（${pT(SR.p[1])}）、勉強時間が1時間長いと点数が平均で約${f1(SR.coef[1])}点高いと推定された。決定係数はR²=${f2(SR.R2)}であった。`,
  adv:()=>`<p>係数と切片から予測の式が書けます：点数＝${f2(SR.coef[0])}＋${f2(SR.coef[1])}×勉強時間。勉強時間10時間なら約${f1(SR.coef[0]+SR.coef[1]*10)}点です。データの範囲（見本では${Math.min(...ROWS.map(r=>r['勉強時間']))}〜${Math.max(...ROWS.map(r=>r['勉強時間']))}時間）の外を予測するのは危険です。</p><p>R²は、相関係数 r を2乗した値と同じです（r=${f2(C.r)}）。</p><p>係数があっても、原因と結果の証明にはなりません。</p>`},

 dsimple:{title:'ダミー変数を使った単回帰分析',look:'係数とそのP-値',rule:'係数＝「1」のグループと「0」のグループの平均の差',
  what:u=>`「アルバイトあり＝1、なし＝0」のように、2つのグループを0と1（{{ダミー変数}}）に置きかえて回帰分析をします。係数がそのまま「2つのグループの平均の差」になります。${u.gen?'':'あなたの分析では、Y＝'+u.y+'、X＝'+u.x+'です。'}`,
  steps:u=>[`データの右の空いた列に、O1「アルバイトあり」と見出しを入れ、O2に <code>=IF(C2="","",IF(C2="あり",1,0))</code> と入れて61行目まで下へコピーする。アルバイトの質問が無回答の人は空欄になる（「なし」のグループに入れないため）。複数回答の選択肢は、すでに1／0の列なのでそのまま使える。`,missStep('睡眠時間（I列）とアルバイト（C列）'),toolpak(),regRun('Y（見本：睡眠時間 I1:I61）','ダミー変数の列（O1:O61）'),regOpt()],
  sample:()=>regGrid(DS,{B17:['①','y'],B18:['②'],E18:['③'],B5:['④','y']}),
  read:()=>[['① 切片（B17）',`${f2(DS.coef[0])}＝「0」のグループ（アルバイトなし）の平均睡眠時間。`],['② 係数（B18）',`${f2(DS.coef[1])}＝アルバイトありの平均は、なしより${f2(-DS.coef[1])}時間短い（${f2(DS.coef[0]+DS.coef[1])}時間）。`],['③ P-値（E18）',`${f3(DS.p[1])}で、p＜0.01なので1％水準で統計的に有意。`],['④ R²（B5）',`${f2(DS.R2)}。0.2未満なので、アルバイトの有無だけで説明できる部分は小さい（アルバイトの有無だけで、1人ひとりの睡眠時間を言い当てるのは難しい）。一方で、2つのグループの平均の差は1％水準で統計的に有意。`]],
  guide:()=>GUIDE.F()+GUIDE.p()+GUIDE.R2(),
  report:()=>`アルバイトの有無（あり＝1、なし＝0）を説明変数、1日の睡眠時間を結果とする回帰分析を行った。アルバイトありの係数は${f2(DS.coef[1])}であり（${pT(DS.p[1])}）、アルバイトをしている学生の睡眠時間は、していない学生より平均${f2(-DS.coef[1])}時間短いと推定された（R²=${f2(DS.R2)}）。`,
  adv:()=>`<p>この結果は、t検定（等分散を仮定）と同じp値になります（見本：p=${f3(W.p_equal)}）。平均の差を確かめるだけなら、Welchのt検定もおすすめです。</p>`},

 multi:{title:'重回帰分析',look:'各係数とそのP-値、補正R²、有意 F',rule:'他の項目をそろえたときの関係を、係数とP-値で読む',
  what:u=>`複数の項目（X）を同時に使って、数値（Y）を説明します。「睡眠時間が同じなら、勉強時間が1時間増えると何点上がる？」のように、<strong>他の項目の影響をそろえた</strong>うえでの関係がわかります。${u.gen?'':'あなたの分析では、Y＝'+u.y+'です。'}`,
  steps:u=>[`Xにする列を<b>隣り合わせ</b>に並べる（見本：H列 勉強時間とI列 睡眠時間は、すでに隣同士）。離れているときは、空いた列にコピーして並べる。`,missStep('YとXにする元の列（見本：J列・H列・I列）'),toolpak(),regRun('Y（見本：期末テスト J1:J61）','Xの列すべて（見本：H1:I61）'),regOpt()],
  sample:()=>regGrid(MR,{B5:['①'],B6:['①','y'],F12:['②'],B18:['③'],E18:['③'],B19:['④'],E19:['④']}),
  read:()=>[['① R2（B5・B6）',`重決定R²=${f2(MR.R2)}で、点数の違いの約${Math.round(MR.R2*100)}％を2つの項目で説明できている（0.2以上0.5未満なので「ある程度」）。補正R²（${f2(MR.adjR2)}）は、Xの数を考えに入れて調整した値で、Xの数がちがう式と比べるときに使う。`],['② 有意 F（F12）',`${xl(MR.pF)}。式全体として1％水準で統計的に有意。`],['③ 勉強時間（B18・E18）',`係数${f2(MR.coef[1])}、P-値${xl(MR.p[1])}。睡眠時間が同じなら、勉強時間1時間あたり約${f1(MR.coef[1])}点高い（1％水準で統計的に有意）。`],['④ 睡眠時間（B19・E19）',`係数${f2(MR.coef[2])}、P-値${f3(MR.p[2])}。0.05以上なので、勉強時間をそろえたうえでの睡眠時間と点数の関係は、有意とはいえない。`]],
  guide:()=>GUIDE.R2()+GUIDE.F()+GUIDE.p()+GUIDE.E(),
  report:()=>`期末テストの点数を、勉強時間と睡眠時間で説明する重回帰分析を行った（R²=${f2(MR.R2)}、補正R²=${f2(MR.adjR2)}、有意F<0.001）。勉強時間の係数は${f2(MR.coef[1])}で、1％水準で統計的に有意であった（${pT(MR.p[1])}）。一方、睡眠時間の係数（${f2(MR.coef[2])}）は有意ではなかった（${pT(MR.p[2])}）。`,
  adv:()=>T(`<p><b>{{多重共線性}}</b>：Xどうしが強く関係している（例：「勉強時間」と「課題に使った時間」）と、どちらの影響なのかを分けられず、係数が大きくぶれたり、P-値が大きくなったりします。確かめ方：Xどうしの相関係数（CORREL）を見て、絶対値が0.7以上（この授業の「強い相関」）なら注意し、どちらか1つにすることを考えます。一方のXがもう一方から計算で求められる組み合わせ（「1週間の勉強時間」と「1日の勉強時間×7」など）は、計算そのものが正しくできません。</p><p><b>必要な回答者数</b>：人数がXの数に比べて少ないと、係数やP-値が不安定になります。「Xの数の10〜20倍以上の人数」という目安がよく使われますが、それを満たせば十分という基準ではありません。「データ分析」の回帰分析で入れられるXは16列までです。</p><p>単位がちがう係数（時間と点など）の大きさは、そのまま比べられません。</p>`)},

 dummy:{title:'ダミー変数を使った重回帰分析',look:'各係数とそのP-値、補正R²、有意 F',rule:'ダミーの係数＝ほかの項目をそろえたときの、基準グループとの差',
  what:u=>`居住形態のような分類型の項目を0と1の列（{{ダミー変数}}）に置きかえて、数値の項目と一緒に回帰分析に入れます。「勉強時間が同じなら、一人暮らしの学生は実家の学生より何点低い？」がわかります。${u.gen?'':'あなたの分析では、Y＝'+u.y+'です。'}`,
  steps:u=>[`分類型の項目ごとに、基準にするグループを1つ決める（見本：居住形態の「実家」）。`,
   `Xにする列を、データの右の空いた列に<b>隣り合わせ</b>で作る：O1「勉強時間」・P1「一人暮らし」・Q1「寮」。`,
   `O2に <code>=IF(H2="","",H2)</code>、P2に <code>=IF(B2="","",IF(B2="一人暮らし",1,0))</code>、Q2に <code>=IF(B2="","",IF(B2="寮",1,0))</code> と入れ、61行目まで下へコピーする。無回答の人は空欄になる（0や基準グループとして計算しないため）。`,
   `ダミーの列は「選択肢の数−1本」（3つなら2本）。基準のグループ（実家）の列は作らない。複数回答の選択肢は、1／0の列をそのまま入れてよい。`,
   missStep('期末テスト（J列）、勉強時間（H列）、居住形態（B列）'),toolpak(),regRun('Y（見本：期末テスト J1:J61）','Xの列（O1:Q61）'),regOpt()],
  sample:()=>'<p class="cap">Xの列を作ったところ（見本データの最初の5人）</p>'+grid({cols:['B','J','O','P','Q'],rows:[['居住形態','期末テスト','勉強時間','一人暮らし','寮'],...ROWS.slice(0,5).map(r=>[r['居住形態'],r['期末テスト'],r['勉強時間'],+(r['居住形態']==='一人暮らし'),+(r['居住形態']==='寮')])],hd:i=>i===0})+regGrid(DR,{B5:['①'],B6:['①','y'],F12:['②'],B18:['③'],E18:['③'],B19:['④'],E19:['④'],B20:['⑤','y'],E20:['⑤','y']}),
  read:()=>[['① R2（B5・B6）',`重決定R²=${f2(DR.R2)}で、点数の違いの約${Math.round(DR.R2*100)}％を説明できている（0.2以上0.5未満なので「ある程度」）。補正R²（${f2(DR.adjR2)}）は、Xの数を考えに入れて調整した値。`],['② 有意 F（F12）',`${xl(DR.pF)}。式全体として1％水準で統計的に有意。`],['③ 勉強時間',`係数${f2(DR.coef[1])}、P-値${xl(DR.p[1])}。居住形態が同じなら、勉強時間1時間あたり約${f1(DR.coef[1])}点高い。`],['④ 一人暮らし',`係数${f2(DR.coef[2])}、P-値${f3(DR.p[2])}。勉強時間が同じなら、一人暮らしの学生は実家の学生より平均約${Math.round(-DR.coef[2])}点低い（5％水準で統計的に有意）。`],['⑤ 寮',`係数${f2(DR.coef[3])}、P-値${f3(DR.p[3])}。実家との差は有意とはいえない。`]],
  guide:()=>GUIDE.F()+GUIDE.R2()+GUIDE.p()+GUIDE.E(),

function chiSteps(u,shape,obs,exp,f,tot,R,Cn){
 const pRow=shape==='2×2'?11:13;const cRow=pRow+1,vRow=pRow+2;
 return [`クロス集計の手順で人数表を作る（値は「個数」、計算の種類は「<b>計算なし</b>」、「(空白)」は外す）。`,
  `ピボットテーブルの「行ラベル」のセルから右下の「総計」のセルまでを選んでコピー → 新しいシートのA2で右クリック → 「貼り付けのオプション」の「<b>値</b>」。（ピボットテーブルのままだと、次の式を右や下へコピーしたときに正しく計算できません）`,
  `貼り付けた表が見本と同じ形になっているか確かめる：${obs}に人数、D列に行の総計、${tot.slice(1)}行目に列の総計、${tot}に全体の人数。`,
  T(`{{期待度数}}の表を作る：見本の位置に見出しを書き、左上のセルに <code>=${f}</code> と入れて、右と下へコピーする（${exp}）。`),
  `p値：B${pRow}に <code>=CHISQ.TEST(${obs},${exp})</code>（合計の行と列は含めない）。`,
  `割合も出す：E3に <code>=B3/D3</code> と入れて下へコピーし、パーセント表示にする。`,
  `期待度数の表（${exp}）に、5未満の数がないか確かめる（下の「判断基準」）。`];
}
function chiGrid(s,rl,cl,lab,ttl){
 const R=s.rows.length;const rows=[[ttl],['行ラベル',...cl,'総計',lab]];
 s.O.forEach((o,i)=>rows.push([rl[i],...o,s.R[i],xpct(o[0]/s.R[i])]));
 rows.push(['総計',...s.C,s.N]);rows.push([]);
 rows.push(['期待度数',...cl]);s.E.forEach((e,i)=>rows.push([rl[i],...e]));rows.push([]);
 const pr=rows.length+1;rows.push(['p値',s.p]);rows.push(['カイ二乗値（発展）',s.chi2]);rows.push(['クラメールのV（発展）',s.V]);
 const mk={};mk['B'+pr]=['①'];for(let i=0;i<R;i++)mk['E'+(3+i)]=['②','y'];
 const totRow=3+R;
 return grid({cols:['A','B','C','D','E'],rows,mk,hd:(i,j,v)=>(j===0&&v!=='')||i===1||i===R+4})+`<p class="cap">見本データ。期待度数は B${totRow+3} に <code>=$D3*B$${totRow}/$D$${totRow}</code> と入れて右と下へコピーしたもの。B${pr} は <code>=CHISQ.TEST(B3:C${2+R},B${totRow+3}:C${totRow+2+R})</code>。</p>`;
}
function chiAdv(s,cc,vc,obs,exp,tot,mn){
 return T(`<p><b>関連の強さ：{{クラメールのV}}</b>　p値は「関係がないと仮定したら、めったに起きない結果かどうか」を示す数で、関連の<strong>強さ</strong>ではありません（人数が多いと、小さな差でも有意になります）。強さはクラメールのVで表します。</p><ol><li>{{カイ二乗値}}：${cc}に <code>=SUMPRODUCT((${obs}-${exp})^2/${exp})</code>（実際の人数と期待度数のずれを合計したもの。見本では ${f3(s.chi2)}）</li><li>V：${vc}に <code>=SQRT(${cc}/(${tot}*(${mn}-1)))</code>（MINの中は表の行の数と列の数。見本では ${f3(s.V)}）</li></ol><p>Vは0〜1の数で、0に近いほど弱く、1に近いほど強い関連です。2×2や2×3のように、どちらかの質問の選択肢が2つの表では、0.1前後で弱い、0.3前後で中程度、0.5以上で強いとされることが多いです（両方3つ以上の表では、もっと小さい値でも強いと考えます）。</p><p>レポートの「χ²(${s.df})」のかっこの数は{{自由度}}で、（行の数−1）×（列の数−1）です。</p>`);
}
function welchSteps(u,type){
 const st=u.st;const multi=!!(st&&st.purpose==='relation'&&catSlotRel(st)&&st.vars[catSlotRel(st)].kind==='M');
 const s=[`1行に1人で、グループの列（見本：C列 アルバイト）と数値の列（I列 睡眠時間）がある形にする。`,
  `空いているセル（見本ではQ列から）に、グループごとの人数を出す：<code>=SUMPRODUCT((C2:C61="あり")*ISNUMBER(I2:I61))</code>。睡眠時間に<b>数値で答えた人だけ</b>を数える式（無回答の人は数えない）。"なし"も同じように。`,
  `平均：<code>=AVERAGEIF(C2:C61,"あり",I2:I61)</code>（空欄は自動で除かれる）。`,
  T(`p値：<code>=T.TEST(FILTER(I2:I61,(C2:C61="あり")*ISNUMBER(I2:I61)),FILTER(I2:I61,(C2:C61="なし")*ISNUMBER(I2:I61)),2,${type})</code>。FILTERは「条件に合う行だけを取り出す」関数で、<code>ISNUMBER(I2:I61)</code>は「睡眠時間が数値で入っている行だけ」という条件。<b>この条件を外すと、無回答（空欄）が0時間として計算されてしまう</b>ので、必ず入れる。3つ目の「2」は{{両側検定}}、4つ目の「${type}」は${type===3?'{{Welch法}}':'等分散を仮定する方法'}という意味。`)];
 s.push(multi?`<b>複数回答の選択肢をグループにするとき</b>：比べるのは「その選択肢を選んだ人（1）」と「選ばなかった人（0）」。式の条件の <code>C2:C61="あり"</code> を <code>E2:E61=1</code>、<code>C2:C61="なし"</code> を <code>E2:E61=0</code> にする（ISNUMBERの条件はそのまま）。この質問自体に答えていない人（E列が空欄）は、どちらにも入らない。Instagram利用者とTikTok利用者のように選択肢どうしを比べると、同じ人が両方に入るので比べられない。`:`複数回答の選択肢をグループにするときは、「選んだ人（1）」と「選ばなかった人（0）」を比べる（条件の <code>C2:C61="あり"</code> を <code>E2:E61=1</code> などにする。ISNUMBERの条件はそのまま）。`);
 return s;
}
function welchGrid(hl){return grid({cols:['Q','R','S'],rows:[['','あり','なし'],['人数',W.n1,W.n2],['平均',W.m1,W.m2],['標準偏差',W.sd1,W.sd2],['平均の差',W.m1-W.m2],['p値（Welch法）',W.p],['p値（等分散を仮定）',W.p_equal]],mk:{[hl]:['①'],R3:['②','y'],S3:['②','y']},hd:(i,j)=>i===0||j===0})+`<p class="cap">見本データ（アルバイトの有無と1日の睡眠時間）。R2は <code>=SUMPRODUCT((C2:C61=R1)*ISNUMBER(I2:I61))</code>、R4は <code>=STDEV.S(FILTER(I2:I61,(C2:C61=R1)*ISNUMBER(I2:I61)))</code>、R6は <code>=T.TEST(FILTER(I2:I61,(C2:C61="あり")*ISNUMBER(I2:I61)),FILTER(I2:I61,(C2:C61="なし")*ISNUMBER(I2:I61)),2,3)</code>、R7は最後の数を2にしたもの。見本データには無回答がないので、ISNUMBERの条件があってもなくても同じ値になります。</p>`}
function welchAdv(){return `<p>FILTER関数が使えない古いExcelでは、グループの列で表全体を並べ替え、「あり」の人の範囲と「なし」の人の範囲を直接選んで T.TEST に入れます。</p><p>「データ分析」の「t 検定: 分散が等しくないと仮定した2標本による検定」を使うと、t値も表で出ます。</p><p>3つ以上のグループで2つずつt検定をくり返すと、偶然の「有意」が出やすくなります。3つ以上なら「3グループ以上の平均比較」を使います。</p><p>どちらかのグループに極端な値の人がいないかも確かめます。グループの人数が少ない（数人程度）と、t検定の結果は不安定になり、本当にある差も有意になりにくくなります。人数が少ないときは、平均と一緒に一人ひとりの値も示します。</p>`}

function catYmultiHTML(st){

 return T(`<div class="concl"><div class="tag">1. 結論：使う分析方法</div><div class="m">Xを1つずつ、Yとの関係を調べる</div><dl><dt>使う項目</dt><dd>${u.y}と、Xの1つひとつ</dd><dt>見る数字</dt><dd>それぞれの組み合わせのp値</dd><dt>判断</dt><dd>p＜0.05の組み合わせが「関係がある」</dd></dl></div>
 <div class="warn"><b>はじめに：この方法は、多変量解析の代わりにはなりません</b><p>ここで案内するのは、XとYの組み合わせを<strong>1つずつ</strong>調べる方法です。1つずつ調べると、ほかのXの影響をそろえられないので、「どのXが本当にYと関係しているのか」「ほかのXが同じでも関係があるのか」は判断できません。わかるのは、それぞれのXとYに関係があるかどうかだけです。複数のXを同時に使う分析（ロジスティック回帰などの{{多変量解析}}）は、統計ソフトで行います。</p></div>

 root.querySelectorAll('.nd').forEach(g=>{const id=g.dataset.id;g.classList.toggle('past',past.has(id)&&!cur.has(id));g.classList.toggle('cur',cur.has(id))});
 root.querySelectorAll('.ed').forEach(g=>g.classList.toggle('taken',taken.has(g.dataset.from+'>'+g.dataset.to)));
}

function openMethod(key,st,leaf){
 let h;
 if(key==='catYmulti'){h=catYmultiHTML(st)}
 else if(key==='catpred'){const info=catpredInfo(st);
  if(info.k){const k2=info.k===3?'anova3':'welch';h=conclusion(k2,st,'結果がグループで、もう一方が数値なので、向きを逆にして平均を比べます。')+methodBody(k2,st,{extra:info.intro,noPrep:true})}
  else h=`<div class="concl"><div class="tag">分析方法</div><div class="m">グループの予測（読み替え）</div><p>数値から「どのグループに入るか」を予測したいときの案内です。</p></div>`+info.intro+`<div class="btnrow"><button type="button" data-open="welch">グループが2つ：Welchのt検定</button><button type="button" data-open="anova3">グループが3つ以上：3グループ以上の平均比較</button></div>`;}
 else{const r=leaf?leafReason(leaf,st):'';h=conclusion(key,st,r)+methodBody(key,st,{noPrep:true,extra:leaf?leafExtra(leaf):''})}
 document.getElementById('dlgtitle').textContent=M[key].title;dlgbody.innerHTML=h;
 const gr=dlgbody.querySelector('#goRelation');if(gr){gr.onclick=()=>{dlg.close();startRelation(false)}}
 if(!dlg.open)dlg.showModal();dlgbody.scrollTop=0;dlg.scrollTop=0;
}

/* ========== 用語の辞書 ========== */
const DICT={
 '分類型':'答えがグループ名になる質問。例：居住形態（実家・一人暮らし・寮）、賛成・反対。足し算や平均には使いません。',
 '数値型':'答えが計算できる数の質問。例：睡眠時間 6.5時間、テスト72点。平均を出せます。5段階以上の評価も点数にして数値型として扱うのが、この授業の方針です（先生の指示があればそちらを優先）。',
 '複数回答':'いくつでも選べる質問。例：「使っているSNSをすべて選んでください」。選択肢ごとに「選んだ＝1、選ばない＝0」の列に分けて分析します。',
 '自由記述':'文章で自由に答える質問。例：「大学生活で困っていること」。',
 'リッカート尺度':'「とてもそう思う〜全くそう思わない」のように、段階で答える質問の形。段階評価ともいいます。',
 '平均':'全員の値を足して、人数で割った値。例：3人の睡眠時間が5・6・7時間なら、平均は6時間。',
 '中央値':'値を小さい順に並べたとき、真ん中にくる値。例：5・6・20時間なら、中央値は6時間（平均は約10.3時間）。極端な値に引っ張られにくい。',
 '標準偏差':'値が平均のまわりにどれくらい散らばっているかを表す数。小さいほど、みんなが平均に近い。',
 '外れ値':'ほかの人から極端に離れた値。例：睡眠時間がほとんど6〜7時間なのに、1人だけ15時間。入力ミスのこともあるので確かめます。',
 'ピボットテーブル':'Excelの集計機能。マウスで項目をドラッグするだけで、人数や平均の表を作れます。',
 'クロス集計':'2つの質問を組み合わせた人数表。例：居住形態（縦）×アルバイトの有無（横）。',
 'コード化':'自由記述を読んで、「授業」「お金」などのテーマの印をつけること。印をつけると数えられるようになります。',
 '検定':'「差や関係がない」と仮定したとき、今回の結果がどれくらい起こりにくいかを、確率（p値）で判断する方法。',
 'p値':'本当は差や関係がないと仮定したとき、今回と同じくらい、またはそれ以上に極端な結果が偶然に出る確率。0.05未満なら5％水準で有意とします。',
 '有意':'「統計的に有意」とは、差や関係がないと仮定すると今回の結果はめったに起きない（p値が基準の0.05や0.01より小さい）という意味。例：ふつうのコインで10回中9回以上表が出る確率は約1.1％（片側）。それが起きたら「偏っているのでは？」と考えるのと同じです。「差が大きい」「重要だ」という意味ではありません。',
 '片側検定':'「上がった」のように、一方の向きの差だけを調べる検定。このナビでは使いません。',
 '有意水準':'p値がいくつ未満なら「有意」とするかの基準。ふつうは5％（0.05）。より厳しい1％（0.01）も使います。',
 '期待度数':'「2つの質問に関係がない」としたら、人数表の各マスに入るはずの人数。行の合計×列の合計÷全体の人数で計算します。',
 'カイ二乗値':'実際の人数と期待度数のずれの大きさを、表全体でまとめた数（χ²と書きます）。大きいほどずれが大きい。',
 'クラメールのV':'クロス集計の2つの質問の関連の強さを、0〜1で表す数。p値とちがい、人数の多さに左右されにくい。',
 '自由度':'レポートで「χ²(2)」「F(2,57)」のように、かっこの中に書く数。表の大きさや人数から決まります。Excelの出力表にも書かれています。',
 'マクネマー検定':'同じ人に同じ質問を2回したとき、答えの変化（反対→賛成、賛成→反対）の人数の差が、変化がないと仮定したときに起こりにくい差かを確かめる検定。',
 't検定':'2つの平均の差が、「本当は差がない」と仮定したときに起こりにくい差かどうかを、p値で確かめる検定。',
 '対応あり':'同じ人を2回測ったデータ（授業の前と後など）。1人ひとりの差をもとに比べます。',
 '対応なし':'別々の人のグループどうしのデータ（アルバイトをしている人／していない人など）。',
 '両側検定':'「上がった」「下がった」のどちらの向きの差も見つけようとする検定。ふつうはこちらを使います。T.TESTの3つ目の数を2にします。',
 'Welch法':'2つのグループのばらつきがちがっていても使えるt検定の方法。迷ったらこれを使います。T.TESTの4つ目の数を3にします。',
 '等分散':'2つのグループで、値のばらつき（散らばり方）が同じであること。',
 '相関係数':'2つの数値が一緒に動く程度を−1〜＋1で表す数（r）。＋は同じ向き、−は逆向き。0に近いほど関係が弱い。',
 '散布図':'1人を1つの点にして、横軸と縦軸に2つの数値をとったグラフ。点の並び方で関係の形がわかります。',
 '回帰分析':'結果（Y）を、ほかの項目（X）で説明する式を作る分析。「Xが1増えるとYがいくつ増えるか」がわかります。',
 '係数':'回帰分析で、「Xが1増えるとYがいくつ増えるか」を表す数。−なら減ります。ダミー変数の係数は「基準グループとの平均の差」。',
 '切片':'回帰分析で、Xがすべて0のときのYの予測値。ダミー変数だけの回帰では、基準グループの平均になります。',
 '決定係数':'R²（Excelでは「重決定 R2」）。Yの人による違いのうち、Xで説明できる割合。0〜1の数で、0.40なら40％。',
 '補正R²':'Xの数を増やすだけでR²が上がってしまう点を調整した値（Excelでは「補正 R2」）。Xの数がちがう式どうしを比べるときに使います。説明できる割合は、R²のほうで読みます。',
 '有意F':'回帰分析で、「Xはどれも Y と関係がない」と仮定したときに、今回と同じくらい、またはそれ以上にYを説明できる結果が出る確率（p値）。Excelでは「有意 F」。0.05未満なら式全体として有意。',
 'ダミー変数':'分類型の答えを0と1で表した列。例：一人暮らし＝1、それ以外＝0。グループの数より1本少なく作ります。',
 '基準グループ':'ダミー変数を作らなかったグループ（全部の列が0になるグループ）。ほかのグループの係数は、このグループとの差を表します。',
 '多重共線性':'回帰分析で、Xどうしが強く関係しているために、どのXの影響なのかを分けられず、係数が大きくぶれたりP-値が大きくなったりすること。Xどうしの相関係数を確かめ、強く関係する組み合わせはどちらか1つにします。',
 'E表記':'とても小さい（大きい）数の書き方。6.14E-08は0.0000000614のこと。「E-08」は小数点を左へ8けた動かすという意味。',
 '多変量解析':'たくさんの項目を同時に使って、それぞれの影響をそろえながら分析する方法の総称。重回帰分析やロジスティック回帰など。',
 'ロジスティック回帰':'数値などから「どのグループに入るか（はい／いいえなど）」を予測する分析。Excelの標準機能では難しく、統計ソフトを使います。',
 '分析ツール':'Excelに付いている統計の道具（アドイン）。有効にすると「データ」タブに「データ分析」が出て、回帰分析などができます。'
};

function csv(){const q=v=>{const s=String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};return '﻿'+[COLS.join(','),...ROWS.map(r=>COLS.map(c=>q(r[c])).join(','))].join('\r\n')+'\r\n'}
function dataInfoHTML(){
 const desc={ID:'回答者の番号','居住形態':'実家／一人暮らし／寮（分類型）','アルバイト':'あり／なし（分類型）','サークル':'加入／未加入（分類型）','Instagram':'使っているSNS（複数回答）：選んだ＝1、選ばない＝0','TikTok':'同上','YouTube':'同上','勉強時間':'1週間の勉強時間（時間、数値型）','睡眠時間':'1日の平均睡眠時間（時間、数値型）','期末テスト':'期末テストの点数（100点満点）','小テスト前':'授業前の小テスト（100点満点）','小テスト後':'授業後の小テスト（同じ学生）','授業前の賛否':'賛成／反対（授業前）','授業後の賛否':'賛成／反対（授業後、同じ質問）'};
 return `<p>このナビの見本の数字は、架空の大学生60人のアンケート（下の列）から実際に計算したものです。CSVをダウンロードしてExcelで開き、同じ操作をすると、見本と同じ数字が出ます（1行目が見出し、2〜61行目がデータ）。</p><div class="btnrow"><button type="button" class="primary" id="dlcsv">見本データ（CSV）をダウンロード</button></div><table class="rule"><tr><th>列</th><th>見出し</th><th>中身</th></tr>${COLS.map((c,i)=>`<tr><td>${LET[i]}</td><td>${esc(c)}</td><td>${esc(desc[c]||'')}</td></tr>`).join('')}</table>`;
}
function openData(){document.getElementById('dlgtitle').textContent='見本データについて';dlgbody.innerHTML=dataInfoHTML();bindCsv(dlgbody);if(!dlg.open)dlg.showModal()}
function bindCsv(root){const b=root.querySelector('#dlcsv');if(b)b.onclick=()=>{const blob=new Blob([csv()],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='survey-analysis-navi-v1.3.2-sample-data.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}}
