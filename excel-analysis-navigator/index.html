i22_y'},{key:'big',edge:'それ以上',to:'L_chi23_y'}]},\n\n /* --- 図B：質問の種類の見分け方 --- */\n B_how:{t:'q',sub:true,chart:'答え方は？',title:s=>slotTitle(s)+'の答え方はどれですか？',help:s=>slotHelp[s.sub.slotKey],ch:[\n  {label:'いくつでも選べる（複数回答）',ex:'例：使っているSNSをすべて選ぶ',edge:'複数回答',to:'B_M'},\n  {label:'実際の数値を書く',ex:'例：睡眠時間 6.5時間、テスト 72点、アルバイト代 45000円',edge:'数値を書く',to:'B_N'},\n  {label:'段階で評価する',ex:'例：とても満足／満足／ふつう／不満／とても不満',edge:'段階で評価',to:'B_scale'},\n  {label:'選択肢から1つ選ぶ',ex:'例：居住形態、学部、賛成・反対。「1時間未満／1〜3時間／3時間以上」のような数値の範囲から選ぶ質問もここ',edge:'1つ選ぶ',to:'B_count'},\n  {label:'文章で自由に書く',ex:'例：大学生活で困っていること',edge:'自由記述',to:'B_T'}]},\n B_scale:{t:'q',sub:true,chart:'何段階？',title:'何段階で答える質問ですか？',help:'この授業では、5段階以上の評価を「とても満足＝5点、満足＝4点、ふつう＝3点…」のように点数にして、数値として扱う方針です。先生から別の指示があるときは、そちらに従ってください。',ch:[\n  {label:'5段階以上',ex:'例：1〜5点、1〜7点',edge:'5段階以上',to:'B_N2'},\n  {label:'3段階・4段階',ex:'例：そう思う／どちらでもない／そう思わない',edge:'3〜4段階',to:'B_C3s'}]},\n B_count:{t:'q',sub:true,chart:'選択肢の\\n数は？',title:'選択肢はいくつありますか？',help:'「無回答」は数えません。数値の範囲から選ぶ質問は、範囲の数を数えます。',ch:[\n  {label:'2つ',ex:'例：あり・なし、賛成・反対',edge:'2つ',to:'B_C2'},\n  {label:'3つ以上',ex:'例：実家・一人暮らし・寮',edge:'3つ以上',to:'B_C3'}]},\n B_M:{t:'out',kind:'M',chart:'複数回答'},\n B_N:{t:'out',kind:'N',chart:'数値型'},\n B_N2:{t:'out',kind:'N',likert:true,chart:'数値型（段階を点数に）'},\n B_C3s:{t:'out',kind:'C3',likert:true,chart:'分類型（3つ以上）'},\n B_C2:{t:'out',kind:'C2',chart:'分類型（2つ）'},\n B_C3:{t:'out',kind:'C3',chart:'分類型（3つ以上）'},\n B_T:{t:'out',kind:'T',chart:'自由記述'},\n\n /* --- 到達先（分析方法） --- */\n L_single_cat:{t:'leaf',m:'single_cat'},L_single_multi:{t:'leaf',m:'single_multi'},L_single_num:{t:'leaf',m:'single_num'},L_text_s:{t:'leaf',m:'text'},\n L_text_r:{t:'leaf',m:'text'},L_pairedcat:{t:'leaf',m:'pairedcat'},L_cross:{t:'leaf',m:'cross'},L_chi22:{t:'leaf',m:'chi22'},L_chi23:{t:'leaf',m:'chi23'},\n L_corr:{t:'leaf',m:'corr'},L_paired:{t:'leaf',m:'paired'},L_catpred_r:{t:'leaf',m:'catpred'},L_anova3_r:{t:'leaf',m:'anova3'},L_welch:{t:'leaf',m:'welch'},L_equal:{t:'leaf',m:'equal'},\n L_text_y:{t:'leaf', 03c/tr>\u003ctr>\u003ctd>p≧0.05\u003c/td>\u003ctd>5％水準では統計的に有意とはいえない\u003c/td>\u003c/tr>\u003c/table>\u003cp>「{{有意|統計的に有意}}」とは、「差や関係がないと仮定すると、今回の結果はめったに起きない（p値が基準より小さい）」という意味です。\u003c/p>\u003c/div>`),\n r:()=>T(`\u003cdiv class=\"guide\">\u003cb>相関係数 r の読み方（この授業の目安）\u003c/b>\u003cp>r は−1から＋1までの数です。\u003cstrong>＋かーか\u003c/strong>で関係の向き、\u003cstrong>0からどれだけ離れているか（絶対値）\u003c/strong>で関係の強さを表します。\u003c/p>\u003cp>＋：一方が大きい人ほど、もう一方も大きい。−：一方が大きい人ほど、もう一方は小さい。\u003c/p>\u003ctable class=\"rule\">\u003ctr>\u003cth>rの絶対値\u003c/th>\u003cth>読み方\u003c/th>\u003c/tr>\u003ctr>\u003ctd>0.2未満\u003c/td>\u003ctd>ほとんど相関がない、または非常に弱い\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0.2以上0.4未満\u003c/td>\u003ctd>弱い相関\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0.4以上0.7未満\u003c/td>\u003ctd>中程度の相関\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0.7以上\u003c/td>\u003ctd>強い相関\u003c/td>\u003c/tr>\u003c/table>\u003c/div>`),\n R2:()=>T(`\u003cdiv class=\"guide\">\u003cb>{{決定係数|決定係数 R²}} の読み方（この授業の目安）\u003c/b>\u003cp>R²は0から1までの数で、「結果（Y）の人による違いのうち、Xで説明できる割合」です。0.40なら40％を説明できています。\u003c/p>\u003ctable class=\"rule\">\u003ctr>\u003cth>R²\u003c/th>\u003cth>読み方\u003c/th>\u003c/tr>\u003ctr>\u003ctd>0.2未満\u003c/td>\u003ctd>説明できる部分は小さい\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0.2以上0.5未満\u003c/td>\u003ctd>ある程度説明できている\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0.5以上\u003c/td>\u003ctd>比較的多くの部分を説明できている\u003c/td>\u003c/tr>\u003c/table>\u003cp>R²は合格・不合格の基準ではありません。人の行動や意見はたくさんの要因で決まるので、アンケート調査ではR²が小さくなることがよくあります。R²が小さくても、係数から「関係の向きと大きさ」を読み取ることには意味があります。ただし、R²が小さいときは、Xだけで1人ひとりのYを言い当てるのは難しい、と考えます。R²が大きくても、XがYの原因だとは限りません。\u003c/p>\u003cp>Xを増やすとR²は必ず増える（減らない）ので、Xの数がちがう式どうしを比べるときは{{補正R²}}を使います。\u003c/p>\u003c/div>`),\n F:()=>T(`\u003cdiv class=\"guide\">\u003cb>{{有意F}}と係数の読み方\u003c/b>\u003cp>\u003cstrong>有意 F\u003c/strong>は、「Xはどれも Y と関係がない」と仮定したとき、今回と同じくらい、またはそれ以上にYを説明できる結果が出る確率（p値）です。0.05未満なら、式全体として有意です。\u003c/p>\u003cp>\u003cstrong>{{係数}}\u003c/strong>は「Xが1増えると、Yがどれだけ増えるか（−なら減るか）」です。その行の\u003cstrong>P-値\u003c/strong>が0.05未満なら、その項目の関係は5％水準で有意です。単位がちがう項目どうし（時間と点数など）の係数の大きさを、そのまま比べてはいけません。\u003c/p>\u003c/div>`),\n E:()=>T(`\u003cdiv class=\"guide\">\u003cb>「6.14E-08」のような表示\u003c/b>\u003cp>Excelは、とても小さい数を{{E表記}}で表示します。\u003ccode>6.14E-08\u003c/code>は「6.14の小数点を左へ8けた動かした数」＝0.0000000614のことです。0.001よりずっと小さいので、レポートでは「p&lt;0.001」と書きます。\u003c/p>\u003c/div>`),\n E5:()=>T(`\u003cdiv class=\"guide\">\u003cb>{{期待度数}}の条件\u003c/b>\u003cp>期待度数の表の数が小さすぎると、p値が正しく出ません。目安は次のとおりです。\u003c/p>\u003ctable class=\"rule\">\u003ctr>\u003ctd>2×2の表\u003c/td>\u003ctd>4つのマスがすべて5以上\u003c/td>\u003c/tr>\u003ctr>\u003ctd>それより大きい表\u003c/td>\u003ctd>1未満のマスがなく、5未満のマスが全体の20％以下\u003c/td>\u003c/tr>\u003c/table>\u003cp>\u003cb>満たさないときの考え方\u003c/b>\u003c/p>\u003cul>\u003cli>人数と割合の表（クロス集計）を示し、「人数が少ないため検定は行わなかった」と書く。これだけでもレポートになります。\u003c/li>\u003cli>意味が近く、まとめても問いが変わらない選択肢（例：「とても満足」と「満足」）を、\u003cstrong>分析の前に決めた方針で\u003c/strong>まとめるのはかまいません。\u003c/li>\u003cli>検定をするためだけに、意味の異なる選択肢（例：「寮」と「一人暮らし」、「経済学部」と「文学部」）をまとめてはいけません。問いそのものが変わってしまいます。\u003c/li>\u003cli>どうしても検定が必要なときは、先生に相談してください。\u003c/li>\u003c/ul>${E5ex()}\u003c/div>`)\n};\n\nfunction E5ex(){\n const O=[[5,1],[4,2],[2,2],[1,3]],rl=['経済','社会','法','文'],cl=['賛成','反対'];\n const R=O.map(r=>r[0]+r[1]),Cc=[0,1].map(j=>O.reduce((a,r)=>a+r[j],0)),N=R.reduce((a,b)=>a+b,0);\n const E=O.map((r,i)=>r.map((v,j)=>R[i]*Cc[j]/N));const flat=E.flat();const small=flat.filter(v=>v\u003c5).length,tiny=flat.filter(v=>v\u003c1).length;\n const rows=[['行ラベル',...cl,'総計'],...O.map((r,i)=>[rl[i],...r,R[i]]),['総計',...Cc,N],[],['期待度数',...cl],...E.map((e,i)=>[rl[i],...e])];\n const mk={};E.forEach((e,i)=>e.forEach((v,j)=>{if(v\u003c5)mk['BC'[j]+(9+i)]=['!','y']}));\n return `\u003cp>\u003cb>条件を満たさない例\u003c/b>（学部×賛否、${N}人）\u003c/p>`+grid({cols:['A','B','C','D'],rows,mk,hd:(i,j,v)=>(j===0&&v!=='')||i===0||i===7})+`\u003cp class=\"cap\">期待度数が5未満のマスは${flat.length}マス中${small}マス（${Math.round(small/flat.length*100)}％）、1未満は${tiny}マス。20％を超えるので、この表ではカイ二乗検定の結果を信用できません。人数と割合を示すにとどめます。\u003c/p>`;\n}\n\n/* ========== 分析方法ごとの内容 ========== */\nconst PART=[[1001,72,75],[1002,65,null],[1003,null,70],[1004,80,84],[1005,58,63],[1006,90,88],[1007,61,null],[1008,null,66]];\nconst PARTS=(()=>{const b=PART.filter(r=>r[1]!==null&&r[2]!==null);const m=a=>a.reduce((x,y)=>x+y,0)/a.length;return {n:b.length,m1:m(b.map(r=>r[1])),m2:m(b.map(r=>r[2])),n1:PART.filter(r=>r[1]!==null).length,n2:PART.filter(r=>r[2]!==null).length}})();\nconst W=S?S.welch:null,P=S?S.paired:null,C=S?S.corr:null,X22=S?S.chi22:null,X23=S?S.chi23:null,PC=S?S.pairedcat:null,SR=S?S.simple:null,MR=S?S.multi:null,DR=S?S.dummy:null,DS=S?S.dsimple:null,A3=S?S.anova3:null;\nconst toolpak=()=>T(`（初めて使うときだけ）「データ分析」を使えるようにする：\u003cb>ファイル → オプション → アドイン\u003c/b> → 下の「管理」で「Excel アドイン」を選んで\u003cb>設定\u003c/b> → 「分析ツール」にチェック → OK。Macは\u003cb>ツール → Excel アドイン\u003c/b> → 「分析ツール」にチェック。`);\nconst regRun=(y,x)=>T(`\u003cb>データ\u003c/b>タブ → 右端の\u003cb>データ分析\u003c/b> → 「回帰分析」→ OK。「入力 Y 範囲」に${y}、「入力 X 範囲」に${x}を、どちらも\u003cb>見出しの行ごと\u003c/b>選んで入れる。`);\nconst regOpt=()=>`「ラベル」にチェックを入れ、出力オプションで「新規ワークシート」を選んで OK。新しいシートに結果の表が出る。`;\nconst missStep=(what)=>T(`\u003cb>無回答（空欄）の行を除く\u003c/b>：回帰分析は、使う列に1つでも空欄があると計算できません。また、無回答を0として計算してはいけません。シート見出しを右クリック →「移動またはコピー」→「コピーを作成する」にチェック → OK で、データのコピーを作る。コピーのシートで、${what}のどれかが空欄の行を削除する（\u003cb>データ\u003c/b> → \u003cb>フィルター\u003c/b> → 列の▼で「(空白セル)」だけにチェック → 表示された行を選んで右クリック →「行の削除」→ ▼で「すべて選択」に戻す。これを、ここに挙げた\u003cb>列ごとにくり返し\u003c/b>、最後にもう一度\u003cb>フィルター\u003c/b>を押して解除）。行を削除したら、次の手順の範囲の最後の行番号も、残った行に合わせる（見本データには無回答がないので61行目まで）。`);\n\nconst M={\n single_cat:{title:'単純集計（人数と割合）',look:'答えごとの人数と割合（％）',rule:'いちばん多い答えと、その割合をつかむ',\n  what:u=>`${u.v1}で、どの答えが何人・何％いるかを数えます。アンケート分析の第一歩です。全体の姿がひと目でわかり、次にどんな比較をすればよいかも見えてきます。`,\n  steps:u=>[`データを「1行に1人、1列に1つの質問」の形に並べる。1行目は見出しにする（見本データの形）。`,\n   `表の中のどこかを1回クリック → \u003cb>挿入\u003c/b>タブ → \u003cb>ピボットテーブル\u003c/b> → そのまま OK。新しいシートに空の{{ピボットテーブル}}ができる。`,\n   `右側の「ピボットテーブルのフィールド」で、${u.v1}（見本：居住形態）を「\u003cb>行\u003c/b>」の欄へドラッグする。`,\n   `同じ項目をもう一度「\u003cb>値\u003c/b>」の欄へドラッグする。文字の項目は自動で「個数」（＝人数）になる。`,\n   `割合も出す：同じ項目をもう一度「値」へ入れる → 「値」の欄に増えた項目をクリック → \u003cb>値フィールドの設定\u003c/b> → 「\u003cb>計算の種類\u003c/b>」タブ → 「総計に対する比率」→ OK。`,\n   `無回答があるときは、表の「行ラベル」の▼をクリックし、「(空白)」のチェックを外す。`,\n   `グラフにする：表の中をクリック → \u003cb>挿入\u003c/b>タブ → 縦棒グラフ。多い順に並べると読みやすい。`],\n  sample:()=>{const s=S.single_cat;return grid({cols:['A','B','C'],r0:3,rows:[['行ラベル','個数 / 居住形態','個数 / 居住形態2'],...s.labels.map((l,i)=>[l,s.counts[i],xpct(s.pct[i]/100)]),['総計',S.n,'100.00%']],mk:{B4:['①'],B5:['①'],B6:['①'],C4:['②','y'],C5:['②','y'],C6:['②','y']},hd:(i,j)=>i===0||i===4})+'\u003cp class=\"cap\">ピボットテーブルの完成形（見本データ）。C列は「計算の種類」を「総計に対する比率」にした列。行の並び順は、データによって変わることがあります。\u003c/p>'},\n  read:()=>{const s=S.single_cat;return [['① ② どこを見るか','①B列の人数（B4〜B6）と、②C列の割合（C4〜C6）。'],['② 数字の意味',`実家は${s.counts[0]}人で全体の${pct(s.pct[0])}。一人暮らしは${s.counts[1]}人（${pct(s.pct[1])}）、寮は${s.counts[2]}人（${pct(s.pct[2])}）。`],['③ わかったこと','回答者の半分が実家から通っている。一人暮らしは3割、寮は2割。']]},\n  guide:()=>T(`\u003cdiv class=\"guide\">\u003cb>割合の出し方と書き方\u003c/b>\u003cp>割合＝その答えの人数÷答えた人数×100。無回答の人は分母に入れません。レポートでは、割合と人数（n）を両方書きます。\u003c/p>\u003c/div>`),\n  report:()=>{const s=S.single_cat;return `居住形態をたずねたところ、実家が${s.counts[0]}人（${pct(s.pct[0])}）で最も多く、一人暮らしが${s.counts[1]}人（${pct(s.pct[1])}）、寮が${s.counts[2]}人（${pct(s.pct[2])}）であった（n=${S.n}）。`},\n  adv:()=>`\u003cp>選択肢が多いときは、人数の少ない答えを「その他」にまとめると読みやすくなります。\u003c/p>\u003cp>関数でも数えられます：\u003ccode>=COUNTIF(B2:B61,\"実家\")\u003c/code>。割合は \u003ccode>=COUNTIF(B2:B61,\"実家\")/COUNTA(B2:B61)\u003c/code>（COUNTAは空欄を数えないので、無回答は分母から自然に外れます）。\u003c/p>`},\n\n single_multi:{title:'単純集計（複数回答）',look:'選択肢ごとの「選んだ人の割合」',rule:'割合の高い順に並べる（合計は100％を超えてよい）',\n  what:u=>`いくつでも選べる質問（{{複数回答}}）では、選択肢ごとに「選んだ人の割合」を出します。1人がいくつも選ぶので、合計は100％を超えます。どの選択肢がよく選ばれているかがひと目でわかります。`,\n  steps:u=>[`データの準備：選択肢ごとに列を作り、\u003cb>選んだ＝1、選ばない＝0\u003c/b>を入れる（見本：E列 Instagram、F列 TikTok、G列 YouTube）。この質問そのものに答えていない人は\u003cb>空欄のまま\u003c/b>にする（0にしない）。`,\n   `空いているセル（見本ではQ列から）に、選んだ人数を出す：\u003ccode>=SUM(E2:E61)\u003c/code>`,\n   `割合を出す：\u003ccode>=AVERAGE(E2:E61)\u003c/code> → \u003cb>ホーム\u003c/b>タブの「%」ボタンでパーセント表示にする。AVERAGEは空欄を数えないので、無回答の人は自動で分母から外れる。`,\n   `式を右へコピーして、ほかの選択肢も出す。`,\n   `グラフにする：割合の行を選んで \u003cb>挿入\u003c/b> → 横棒グラフ。多い順に並べ替えると読みやすい。`],\n  sample:()=>{const s=S.single_multi;return grid({cols:['Q','R','S','T'],rows:[['',...s.labels],['選んだ人数',...s.counts],['割合',...s.pct.map(v=>xpct(v/100))],['答えた人数',S.n,S.n,S.n]],mk:{R3:['①']},hd:(i,j)=>i===0||j===0})+'\u003cp class=\"formulas\">入れた式（R列）：R2 \u003ccode>=SUM(E2:E61)\u003c/code>　R3 \u003ccode>=AVERAGE(E2:E61)\u003c/code>　R4 \u003ccode>=COUNT(E2:E61)\u003c/code>\u003c/p>'},\n  read:()=>{const s=S.single_multi;const tot=s.pct.reduce((a,b)=>a+b,0);return [['① どこを見るか','3行目の割合（R3〜T3）。'],['② 数字の意味',`Instagramを使っている人は${pct(s.pct[0])}、TikTokは${pct(s.pct[1])}、YouTubeは${pct(s.pct[2])}。合計は${pct(tot)}で、1人平均${(tot/100).toFixed(2)}個を選んでいる。`],['③ わかったこと','最もよく使われているSNSはInstagramで、5人に4人が使っている。']]},\n  guide:()=>T(`\u003cdiv class=\"guide\">\u003cb>複数回答の割合\u003c/b>\u003cp>分母は「選択肢を選んだ数の合計」ではなく、「この質問に答えた人数」です。合計が100％を超えるのは正しい結果です。\u003c/p>\u003c/div>`),\n  report:()=>{const s=S.single_multi;return `使っているSNSをすべて選んでもらったところ（複数回答、n=${S.n}）、Instagramが${pct(s.pct[0])}で最も多く、TikTok（${pct(s.pct[1])}）、YouTube（${pct(s.pct[2])}）が続いた。`},\n  adv:()=>`\u003cp>1人あたり何個選んだかは、選択肢の列を横に合計した列（\u003ccode>=SUM(E2:G2)\u003c/code>）を作り、その平均を出すとわかります。\u003c/p>\u003cp>2つの選択肢の割合の差（InstagramとTikTokなど）を検定することは、同じ人が両方に答えているため、このナビの範囲外です。\u003c/p>`},\n\n single_num:{title:'単純集計（平均・中央値・ばらつき）',look:'平均、中央値、標準偏差',rule:'平均と中央値が近いかを確かめ、ばらつきも添える',\n  what:u=>`${u.v1}の数値を、{{平均}}・{{中央値}}・{{標準偏差}}の3つの数にまとめます。「ふつうはどれくらいか」と「人によってどれくらい違うか」がわかります。`,\n  steps:u=>[`${u.v1}の列を確かめる（見本：I列 睡眠時間）。数字以外（「6時間」のような文字）が入っていないかも確認する。`,\n   `空いているセル（見本ではQ列から）に、人数 \u003ccode>=COUNT(I2:I61)\u003c/code> と平均 \u003ccode>=AVERAGE(I2:I61)\u003c/code> を入れる。`,\n   `中央値 \u003ccode>=MEDIAN(I2:I61)\u003c/code>、標準偏差 \u003ccode>=STDEV.S(I2:I61)\u003c/code> を入れる。`,\n   `いちばん小さい値 \u003ccode>=MIN(I2:I61)\u003c/code>、いちばん大きい値 \u003ccode>=MAX(I2:I61)\u003c/code> も出す。`,\n   `グラフにする：列を選んで \u003cb>挿入\u003c/b> → 「統計グラフの挿入」→ \u003cb>ヒストグラム\u003c/b>。どのあたりに人が多いかが見える。`],\n  sample:()=>{const s=S.single_num;return grid({cols:['Q','R','S'],rows:[['項目','結果','入れた式'],['人数',s.n,'=COUNT(I2:I61)'],['平均',s.mean,'=AVERAGE(I2:I61)'],['中央値',s.median,'=MEDIAN(I2:I61)'],['標準偏差',s.sd,'=STDEV.S(I2:I61)'],['最小',s.min,'=MIN(I2:I61)'],['最大',s.max,'=MAX(I2:I61)']],mk:{R3:['①'],R4:['②'],R5:['③']},hd:(i,j)=>i===0||j===0})+'\u003cp class=\"cap\">見本データの睡眠時間（1日の平均、時間）。S列は説明のために式を文字で書いたもの。\u003c/p>'},\n  read:()=>{const s=S.single_num;const mins=Math.round((s.mean-Math.floor(s.mean))*60);return [['① どこを見るか','R3（平均）、R4（中央値）、R5（標準偏差）。'],['② 数字の意味',`平均は${f2(s.mean)}時間（約${Math.floor(s.mean)}時間${mins}分）。中央値${s.median}時間は、小さい順に並べた真ん中の人の値。標準偏差${f2(s.sd)}は、睡眠時間の散らばりの大きさが約${f1(s.sd)}時間であることを表す。平均±標準偏差に含まれる割合は分布によって異なる。`],['③ わかったこと','学生の睡眠時間は1日約6.4時間。平均と中央値はほぼ同じだが、外れ値の有無は分布を確認する必要がある。']]},\n  guide:()=>T(`\u003cdiv class=\"guide\">\u003cb>平均と中央値のどちらを使う？\u003c/b>\u003cp>平均と中央値が大きくちがうときは、分布の偏りや{{外れ値}}の影響が考えられます。そのときは中央値を中心に書きます（例：アルバイト代、通学時間）。\u003c/p>\u003c/div>`),\n  report:()=>{const s=S.single_num;return `1日の平均睡眠時間は${f2(s.mean)}時間（中央値${s.median}時間、標準偏差${f2(s.sd)}時間、n=${s.n}）であった。`},\n  adv:()=>`\u003cp>5段階以上の評価を点数にした質問でも、同じ方法で平均を出せます。ただし「平均3.6点」が何を意味するかは、選択肢の言葉（4＝満足など）に戻して説明します。\u003c/p>`},\n\n text:{sampleNote:'架空の自由記述8件の例です（60人の見本データとは別）。',title:'内容分析（自由記述のまとめ）',look:'テーマごとの件数と割合',rule:'多いテーマと代表的な回答をつかむ',\n  what:u=>`文章の答えは、そのままでは数えられません。内容を読んで「テーマ」の印をつける（{{コード化}}）と、どのテーマが多いかを数えられます。印をつけた列は分類型になるので、ほかの質問とクロス集計もできます。`,\n  steps:u=>[`回答をすべて読み、よく出てくるテーマを4〜6個決める（例：授業、お金、通学、人間関係、その他）。`,\n   `回答の右に、テーマごとの列を作る。当てはまれば1、当てはまらなければ0を入れる。1つの回答に2つのテーマがあれば、両方に1を入れてよい。`,\n   `テーマごとの件数：\u003ccode>=SUM(B2:B9)\u003c/code>、割合：\u003ccode>=AVERAGE(B2:B9)\u003c/code>（パーセント表示にする）。式を右へコピーする。`,\n   `件数の多い順に並べ、横棒グラフにする。`,\n   `代表的な回答を1〜2個選んで、レポートで引用する（名前など、個人が特定される部分は消す）。`,\n   `さらに分析するとき：テーマの列（1／0）を分類型の質問として、このナビの「2つの質問の関係」でほかの質問と組み合わせる。`,\n   T(`回帰分析のXに使うとき（数値化）：テーマの1／0の列を{{ダミー変数}}としてXに入れる（「ダミー変数を使った重回帰分析」の手順）。1つの回答に複数のテーマがあってよく、複数回答の選択肢と同じように扱う。どのテーマにも当てはまらない回答は全部0、自由記述に何も書いていない人は空欄にして、分析から除く。`)],\n  sample:()=>{const R=[['回答','授業','お金','通学','人間関係'],['課題が多くて寝る時間がない',1,0,0,0],['通学に片道1時間半かかる',0,0,1,0],['教科書代が高い',0,1,0,0],['サークルで友だちができない',0,0,0,1],['アルバイトと授業の両立が大変',1,1,0,0],['電車が混んでいて疲れる',0,0,1,0],['グループワークで話すのが苦手',1,0,0,1],['一人暮らしで食費がかかる',0,1,0,0],['件数',3,3,2,2],['割合','37.50%','37.50%','25.00%','25.00%']];\n   return grid({cols:['A','B','C','D','E'],rows:R,mk:{B10:['①'],B11:['②']},hd:(i,j)=>i===0||i>=9})+'\u003cp class=\"cap\">「大学生活で困っていること」の自由記述8件に印をつけた例（架空）。10行目は \u003ccode>=SUM(B2:B9)\u003c/code>、11行目は \u003ccode>=AVERAGE(B2:B9)\u003c/code>。\u003c/p>'},\n  read:()=>[['① どこを見るか','10行目の件数と、11行目の割合。'],['② 数字の意味','「授業」と「お金」が3件ずつ（37.5％）、「通学」と「人間関係」が2件ずつ（25.0％）。1つの回答に2つのテーマがあるので、合計は100％を超える。'],['③ わかったこと','困りごとは、授業に関するものとお金に関するものが多い。']],\n  guide:()=>T(`\u003cdiv class=\"guide\">\u003cb>印のつけ方の決まり\u003c/b>\u003cp>テーマの意味（どんな回答に1をつけるか）を最初に書き出し、途中で変えないこと。2人で別々に印をつけて、結果が合うか比べると確実です。\u003c/p>\u003c/div>`),\n  report:()=>`「大学生活で困っていること」の自由記述（8件）を内容ごとに分類したところ、授業に関するもの（3件、37.5％）とお金に関するもの（3件、37.5％）が多かった。例えば「アルバイトと授業の両立が大変」という回答がみられた。`,\n  adv:()=>`\u003cp>キーワードで数えることもできます：\u003ccode>=COUNTIF(A2:A9,\"*授業*\")\u003c/code>（「授業」という文字を含む回答の数）。ただし「講義」「課題」のような言いかえは数えられないので、最後は人が読んで確かめます。\u003c/p>`},\n\n cross:{title:'クロス集計（ピボットテーブル）',look:'グループごとの割合（行集計に対する比率）',rule:'グループの間で割合が何ポイントちがうかを見る',\n  what:u=>`2つの質問を組み合わせた人数表（{{クロス集計}}）を作り、グループごとの割合を比べます。「一人暮らしの人は、アルバイトをしている割合が高い？」のような問いに、ひと目で答えられます。`,\n  steps:u=>[`表の中をクリック → \u003cb>挿入\u003c/b> → \u003cb>ピボットテーブル\u003c/b> → OK。`,\n   `比べたいグループの質問（見本：居住形態）を「\u003cb>行\u003c/b>」へドラッグする。`,\n   `もう一方の質問（見本：アルバイト）を「\u003cb>列\u003c/b>」へドラッグする。`,\n   `どちらかの質問をもう一度「\u003cb>値\u003c/b>」へドラッグする。文字の項目なら自動で「個数」になる。「ID」のような数字の列を入れたときは「合計」になってしまうので、値の項目をクリック → \u003cb>値フィールドの設定\u003c/b> → 「集計方法」タブ → 「個数」に変える。`,\n   `割合にする：値の項目をクリック → \u003cb>値フィールドの設定\u003c/b> → 「\u003cb>計算の種類\u003c/b>」タブ → 「\u003cb>行集計に対する比率\u003c/b>」→ OK。各行の合計が100％になる。`,\n   `「(空白)」の行や列があれば、「行ラベル」「列ラベル」の▼で「(空白)」のチェックを外す。`,\n   `複数回答の質問は、選択肢ごと（見本：Instagramの1／0の列）に別々の表を作る。`],\n  sample:()=>{const s=S.cross;const cnt=grid({cols:['A','B','C','D'],r0:3,rows:[['個数 / アルバイト','列ラベル'],['行ラベル','あり','なし','総計'],...s.rows.map((r,i)=>[r,...s.O[i],s.R[i]]),['総計',...s.C,s.N]],hd:(i,j)=>i\u003c=1||j===0});\n   const per=grid({cols:['A','B','C','D'],r0:3,rows:[['個数 / アルバイト','列ラベル'],['行ラベル','あり','なし','総計'],...s.rows.map((r,i)=>[r,xpct(s.rowpct[i][0]/100),xpct(s.rowpct[i][1]/100),'100.00%']),['総計',xpct(s.C[0]/s.N),xpct(s.C[1]/s.N),'100.00%']],mk:{B5:['①'],B6:['①'],B7:['①']},hd:(i,j)=>i\u003c=1||j===0});\n   return '\u003cp class=\"cap\">人数の表（計算の種類＝計算なし）\u003c/p>'+cnt+'\u003cp class=\"cap\">割合の表（計算の種類＝行集計に対する比率）\u003c/p>'+per+'\u003cp class=\"cap\">見本データ。行の並び順は、データによって変わることがあります。\u003c/p>'},\n  read:()=>{const s=S.cross;const r=s.rowpct.map(x=>x[0]);return [['① どこを見るか','割合の表のB列（アルバイト「あり」の割合）を、行どうしで比べる。'],['② 数字の意味',`アルバイトをしている割合は、実家${pct(r[0])}、一人暮らし${pct(r[1])}、寮${pct(r[2])}。一人暮らしと寮では${(r[1]-r[2]).toFixed(1)}ポイントの差がある。`],['③ わかったこと','一人暮らしの学生はアルバイトをしている割合が高く、寮の学生は低い。この差が統計的に有意かどうかは、カイ二乗検定で確かめられる。']]},\n  guide:()=>T(`\u003cdiv class=\"guide\">\u003cb>どちらを「行」にする？\u003c/b>\u003cp>比べたいグループ（原因と考える側。見本では居住形態）を「行」にして、「行集計に対する比率」を出します。こうすると、グループごとの割合を縦に並べて比べられます。\u003c/p>\u003cp>差は「何ポイント」で表します（50.0％と83.3％なら33.3ポイントの差）。\u003c/p>\u003c/div>`)+`\u003cdiv class=\"btnrow\">\u003cbutton type=\"button\" data-open=\"chi23\">この差を検定する：カイ二乗検定の説明を見る\u003c/button>\u003c/div>`,\n  report:()=>{const s=S.cross;const r=s.rowpct.map(x=>x[0]);return `居住形態別にアルバイトをしている割合をみると、一人暮らしが${pct(r[1])}（${s.R[1]}人中${s.O[1][0]}人）と最も高く、実家が${pct(r[0])}（${s.R[0]}人中${s.O[0][0]}人）、寮が${pct(r[2])}（${s.R[2]}人中${s.O[2][0]}人）であった。`},\n  adv:()=>`\u003cp>人数が少ないグループの割合は大きく動きます。見本の寮（12人）では、1人ちがうだけで割合が約8ポイント変わります。割合と一緒に人数も書きましょう。\u003c/p>`},\n\n chi22:{title:'カイ二乗検定（2×2の表）',look:'CHISQ.TESTで求めたp値と、割合の差',rule:'p＜0.05なら「関連がある」。差は何ポイントかで書く',\n  what:u=>`答えが2つずつの2つの質問（${u.gen?'例：アルバイトの有無とサークル加入':u.v1+'と'+u.v2}）で、グループによる割合の違いが、\u003cstrong>関係がないと仮定したときに起こりにくい差か\u003c/strong>を確かめます。「アルバイトをしている人は、サークルに入っている割合がちがう？」に、p値で答えを出せます。`,\n  steps:u=>chiSteps(u,'2×2','B3:C4','B8:C9','$D3*B$5/$D$5','D5',2,2),\n  sample:()=>chiGrid(X22,['あり','なし'],['加入','未加入'],'加入の割合','実際の人数（行：アルバイト、列：サークル）'),\n  read:()=>{const s=X22;const a=s.O[0][0]/s.R[0]*100,b=s.O[1][0]/s.R[1]*100;return [['① どこを見るか','B11のp値と、E列の割合。'],['② 数字の意味',`${pT(s.p)}。0.05よりずっと大きい。サークルに加入している割合は、アルバイトあり${pct(a)}、なし${pct(b)}で、差は${(a-b).toFixed(1)}ポイント。`],['③ わかったこと','関係がないと仮定しても、この程度の差は十分に起こりうる（p≧0.05）。アルバイトの有無とサークル加入に関連があるとはいえない。']]},\n  guide:()=>GUIDE.p()+T(`\u003cdiv class=\"guide\">\u003cb>2×2の表の読み方\u003c/b>\u003cp>p値で「関連があるか」を判断し、関連の中身は割合の差（何ポイント）で書きます。\u003c/p>\u003c/div>`)+GUIDE.E5(),\n  report:()=>{const s=X22;const a=s.O[0][0]/s.R[0]*100,b=s.O[1][0]/s.R[1]*100;return `アルバイトの有無とサークル加入の関連をカイ二乗検定で調べた。サークルに加入している割合は、アルバイトをしている学生で${pct(a)}、していない学生で${pct(b)}であり、統計的に有意な関連はみられなかった（χ²(1)=${f2(s.chi2)}, ${pT(s.p)}）。`},\n  adv:()=>chiAdv(X22,'B12','B13','B3:C4','B8:C9','D5','MIN(2,2)')+T(`\u003cp>期待度数に5未満のマスがある2×2の表では、「フィッシャーの正確確率検定」を使います（Excelには専用の関数がありません）。\u003c/p>\u003cp>ExcelのCHISQ.TESTは、2×2の表でも補正（イェーツの補正）をしない計算です。教科書によって補正をする場合があり、p値が少しちがうことがあります。\u003c/p>`)},\n\n chi23:{title:'カイ二乗検定（2×3以上の表）',look:'CHISQ.TESTで求めたp値と、グループごとの割合',rule:'p＜0.05なら「表のどこかに偏りがある」。どこかは割合で見る',\n  what:u=>`選択肢が3つ以上ある質問を含む人数表（${u.gen?'例：居住形態×アルバイトの有無':u.v1+'×'+u.v2}）で、グループによる割合の違いが、\u003cstrong>関係がないと仮定したときに起こりにくい差か\u003c/strong>を確かめます。「居住形態によって、アルバイトをしている割合はちがう？」に、p値で答えを出せます。`,\n  steps:u=>chiSteps(u,'3×2','B3:C5','B9:C11','$D3*B$6/$D$6','D6',3,2),\n  sample:()=>chiGrid(X23,X23.rows,['あり','なし'],'ありの割合','実際の人数（行：居住形態、列：アルバイト）'),\n  read:()=>{const s=X23;const r=s.rows.map((x,i)=>s.O[i][0]/s.R[i]*100);return [['① どこを見るか','B13のp値と、E列の割合。'],['② 数字の意味',`${pT(s.p)}で、0.01≦p＜0.05なので5％水準で統計的に有意。アルバイトをしている割合は、実家${pct(r[0])}、一人暮らし${pct(r[1])}、寮${pct(r[2])}。`],['③ わかったこと','居住形態によって、アルバイトをしている割合はちがう。p値だけでは「どのグループが」はわからないので、割合を見る：一人暮らしが高く、寮が低い。']]},\n  guide:()=>GUIDE.p()+T(`\u003cdiv class=\"guide\">\u003cb>2×3以上の表の読み方\u003c/b>\u003cp>p値が小さいことは、「関係がないと仮定すると起こりにくい偏りが、表のどこかにある」ことだけを示します。どのグループが多い・少ないかは、割合の表で探して書きます。\u003c/p>\u003c/div>`)+GUIDE.E5(),\n  report:()=>{const s=X23;const r=s.rows.map((x,i)=>s.O[i][0]/s.R[i]*100);return `居住形態とアルバイトの有無の関連をカイ二乗検定で調べたところ、5％水準で統計的に有意な関連がみられた（χ²(${s.df})=${f2(s.chi2)}, ${pT(s.p)}）。アルバイトをしている割合は、一人暮らしで${pct(r[1])}と高く、寮では${pct(r[2])}と低かった（実家は${pct(r[0])}）。`},\n  adv:()=>chiAdv(X23,'B14','B15','B3:C5','B9:C11','D6','MIN(3,2)')+`\u003cp>どのマスが特に多い・少ないかを統計的に確かめる「残差分析」という方法もあります（このナビの範囲外）。\u003c/p>`},\n\n pairedcat:{title:'回答の変化を調べる（同じ質問を2回）',look:'答えが変わった人数と、マクネマー検定のp値',rule:'変わった向きの人数を比べ、p＜0.05なら「変化がある」',\n  what:u=>`同じ人に同じ質問を2回（授業の前と後など）したときは、「何人の答えが、どちらの向きに変わったか」を数えます。「反対→賛成」に変わった人と「賛成→反対」に変わった人の数の差が、本当は変化がないと仮定したときに起こりにくい差かを、{{マクネマー検定}}で確かめられます。`,\n  steps:u=>[`1行に1人で、1回目の答え（見本：M列 授業前の賛否）と2回目の答え（N列 授業後の賛否）を並べる。`,\n   `ピボットテーブルを作る：1回目の答えを「\u003cb>行\u003c/b>」、2回目の答えを「\u003cb>列\u003c/b>」、どちらかを「\u003cb>値\u003c/b>」（個数）へ。「行ラベル」と「列ラベル」の両方の▼で「(空白)」のチェックを外す（どちらかに答えていない人を除くため）。`,\n   `人数の部分を総計ごとコピーし、新しいシートのA2で右クリック → 「貼り付けのオプション」の「\u003cb>値\u003c/b>」。見本の形（B3:C4に人数）に整える。`,\n   `表の読み方：左上（賛成→賛成）と右下（反対→反対）は答えが変わらなかった人。右上（C3：賛成→反対）と左下（B4：反対→賛成）が変わった人。`,\n   `答えが2つ（2×2）のとき、p値を出す：\u003ccode>=CHISQ.DIST.RT((C3-B4)^2/(C3+B4),1)\u003c/code>`,\n   `答えが3つ以上のときは、変わった人数と割合を表にして示す（検定はこのナビの範囲外）。`],\n  sample:()=>{const s=PC;return grid({cols:['A','B','C','D'],r0:2,rows:[['授業前＼授業後','賛成','反対','合計'],['賛成',s.O[0][0],s.O[0][1],s.O[0][0]+s.O[0][1]],['反対',s.O[1][0],s.O[1][1],s.O[1][0]+s.O[1][1]],['合計',s.O[0][0]+s.O[1][0],s.O[0][1]+s.O[1][1],S.n],[],['p値',s.p]],mk:{C3:['①','y'],B4:['①','y'],B7:['②']},hd:(i,j)=>i===0||j===0})+'\u003cp class=\"cap\">見本データ（授業前と授業後の賛否）。B7は \u003ccode>=CHISQ.DIST.RT((C3-B4)^2/(C3+B4),1)\u003c/code>。\u003c/p>'},\n  read:()=>{const s=PC;return [['① どこを見るか','答えが変わった人数（C3とB4）と、B7のp値。'],['② 数字の意味',`反対→賛成が${s.c}人、賛成→反対が${s.b}人。${pT(s.p)}で、p＜0.01なので1％水準で統計的に有意。`],['③ わかったこと',`授業の後、賛成は${s.pre_yes}人から${s.post_yes}人に増えた。賛成に変わった人のほうが多く、この差は1％水準で統計的に有意。`]]},\n  guide:()=>GUIDE.p()+T(`\u003cdiv class=\"guide\">\u003cb>変わった人数が少ないとき\u003c/b>\u003cp>答えが変わった人の合計（見本では${PC.b}＋${PC.c}＝${PC.b+PC.c}人）が25人未満のときは、「発展」にある正確なp値の式を使います。\u003c/p>\u003c/div>`),\n  report:()=>{const s=PC;return `授業の前後で同じ質問をしたところ、賛成は${s.pre_yes}人（${pct(s.pre_yes/S.n*100)}）から${s.post_yes}人（${pct(s.post_yes/S.n*100)}）に増えた。反対から賛成に変わった学生は${s.c}人、賛成から反対に変わった学生は${s.b}人であり、マクネマー検定の結果、この変化は1％水準で統計的に有意であった（χ²(1)=${f2(s.chi2)}, ${pT(s.p)}）。`},\n  adv:()=>`\u003cp>変わった人の合計が25人未満のときの正確なp値：\u003ccode>=MIN(1,2*BINOM.DIST(MIN(C3,B4),C3+B4,0.5,TRUE))\u003c/code>（見本データでは ${f3(PC.p_exact)}）。\u003c/p>\u003cp>同じ人を2回数えた表なので、ふつうのカイ二乗検定（CHISQ.TEST）は使いません。\u003c/p>`},\n\n corr:{title:'相関係数（ピアソンの r）',look:'相関係数 r と、そのp値',rule:'rの絶対値で強さ、＋−で向きを読む。p＜0.05なら有意',\n  what:u=>`「勉強時間が長い人ほど、テストの点数も高い？」のように、2つの数値（${u.gen?'例：勉強時間とテストの点数':u.v1+'と'+u.v2}）が一緒に動くかを、−1〜＋1の1つの数（{{相関係数}} r）で表します。{{散布図}}と一緒に見ると、関係の形がひと目でわかります。`,\n  steps:u=>[`同じ人の2つの数値を同じ行に並べる（見本：H列 勉強時間、J列 期末テスト）。`,\n   missStep('勉強時間（H列）と期末テスト（J列）'),\n   `散布図を描く：2つの列を選ぶ（離れた列は Ctrl キー〔Macは command キー〕を押しながら選ぶ）→ \u003cb>挿入\u003c/b> → 「散布図」。点が右上がりに並べば＋、右下がりなら−の相関。`,\n   `空いているセルに \u003ccode>=CORREL(H2:H61,J2:J61)\u003c/code> と入れて r を出す。`,\n   `p値を出す：「データ分析」→「回帰分析」で、入力 Y 範囲に一方（J1:J61）、入力 X 範囲にもう一方（H1:H61）を入れ、「ラベル」にチェックして実行。X の行（勉強時間）の「P-値」が、相関係数のp値と同じ値になる。`],\n  sample:()=>grid({cols:['Q','R','S'],rows:[['相関係数 r',C.r,'=CORREL(H2:H61,J2:J61)'],['人数',C.n,'=COUNT(H2:H61)'],['p値',C.p,'回帰分析の出力 E18 の値']],mk:{R1:['①'],R3:['②']},hd:(i,j)=>j===0})+'\u003cp class=\"cap\">見本データ（1週間の勉強時間と期末テストの点数）。S列は説明のために書いたもの。\u003c/p>',\n  read:()=>[['① どこを見るか','R1の r と、R3のp値（回帰分析のP-値）。'],['② 数字の意味',`r=${f2(C.r)}。＋なので「勉強時間が長いほど点数が高い」向き。絶対値${f2(C.r)}は0.4以上0.7未満なので中程度の相関。p値の ${xl(C.p)} は0.001よりずっと小さい（1％水準で統計的に有意）。`],['③ わかったこと','勉強時間と期末テストの点数には、中程度の正の相関がある（1％水準で統計的に有意）。']],\n  guide:()=>GUIDE.r()+GUIDE.p()+GUIDE.E(),\n  report:()=>`1週間の勉強時間と期末テストの点数の間には、中程度の正の相関がみられた（r=${f2(C.r)}, ${pT(C.p)}, n=${C.n}）。`,\n  adv:()=>`\u003cp>rの区切り（0.2、0.4、0.7）は、読みやすくするための便宜的な目安です。0.39と0.41に本質的なちがいはありません。分野によって別の目安が使われることもあります。\u003c/p>\u003cp>rは「直線的な関係」の強さです。山なりのような曲線の関係はうまく表せないので、必ず散布図も見ます。極端な値の人が1人いるだけで r が大きく変わることもあります。\u003c/p>\u003cp>相関は「原因と結果」の証明ではありません（勉強時間が点数を上げたのか、得意な人が長く勉強するのかは、rだけでは区別できません）。\u003c/p>\u003cp>同じデータで単回帰分析をすると、R²＝r²（${f2(C.r)}×${f2(C.r)}≒${f2(C.r*C.r)}）になります。\u003c/p>\u003cp>5段階以上の評価どうしの関係には、順位を使う「スピアマンの順位相関」も使えます（\u003ccode>=RANK.AVG\u003c/code>で順位にしてからCORREL）。\u003c/p>`},\n\n paired:{title:'対応のあるt検定',look:'T.TESTで求めたp値と、平均の差',rule:'p＜0.05なら「平均が変わった」。何点変わったかも書く',\n  what:u=>`同じ人を2回測った数値（${u.gen?'例：授業の前と後の小テスト':u.v1+'と'+u.v2}）の平均が、変わったといえるかを確かめます。1人ひとりの「後−前」の差をもとに判断するので、人による元々の得意・不得意に邪魔されにくい方法です。`,\n  steps:u=>[`同じ人の1回目と2回目を同じ行に並べる（見本：K列 小テスト前、L列 小テスト後）。`,\n   missStep('小テスト前（K列）と小テスト後（L列）'),\n   `空いているセル（見本ではQ列から）に、それぞれの平均：\u003ccode>=AVERAGE(K2:K61)\u003c/code>、\u003ccode>=AVERAGE(L2:L61)\u003c/code>`,\n   `平均の差（後−前）を計算する。`,\n   T(`p値：\u003ccode>=T.TEST(K2:K61,L2:L61,2,1)\u003c/code>。3つ目の「2」は{{両側検定}}（上がったか下がったかを決めつけない）、4つ目の「1」は「同じ人の2回（{{対応あり}}）」という意味。`)],\n  sample:()=>grid({cols:['Q','R','S'],rows:[['前の平均',P.m1,'=AVERAGE(K2:K61)'],['後の平均',P.m2,'=AVERAGE(L2:L61)'],['差（後−前）',P.diff,'=R2-R1'],['p値',P.p,'=T.TEST(K2:K61,L2:L61,2,1)'],['人数',P.n,'=COUNT(K2:K61)']],mk:{R3:['①','y'],R4:['②']},hd:(i,j)=>j===0})+'\u003cp class=\"cap\">見本データ（授業の前と後の小テスト、100点満点）。\u003c/p>',\n  read:()=>[['① どこを見るか','R4のp値と、R3の平均の差。'],['② 数字の意味',`${pT(P.p)}で、0.01≦p＜0.05なので5％水準で統計的に有意。平均は${f1(P.m1)}点から${f1(P.m2)}点へ、${f1(P.diff)}点上がった。`],['③ わかったこと',`授業の後、小テストの平均点は${f1(P.diff)}点上がり、その差は5％水準で統計的に有意だった。`]],\n  guide:()=>GUIDE.p()+T(`\u003cdiv class=\"guide\">\u003cb>差の大きさも書く\u003c/b>\u003cp>p値からわかるのは、「差がないと仮定したら、めったに起きない結果かどうか」だけです。差の大きさはわからないので、「何点上がったか」も必ず書きます。\u003c/p>\u003c/div>`),\n  report:()=>`授業の前後で小テストの点数を比べたところ、平均点は${f1(P.m1)}点から${f1(P.m2)}点へ${f1(P.diff)}点上がり、対応のあるt検定の結果、5％水準で統計的に有意な差がみられた（${pT(P.p)}, n=${P.n}）。`,\n  adv:()=>`\u003cp>「データ分析」の「t 検定: 一対の標本による平均の検定」を使うと、t値（見本では${f2(P.t)}）も表で出ます。レポートで t(${P.n-1})=${f2(P.t)} のように書く場合に使います。\u003c/p>\u003cp>同じ人の、単位が同じ2つの数値（数学と英語の点数など）の平均を比べるときにも使えます。\u003c/p>\u003cp>差（後−前）に極端な値の人がいないかも確かめます。\u003c/p>`},\n\n welch:{title:'対応のないt検定（Welch法）',look:'T.TESTで求めたp値と、グループごとの平均',rule:'p＜0.05なら「平均に差がある」。どれくらい差があるかも書く',\n  what:u=>`別々の人の2つのグループ（${u.gen?'例：アルバイトをしている人／していない人':u.grp+'の2つのグループ'}）で、${u.gen?'数値':u.num}の平均に差があるといえるかを確かめます。2つのグループのばらつきがちがっていても使える、標準的な方法です。`,\n  steps:u=>welchSteps(u,3),\n  sample:()=>welchGrid('R6'),\n  read:()=>[['① どこを見るか','R6のp値と、3行目の平均。'],['② 数字の意味',`${pT(W.p)}で、0.01≦p＜0.05なので5％水準で統計的に有意。平均睡眠時間は、アルバイトあり${f2(W.m1)}時間、なし${f2(W.m2)}時間。`],['③ わかったこと',`アルバイトをしている学生は、していない学生より睡眠時間が平均${f2(W.m2-W.m1)}時間（約${Math.round((W.m2-W.m1)*60)}分）短い。この差は5％水準で統計的に有意。`]],\n  guide:()=>GUIDE.p(),\n  report:()=>`アルバイトをしている学生（n=${W.n1}）の1日の平均睡眠時間は${f2(W.m1)}時間で、していない学生（n=${W.n2}）の${f2(W.m2)}時間より短かった。Welchのt検定の結果、この差は5％水準で統計的に有意であった（${pT(W.p)}）。`,\n  adv:()=>welchAdv()},\n\n equal:{title:'対応のないt検定（等分散を仮定）',look:'T.TESTで求めたp値と、グループごとの平均',rule:'p＜0.05なら「平均に差がある」',\n  what:u=>`Welch法と同じく、別々の人の2つのグループで数値の平均を比べます。「2つのグループのばらつきは同じ」と考える理由があるとき（先生の指示など）に使います。迷ったらWelch法を使います。`,\n  steps:u=>welchSteps(u,2),\n  sample:()=>welchGrid('R7'),\n  read:()=>[['① どこを見るか','R7のp値（等分散を仮定）と、3行目の平均。'],['② 数字の意味',`${pT(W.p_equal)}で、p＜0.01なので1％水準で統計的に有意（同じデータのWelch法は ${pT(W.p)}）。`],['③ わかったこと','アルバイトをしている学生は、していない学生より睡眠時間が短い。']],\n  guide:()=>GUIDE.p(),\n  report:()=>`アルバイトをしている学生（n=${W.n1}）の1日の平均睡眠時間は${f2(W.m1)}時間、していない学生（n=${W.n2}）は${f2(W.m2)}時間であり、t検定（等分散を仮定）の結果、1％水準で統計的に有意な差がみられた（${pT(W.p_equal)}）。`,\n  adv:()=>`\u003cp>この方法は、0と1のダミー変数を使った単回帰分析と同じ結果になります（見本では、どちらも p=${f3(DS.pF)}）。\u003c/p>`+welchAdv()},\n\n anova3:{title:'3グループ以上の平均比較（ダミー変数の回帰分析）',look:'有意 F（全体の差）と、各グループの係数',rule:'有意F＜0.05なら「グループによって平均がちがう」。係数＝基準グループとの差',\n  what:u=>`実家・一人暮らし・寮のように、3つ以上のグループ（${u.gen?'例：居住形態':u.grp}）で${u.gen?'数値':u.num}の平均に差があるかを確かめます。t検定を何度もくり返すと偶然の「有意」が出やすくなるので、{{ダミー変数}}だけを使った回帰分析で、\u003cstrong>1回で\u003c/strong>調べます（「分散分析」と同じ結論になります）。`,\n  steps:u=>[`基準にするグループを1つ決める（ふつうは人数が多いグループ。見本：実家）。`,\n   `データの右の空いた列に、基準\u003cb>以外\u003c/b>のグループの列を作る：O1に「一人暮らし」、P1に「寮」と見出しを入れる。`,\n   `O2に \u003ccode>=IF(B2=\"\",\"\",IF(B2=\"一人暮らし\",1,0))\u003c/code>、P2に \u003ccode>=IF(B2=\"\",\"\",IF(B2=\"寮\",1,0))\u003c/code> と入れ、61行目まで下へコピーする。基準（実家）の人は両方とも0、居住形態が無回答の人は\u003cb>空欄\u003c/b>になる（無回答の人を基準グループに入れないため）。`,\n   missStep('睡眠時間（I列）と居住形態（B列）'),\n   toolpak(),\n   regRun('Yにする数値の列（見本：睡眠時間 I1:I61）','ダミー変数の列（O1:P61）'),\n   regOpt(),\n   `グループごとの平均も出しておく：\u003ccode>=AVERAGEIF(B2:B61,\"実家\",I2:I61)\u003c/code>（\"一人暮らし\"、\"寮\"も同じように）。`],\n  sample:()=>'\u003cp class=\"cap\">ダミー変数の列を作ったところ（見本データの最初の5人）\u003c/p>'+grid({cols:['B','I','O','P'],rows:[['居住形態','睡眠時間','一人暮らし','寮'],...ROWS.slice(0,5).map(r=>[r['居住形態'],r['睡眠時間'],+(r['居住形態']==='一人暮らし'),+(r['居住形態']==='寮')])],hd:i=>i===0})+regGrid(A3,{F12:['①'],B17:['②','y'],B18:['③'],E18:['③'],B19:['④'],E19:['④']}),\n  read:()=>{const gm=A3.groupmeans;return [['① どこを見るか','F12の「有意 F」。'],['② 数字の意味',`有意F＝${f3(A3.pF)}で、p＜0.01なので1％水準で統計的に有意。B17の切片${f2(A3.coef[0])}は、基準（実家）の平均睡眠時間。`],['③ 一人暮らし',`係数${f2(A3.coef[1])}＝実家より${f2(-A3.coef[1])}時間短い（平均${f2(gm['一人暮らし'])}時間）。P-値${f3(A3.p[1])}で1％水準で統計的に有意。`],['④ 寮',`係数＋${f2(A3.coef[2])}＝実家より${f2(A3.coef[2])}時間長い（平均${f2(gm['寮'])}時間）。P-値${f3(A3.p[2])}で、実家との差は有意とはいえない。`],['わかったこと',`居住形態によって睡眠時間の平均はちがう。特に一人暮らしの学生は、実家の学生より約${Math.round(-A3.coef[1]*60)}分短い。`]]},\n  guide:()=>GUIDE.F()+GUIDE.p()+GUIDE.R2(),\n  report:()=>{const gm=A3.groupmeans;return `居住形態によって1日の平均睡眠時間が異なるかを、実家を基準としたダミー変数による回帰分析で調べたところ、全体として1％水準で統計的に有意な差がみられた（F(${A3.df_reg},${A3.df_res})=${f2(A3.F)}, ${pT(A3.pF)}）。一人暮らしの学生の平均睡眠時間（${f2(gm['一人暮らし'])}時間）は実家の学生（${f2(gm['実家'])}時間）より${f2(-A3.coef[1])}時間短く、この差は1％水準で統計的に有意であった（${pT(A3.p[1])}）。寮の学生（${f2(gm['寮'])}時間）と実家の学生の差は有意ではなかった（${pT(A3.p[2])}）。`},\n  adv:()=>`\u003cp>一人暮らしと寮のように、基準\u003cb>以外\u003c/b>のグループどうしを比べたいときは、基準を変えて（例：一人暮らしを基準にして）もう一度回帰分析をします。\u003c/p>\u003cp>「データ分析」の「分散分析: 一元配置」でも、同じF値とp値（見本：F=${f2(A3.F)}、p=${f3(A3.pF)}）が出ます。\u003c/p>\u003cp>ダミー変数は「グループの数−1本」です。基準のグループの列まで作って全部入れると、計算がおかしくなります。\u003c/p>`},\n\n simple:{title:'単回帰分析',look:'係数とそのP-値、R²、有意 F',rule:'係数の＋−と大きさで関係を読み、P-値＜0.05なら有意',\n  what:u=>`「勉強時間が1時間増えると、テストの点数は何点上がる？」のように、1つの項目（X）で数値（Y）を説明し、その関係を直線の式で表します。${u.gen?'':'あなたの分析では、Y＝'+u.y+'、X＝'+u.x+'です。'}`,\n  steps:u=>[missStep('期末テスト（J列）と勉強時間（H列）'),toolpak(),regRun('Y（見本：期末テスト J1:J61）','X（見本：勉強時間 H1:H61）'),regOpt(),`散布図（XとYの2列を選んで 挿入 → 散布図）も描いて、点がおおむね直線に沿っているかを確かめる。`],\n  sample:()=>regGrid(SR,{B5:['①'],F12:['②'],B18:['③'],E18:['④']}),\n  read:()=>[['① 重決定 R2（B5）',`R²=${f2(SR.R2)}。期末テストの点数の、人による違いの約${Math.round(SR.R2*100)}％を勉強時間で説明できている（0.2以上0.5未満なので「ある程度説明できている」）。`],['② 有意 F（F12）',`${xl(SR.pF)}（0.001よりずっと小さい）。式全体として1％水準で統計的に有意。`],['③ 係数（B18）',`${f2(SR.coef[1])}。1週間の勉強時間が1時間長いと、点数が平均で約${f1(SR.coef[1])}点高い。切片（B17）${f2(SR.coef[0])}は、勉強時間0時間のときの予測点。`],['④ P-値（E18）',`${xl(SR.p[1])}で1％水準で統計的に有意。`],['わかったこと','勉強時間が長い学生ほど、期末テストの点数が高い。勉強時間だけで、点数の違いの約4割を説明できる。']],\n  guide:()=>GUIDE.R2()+GUIDE.F()+GUIDE.p()+GUIDE.E(),\n  report:()=>`期末テストの点数を1週間の勉強時間で説明する単回帰分析を行った。勉強時間の係数は${f2(SR.coef[1])}であり（${pT(SR.p[1])}）、勉強時間が1時間長いと点数が平均で約${f1(SR.coef[1])}点高いと推定された。決定係数はR²=${f2(SR.R2)}であった。`,\n  adv:()=>`\u003cp>係数と切片から予測の式が書けます：点数＝${f2(SR.coef[0])}＋${f2(SR.coef[1])}×勉強時間。勉強時間10時間なら約${f1(SR.coef[0]+SR.coef[1]*10)}点です。データの範囲（見本では${Math.min(...ROWS.map(r=>r['勉強時間']))}〜${Math.max(...ROWS.map(r=>r['勉強時間']))}時間）の外を予測するのは危険です。\u003c/p>\u003cp>R²は、相関係数 r を2乗した値と同じです（r=${f2(C.r)}）。\u003c/p>\u003cp>係数があっても、原因と結果の証明にはなりません。\u003c/p>`},\n\n dsimple:{title:'ダミー変数を使った単回帰分析',look:'係数とそのP-値',rule:'係数＝「1」のグループと「0」のグループの平均の差',\n  what:u=>`「アルバイトあり＝1、なし＝0」のように、2つのグループを0と1（{{ダミー変数}}）に置きかえて回帰分析をします。係数がそのまま「2つのグループの平均の差」になります。${u.gen?'':'あなたの分析では、Y＝'+u.y+'、X＝'+u.x+'です。'}`,\n  steps:u=>[`データの右の空いた列に、O1「アルバイトあり」と見出しを入れ、O2に \u003ccode>=IF(C2=\"\",\"\",IF(C2=\"あり\",1,0))\u003c/code> と入れて61行目まで下へコピーする。アルバイトの質問が無回答の人は空欄になる（「なし」のグループに入れないため）。複数回答の選択肢は、すでに1／0の列なのでそのまま使える。`,missStep('睡眠時間（I列）とアルバイト（C列）'),toolpak(),regRun('Y（見本：睡眠時間 I1:I61）','ダミー変数の列（O1:O61）'),regOpt()],\n  sample:()=>regGrid(DS,{B17:['①','y'],B18:['②'],E18:['③'],B5:['④','y']}),\n  read:()=>[['① 切片（B17）',`${f2(DS.coef[0])}＝「0」のグループ（アルバイトなし）の平均睡眠時間。`],['② 係数（B18）',`${f2(DS.coef[1])}＝アルバイトありの平均は、なしより${f2(-DS.coef[1])}時間短い（${f2(DS.coef[0]+DS.coef[1])}時間）。`],['③ P-値（E18）',`${f3(DS.p[1])}で、p＜0.01なので1％水準で統計的に有意。`],['④ R²（B5）',`${f2(DS.R2)}。0.2未満なので、アルバイトの有無だけで説明できる部分は小さい（アルバイトの有無だけで、1人ひとりの睡眠時間を言い当てるのは難しい）。一方で、2つのグループの平均の差は1％水準で統計的に有意。`]],\n  guide:()=>GUIDE.F()+GUIDE.p()+GUIDE.R2(),\n  report:()=>`アルバイトの有無（あり＝1、なし＝0）を説明変数、1日の睡眠時間を結果とする回帰分析を行った。アルバイトありの係数は${f2(DS.coef[1])}であり（${pT(DS.p[1])}）、アルバイトをしている学生の睡眠時間は、していない学生より平均${f2(-DS.coef[1])}時間短いと推定された（R²=${f2(DS.R2)}）。`,\n  adv:()=>`\u003cp>この結果は、t検定（等分散を仮定）と同じp値になります（見本：p=${f3(W.p_equal)}）。平均の差を確かめるだけなら、Welchのt検定もおすすめです。\u003c/p>`},\n\n multi:{title:'重回帰分析',look:'各係数とそのP-値、補正R²、有意 F',rule:'他の項目をそろえたときの関係を、係数とP-値で読む',\n  what:u=>`複数の項目（X）を同時に使って、数値（Y）を説明します。「睡眠時間が同じなら、勉強時間が1時間増えると何点上がる？」のように、\u003cstrong>他の項目の影響をそろえた\u003c/strong>うえでの関係がわかります。${u.gen?'':'あなたの分析では、Y＝'+u.y+'です。'}`,\n  steps:u=>[`Xにする列を\u003cb>隣り合わせ\u003c/b>に並べる（見本：H列 勉強時間とI列 睡眠時間は、すでに隣同士）。離れているときは、空いた列にコピーして並べる。`,missStep('YとXにする元の列（見本：J列・H列・I列）'),toolpak(),regRun('Y（見本：期末テスト J1:J61）','Xの列すべて（見本：H1:I61）'),regOpt()],\n  sample:()=>regGrid(MR,{B5:['①'],B6:['①','y'],F12:['②'],B18:['③'],E18:['③'],B19:['④'],E19:['④']}),\n  read:()=>[['① R2（B5・B6）',`重決定R²=${f2(MR.R2)}で、点数の違いの約${Math.round(MR.R2*100)}％を2つの項目で説明できている（0.2以上0.5未満なので「ある程度」）。補正R²（${f2(MR.adjR2)}）は、Xの数を考えに入れて調整した値で、Xの数がちがう式と比べるときに使う。`],['② 有意 F（F12）',`${xl(MR.pF)}。式全体として1％水準で統計的に有意。`],['③ 勉強時間（B18・E18）',`係数${f2(MR.coef[1])}、P-値${xl(MR.p[1])}。睡眠時間が同じなら、勉強時間1時間あたり約${f1(MR.coef[1])}点高い（1％水準で統計的に有意）。`],['④ 睡眠時間（B19・E19）',`係数${f2(MR.coef[2])}、P-値${f3(MR.p[2])}。0.05以上なので、勉強時間をそろえたうえでの睡眠時間と点数の関係は、有意とはいえない。`]],\n  guide:()=>GUIDE.R2()+GUIDE.F()+GUIDE.p()+GUIDE.E(),\n  report:()=>`期末テストの点数を、勉強時間と睡眠時間で説明する重回帰分析を行った（R²=${f2(MR.R2)}、補正R²=${f2(MR.adjR2)}、有意F\u003c0.001）。勉強時間の係数は${f2(MR.coef[1])}で、1％水準で統計的に有意であった（${pT(MR.p[1])}）。一方、睡眠時間の係数（${f2(MR.coef[2])}）は有意ではなかった（${pT(MR.p[2])}）。`,\n  adv:()=>T(`\u003cp>\u003cb>{{多重共線性}}\u003c/b>：Xどうしが強く関係している（例：「勉強時間」と「課題に使った時間」）と、どちらの影響なのかを分けられず、係数が大きくぶれたり、P-値が大きくなったりします。確かめ方：Xどうしの相関係数（CORREL）を見て、絶対値が0.7以上（この授業の「強い相関」）なら注意し、どちらか1つにすることを考えます。一方のXがもう一方から計算で求められる組み合わせ（「1週間の勉強時間」と「1日の勉強時間×7」など）は、計算そのものが正しくできません。\u003c/p>\u003cp>\u003cb>必要な回答者数\u003c/b>：人数がXの数に比べて少ないと、係数やP-値が不安定になります。「Xの数の10〜20倍以上の人数」という目安がよく使われますが、それを満たせば十分という基準ではありません。「データ分析」の回帰分析で入れられるXは16列までです。\u003c/p>\u003cp>単位がちがう係数（時間と点など）の大きさは、そのまま比べられません。\u003c/p>`)},\n\n dummy:{title:'ダミー変数を使った重回帰分析',look:'各係数とそのP-値、補正R²、有意 F',rule:'ダミーの係数＝ほかの項目をそろえたときの、基準グループとの差',\n  what:u=>`居住形態のような分類型の項目を0と1の列（{{ダミー変数}}）に置きかえて、数値の項目と一緒に回帰分析に入れます。「勉強時間が同じなら、一人暮らしの学生は実家の学生より何点低い？」がわかります。${u.gen?'':'あなたの分析では、Y＝'+u.y+'です。'}`,\n  steps:u=>[`分類型の項目ごとに、基準にするグループを1つ決める（見本：居住形態の「実家」）。`,\n   `Xにする列を、データの右の空いた列に\u003cb>隣り合わせ\u003c/b>で作る：O1「勉強時間」・P1「一人暮らし」・Q1「寮」。`,\n   `O2に \u003ccode>=IF(H2=\"\",\"\",H2)\u003c/code>、P2に \u003ccode>=IF(B2=\"\",\"\",IF(B2=\"一人暮らし\",1,0))\u003c/code>、Q2に \u003ccode>=IF(B2=\"\",\"\",IF(B2=\"寮\",1,0))\u003c/code> と入れ、61行目まで下へコピーする。無回答の人は空欄になる（0や基準グループとして計算しないため）。`,\n   `ダミーの列は「選択肢の数−1本」（3つなら2本）。基準のグループ（実家）の列は作らない。複数回答の選択肢は、1／0の列をそのまま入れてよい。`,\n   missStep('期末テスト（J列）、勉強時間（H列）、居住形態（B列）'),toolpak(),regRun('Y（見本：期末テスト J1:J61）','Xの列（O1:Q61）'),regOpt()],\n  sample:()=>'\u003cp class=\"cap\">Xの列を作ったところ（見本データの最初の5人）\u003c/p>'+grid({cols:['B','J','O','P','Q'],rows:[['居住形態','期末テスト','勉強時間','一人暮らし','寮'],...ROWS.slice(0,5).map(r=>[r['居住形態'],r['期末テスト'],r['勉強時間'],+(r['居住形態']==='一人暮らし'),+(r['居住形態']==='寮')])],hd:i=>i===0})+regGrid(DR,{B5:['①'],B6:['①','y'],F12:['②'],B18:['③'],E18:['③'],B19:['④'],E19:['④'],B20:['⑤','y'],E20:['⑤','y']}),\n  read:()=>[['① R2（B5・B6）',`重決定R²=${f2(DR.R2)}で、点数の違いの約${Math.round(DR.R2*100)}％を説明できている（0.2以上0.5未満なので「ある程度」）。補正R²（${f2(DR.adjR2)}）は、Xの数を考えに入れて調整した値。`],['② 有意 F（F12）',`${xl(DR.pF)}。式全体として1％水準で統計的に有意。`],['③ 勉強時間',`係数${f2(DR.coef[1])}、P-値${xl(DR.p[1])}。居住形態が同じなら、勉強時間1時間あたり約${f1(DR.coef[1])}点高い。`],['④ 一人暮らし',`係数${f2(DR.coef[2])}、P-値${f3(DR.p[2])}。勉強時間が同じなら、一人暮らしの学生は実家の学生より平均約${Math.round(-DR.coef[2])}点低い（5％水準で統計的に有意）。`],['⑤ 寮',`係数${f2(DR.coef[3])}、P-値${f3(DR.p[3])}。実家との差は有意とはいえない。`]],\n  guide:()=>GUIDE.F()+GUIDE.R2()+GUIDE.p()+GUIDE.E(),\n  report:()=>`期末テストの点数を、勉強時間と居住形態（実家を基準とするダミー変数）で説明する重回帰分析を行った（R²=${f2(DR.R2)}、補正R²=${f2(DR.adjR2)}、有意F\u003c0.001）。勉強時間の係数は${f2(DR.coef[1])}（${pT(DR.p[1])}）、一人暮らしの係数は${f2(DR.coef[2])}（${pT(DR.p[2])}）であり、勉強時間が同じであれば、一人暮らしの学生は実家の学生より平均で約${Math.round(-DR.coef[2])}点低いと推定された。寮の係数（${f2(DR.coef[3])}）は有意ではなかった（${pT(DR.p[3])}）。`,\n  adv:()=>`\u003cp>一人暮らしと寮を直接比べたいときは、基準を変えて（例：一人暮らしを基準にして）もう一度分析します。\u003c/p>\u003cp>\u003ccode>=IF(B2=\"一人暮らし\",1,0)\u003c/code> のように空欄を区別しない式を使うと、居住形態が無回答の人が「一人暮らしでも寮でもない人」＝基準グループ（実家）として計算されてしまいます。必ず空欄を残す式を使います。\u003c/p>`},\n\n partial:{sampleNote:'架空の8人の例で計算した結果です（60人の見本データとは別）。',title:'一部だけ同じ人の前後比較',look:'2回とも答えた人の数と、その人たちだけの比較',rule:'結びつけられる人だけで「同じ人の比較」をする',\n  what:u=>`1回目と2回目の回答者が一部だけ重なっているときは、「同じ人の比較」の方法も「別々の人の比較」の方法も、そのままでは正しく使えません。そこで、学籍番号などで\u003cstrong>2回とも答えた人\u003c/strong>を探し、その人たちだけで「同じ人の比較」をします。`,\n  steps:u=>[`1回目と2回目のデータに、学籍番号などのIDの列があるか確かめる。IDがない（無記名で照合できない）ときは、最後の手順へ。`,\n   `\u003cb>IDの確認\u003c/b>：それぞれの回のデータで、IDに空欄や重複がないことを確かめる。空欄の数 \u003ccode>=COUNTBLANK('1回目'!A2:A31)\u003c/code> と、重複の数 \u003ccode>=COUNTA('1回目'!A2:A31)-COUNTA(UNIQUE('1回目'!A2:A31))\u003c/code> がどちらも0ならよい（2回目も同じように。範囲は実際の人数に合わせる）。同じ人が2回答えている（重複がある）場合は、どちらの回答を採用するかを決め、使わない行を消してから先へ進む。IDが空欄の回答は照合できないので、照合には使わない。`,\n   `新しいシートを作り、A2に、1回目と2回目の\u003cb>両方の回のIDを重ならないように\u003c/b>並べる式を入れる：\u003ccode>=SORT(UNIQUE(VSTACK('1回目'!A2:A31,'2回目'!A2:A31)))\u003c/code>（それぞれのシートのA列がID。範囲は実際の人数に合わせる）。どちらか1回だけ答えた人も、ここに入る。`,\n   `B2に1回目の答え、C2に2回目の答えを持ってくる：B2 \u003ccode>=XLOOKUP(A2,'1回目'!$A$2:$A$31,IF('1回目'!$B$2:$B$31=\"\",\"\",'1回目'!$B$2:$B$31),\"\")\u003c/code>、C2は「1回目」を「2回目」に変えた式。範囲（$A$2:$A$31、$B$2:$B$31）は、列全体ではなく、それぞれの回の実際の人数に合わせる。下へコピーする。\u003ccode>IF(…=\"\",\"\",…)\u003c/code> の部分は、答えの欄が空欄の人を「空欄」のまま持ってくるためのもので、これがないと無回答が0になってしまう。0点のような正しい0はそのまま0になる。その回にIDがない人も空欄になる。`,\n   `2回とも答えたかを確かめる：D2に \u003ccode>=AND(B2\u003c>\"\",C2\u003c>\"\")\u003c/code> と入れて下へコピーする。TRUEなら2回とも答えた人。`,\n   `\u003cb>データ\u003c/b> → \u003cb>フィルター\u003c/b> → D列の▼で「TRUE」だけにチェック → 表示された行をコピーして、新しいシートに貼り付ける。`,\n   `そのシートで、数値なら「対応のあるt検定」、答えが2つの分類なら「回答の変化（マクネマー検定）」の手順で分析する（説明を開く：\u003cbutton type=\"button\" class=\"term\" data-open=\"paired\">対応のあるt検定\u003c/button>／\u003cbutton type=\"button\" class=\"term\" data-open=\"pairedcat\">回答の変化\u003c/button>）。`,\n   `答えが3つ以上の分類のとき：ピボットテーブルで、1回目の答えを「行」、2回目の答えを「列」にした人数表を作り、どの答えからどの答えに変わった人が何人いるかを示す（左上から右下への斜めのマスは、答えが変わらなかった人）。通常のカイ二乗検定や、答えが2つのとき用のマクネマー検定は使わない。検定が必要なときは先生に相談する。`,\n   `IDで結びつけられないとき：検定はせずに、1回目と2回目の平均（または割合）と人数を並べて示し、「回答者が一部異なるため、検定は行わなかった」と書く。検定が必要なら先生に相談する。`],\n  sample:()=>{const d=PART;return grid({cols:['A','B','C','D'],rows:[['ID','1回目','2回目','2回とも'],...d.map(r=>[r[0],r[1]===null?'':r[1],r[2]===null?'':r[2],(r[1]!==null&&r[2]!==null)?'TRUE':'FALSE']),[],['2回とも答えた人',PARTS.n]],mk:Object.fromEntries(d.map((r,i)=>(r[1]!==null&&r[2]!==null)?['D'+(i+2),['①']]:null).filter(Boolean).concat([['B11',['②','y']]])),hd:(i,j)=>i===0||(i===10&&j===0)})+`\u003cp class=\"cap\">架空の例（小テスト、8人）。A列はSORT(UNIQUE(VSTACK(…)))、B列・C列はXLOOKUPの式（空欄を空欄のまま持ってくる形）、D列は \u003ccode>=AND(B2\u003c>\"\",C2\u003c>\"\")\u003c/code>、B11は \u003ccode>=COUNTIF(D2:D9,TRUE)\u003c/code>。\u003c/p>`},\n  read:()=>[['① どこを見るか','D列がTRUEの行（2回とも答えた人）と、B11の人数。'],['② 数字の意味',`8人のうち、2回とも答えたのは${PARTS.n}人。この${PARTS.n}人の平均は、1回目${f1(PARTS.m1)}点、2回目${f1(PARTS.m2)}点。`],['③ わかったこと',`比べられるのは${PARTS.n}人だけ。人数がとても少ないので、この例では検定をせずに平均の変化（${f1(PARTS.m2-PARTS.m1)}点）を示すにとどめる。`]],\n  guide:()=>T(`\u003cdiv class=\"guide\">\u003cb>判断のしかた\u003c/b>\u003cp>2回とも答えた人が十分にいれば、その人たちだけで「同じ人の比較」の検定をします。人数が少ないときは、検定はせずに平均や割合の変化を示します。\u003c/p>\u003cp>2回とも答えた人は、熱心な人などに偏っているかもしれません。レポートには、全体の人数と、2回とも答えた人の人数を両方書きます。\u003c/p>\u003c/div>`),\n  report:()=>`授業の前後で小テストを実施した（1回目${PARTS.n1}人、2回目${PARTS.n2}人）。2回とも受けた${PARTS.n}人について平均点を比べると、${f1(PARTS.m1)}点から${f1(PARTS.m2)}点へ${f1(PARTS.m2-PARTS.m1)}点上がった。人数が少ないため、検定は行わなかった。`,\n  adv:()=>`\u003cp>2回とも答えた人と1回だけ答えた人を全員まとめて使う専門的な方法もありますが、統計ソフトが必要で、このナビの範囲外です。\u003c/p>`},\n catpred:{title:'グループを予測したいとき',special:true},\n catYmulti:{title:'結果（Y）が分類型で、Xが2つ以上',special:true}\n};\n/* --- 共通部品 --- */\nfunction chiSteps(u,shape,obs,exp,f,tot,R,Cn){\n const pRow=shape==='2×2'?11:13;const cRow=pRow+1,vRow=pRow+2;\n return [`クロス集計の手順で人数表を作る（値は「個数」、計算の種類は「\u003cb>計算なし\u003c/b>」、「(空白)」は外す）。`,\n  `ピボットテーブルの「行ラベル」のセルから右下の「総計」のセルまでを選んでコピー → 新しいシートのA2で右クリック → 「貼り付けのオプション」の「\u003cb>値\u003c/b>」。（ピボットテーブルのままだと、次の式を右や下へコピーしたときに正しく計算できません）`,\n  `貼り付けた表が見本と同じ形になっているか確かめる：${obs}に人数、D列に行の総計、${tot.slice(1)}行目に列の総計、${tot}に全体の人数。`,\n  T(`{{期待度数}}の表を作る：見本の位置に見出しを書き、左上のセルに \u003ccode>=${f}\u003c/code> と入れて、右と下へコピーする（${exp}）。`),\n  `p値：B${pRow}に \u003ccode>=CHISQ.TEST(${obs},${exp})\u003c/code>（合計の行と列は含めない）。`,\n  `割合も出す：E3に \u003ccode>=B3/D3\u003c/code> と入れて下へコピーし、パーセント表示にする。`,\n  `期待度数の表（${exp}）に、5未満の数がないか確かめる（下の「判断基準」）。`];\n}\nfunction chiGrid(s,rl,cl,lab,ttl){\n const R=s.rows.length;const rows=[[ttl],['行ラベル',...cl,'総計',lab]];\n s.O.forEach((o,i)=>rows.push([rl[i],...o,s.R[i],xpct(o[0]/s.R[i])]));\n rows.push(['総計',...s.C,s.N]);rows.push([]);\n rows.push(['期待度数',...cl]);s.E.forEach((e,i)=>rows.push([rl[i],...e]));rows.push([]);\n const pr=rows.length+1;rows.push(['p値',s.p]);rows.push(['カイ二乗値（発展）',s.chi2]);rows.push(['クラメールのV（発展）',s.V]);\n const mk={};mk['B'+pr]=['①'];for(let i=0;i\u003cR;i++)mk['E'+(3+i)]=['②','y'];\n const totRow=3+R;\n return grid({cols:['A','B','C','D','E'],rows,mk,hd:(i,j,v)=>(j===0&&v!=='')||i===1||i===R+4})+`\u003cp class=\"cap\">見本データ。期待度数は B${totRow+3} に \u003ccode>=$D3*B$${totRow}/$D$${totRow}\u003c/code> と入れて右と下へコピーしたもの。B${pr} は \u003ccode>=CHISQ.TEST(B3:C${2+R},B${totRow+3}:C${totRow+2+R})\u003c/code>。\u003c/p>`;\n}\nfunction chiAdv(s,cc,vc,obs,exp,tot,mn){\n return T(`\u003cp>\u003cb>関連の強さ：{{クラメールのV}}\u003c/b>　p値は「関係がないと仮定したら、めったに起きない結果かどうか」を示す数で、関連の\u003cstrong>強さ\u003c/strong>ではありません（人数が多いと、小さな差でも有意になります）。強さはクラメールのVで表します。\u003c/p>\u003col>\u003cli>{{カイ二乗値}}：${cc}に \u003ccode>=SUMPRODUCT((${obs}-${exp})^2/${exp})\u003c/code>（実際の人数と期待度数のずれを合計したもの。見本では ${f3(s.chi2)}）\u003c/li>\u003cli>V：${vc}に \u003ccode>=SQRT(${cc}/(${tot}*(${mn}-1)))\u003c/code>（MINの中は表の行の数と列の数。見本では ${f3(s.V)}）\u003c/li>\u003c/ol>\u003cp>Vは0〜1の数で、0に近いほど弱く、1に近いほど強い関連です。2×2や2×3のように、どちらかの質問の選択肢が2つの表では、0.1前後で弱い、0.3前後で中程度、0.5以上で強いとされることが多いです（両方3つ以上の表では、もっと小さい値でも強いと考えます）。\u003c/p>\u003cp>レポートの「χ²(${s.df})」のかっこの数は{{自由度}}で、（行の数−1）×（列の数−1）です。\u003c/p>`);\n}\nfunction welchSteps(u,type){\n const st=u.st;const multi=!!(st&&st.purpose==='relation'&&catSlotRel(st)&&st.vars[catSlotRel(st)].kind==='M');\n const s=[`1行に1人で、グループの列（見本：C列 アルバイト）と数値の列（I列 睡眠時間）がある形にする。`,\n  `空いているセル（見本ではQ列から）に、グループごとの人数を出す：\u003ccode>=SUMPRODUCT((C2:C61=\"あり\")*ISNUMBER(I2:I61))\u003c/code>。睡眠時間に\u003cb>数値で答えた人だけ\u003c/b>を数える式（無回答の人は数えない）。\"なし\"も同じように。`,\n  `平均：\u003ccode>=AVERAGEIF(C2:C61,\"あり\",I2:I61)\u003c/code>（空欄は自動で除かれる）。`,\n  T(`p値：\u003ccode>=T.TEST(FILTER(I2:I61,(C2:C61=\"あり\")*ISNUMBER(I2:I61)),FILTER(I2:I61,(C2:C61=\"なし\")*ISNUMBER(I2:I61)),2,${type})\u003c/code>。FILTERは「条件に合う行だけを取り出す」関数で、\u003ccode>ISNUMBER(I2:I61)\u003c/code>は「睡眠時間が数値で入っている行だけ」という条件。\u003cb>この条件を外すと、無回答（空欄）が0時間として計算されてしまう\u003c/b>ので、必ず入れる。3つ目の「2」は{{両側検定}}、4つ目の「${type}」は${type===3?'{{Welch法}}':'等分散を仮定する方法'}という意味。`)];\n s.push(multi?`\u003cb>複数回答の選択肢をグループにするとき\u003c/b>：比べるのは「その選択肢を選んだ人（1）」と「選ばなかった人（0）」。式の条件の \u003ccode>C2:C61=\"あり\"\u003c/code> を \u003ccode>E2:E61=1\u003c/code>、\u003ccode>C2:C61=\"なし\"\u003c/code> を \u003ccode>E2:E61=0\u003c/code> にする（ISNUMBERの条件はそのまま）。この質問自体に答えていない人（E列が空欄）は、どちらにも入らない。Instagram利用者とTikTok利用者のように選択肢どうしを比べると、同じ人が両方に入るので比べられない。`:`複数回答の選択肢をグループにするときは、「選んだ人（1）」と「選ばなかった人（0）」を比べる（条件の \u003ccode>C2:C61=\"あり\"\u003c/code> を \u003ccode>E2:E61=1\u003c/code> などにする。ISNUMBERの条件はそのまま）。`);\n return s;\n}\nfunction welchGrid(hl){return grid({cols:['Q','R','S'],rows:[['','あり','なし'],['人数',W.n1,W.n2],['平均',W.m1,W.m2],['標準偏差',W.sd1,W.sd2],['平均の差',W.m1-W.m2],['p値（Welch法）',W.p],['p値（等分散を仮定）',W.p_equal]],mk:{[hl]:['①'],R3:['②','y'],S3:['②','y']},hd:(i,j)=>i===0||j===0})+`\u003cp class=\"cap\">見本データ（アルバイトの有無と1日の睡眠時間）。R2は \u003ccode>=SUMPRODUCT((C2:C61=R1)*ISNUMBER(I2:I61))\u003c/code>、R4は \u003ccode>=STDEV.S(FILTER(I2:I61,(C2:C61=R1)*ISNUMBER(I2:I61)))\u003c/code>、R6は \u003ccode>=T.TEST(FILTER(I2:I61,(C2:C61=\"あり\")*ISNUMBER(I2:I61)),FILTER(I2:I61,(C2:C61=\"なし\")*ISNUMBER(I2:I61)),2,3)\u003c/code>、R7は最後の数を2にしたもの。見本データには無回答がないので、ISNUMBERの条件があってもなくても同じ値になります。\u003c/p>`}\nfunction welchAdv(){return `\u003cp>FILTER関数が使えない古いExcelでは、グループの列で表全体を並べ替え、「あり」の人の範囲と「なし」の人の範囲を直接選んで T.TEST に入れます。\u003c/p>\u003cp>「データ分析」の「t 検定: 分散が等しくないと仮定した2標本による検定」を使うと、t値も表で出ます。\u003c/p>\u003cp>3つ以上のグループで2つずつt検定をくり返すと、偶然の「有意」が出やすくなります。3つ以上なら「3グループ以上の平均比較」を使います。\u003c/p>\u003cp>どちらかのグループに極端な値の人がいないかも確かめます。グループの人数が少ない（数人程度）と、t検定の結果は不安定になり、本当にある差も有意になりにくくなります。人数が少ないときは、平均と一緒に一人ひとりの値も示します。\u003c/p>`}\n\n/* ========== 特別な到達先 ========== */\nfunction catpredInfo(st){\n // 予測したいグループの数（2つ／3つ以上）\n let k=null,u=U(st);\n if(st&&st.purpose==='relation'){const c=catSlotRel(st);if(c)k=st.vars[c].kind==='C3'?3:2}\n if(st&&st.purpose==='reg'&&st.vars.y)k=st.vars.y.kind==='C3'?3:2;\n const intro=T(`\u003cdiv class=\"warn\">\u003cb>予測と平均の比較は、目的がちがいます\u003c/b>\u003ctable class=\"rule\">\u003ctr>\u003cth>予測する\u003c/th>\u003ctd>1人ひとりの数値から「その人がどのグループに入るか」を当てる式を作る（{{ロジスティック回帰}}）。Excelの標準機能では難しい分析です。\u003c/td>\u003c/tr>\u003ctr>\u003cth>平均を比べる\u003c/th>\u003ctd>グループの間で、数値の平均に差があるかを確かめる。「数値とグループに関係があるか」を知りたいなら、こちらで答えが出ます。\u003c/td>\u003c/tr>\u003c/table>\u003cp>このナビでは、向きを逆にして「グループごとに数値の平均を比べる」分析を案内します。${u.gen?'':'（あなたの分析では、'+(st.purpose==='reg'?u.y:u.grp)+'のグループごとに、'+(st.purpose==='reg'?u.x:u.num)+'の平均を比べます）'}\u003c/p>\u003c/div>`);\n return {k,intro};\n}\nfunction catYmultiHTML(st){\n const u=U(st);\n return T(`\u003cdiv class=\"concl\">\u003cdiv class=\"tag\">1. 結論：使う分析方法\u003c/div>\u003cdiv class=\"m\">Xを1つずつ、Yとの関係を調べる\u003c/div>\u003cdl>\u003cdt>使う項目\u003c/dt>\u003cdd>${u.y}と、Xの1つひとつ\u003c/dd>\u003cdt>見る数字\u003c/dt>\u003cdd>それぞれの組み合わせのp値\u003c/dd>\u003cdt>判断\u003c/dt>\u003cdd>p＜0.05の組み合わせが「関係がある」\u003c/dd>\u003c/dl>\u003c/div>\n \u003cdiv class=\"warn\">\u003cb>はじめに：この方法は、多変量解析の代わりにはなりません\u003c/b>\u003cp>ここで案内するのは、XとYの組み合わせを\u003cstrong>1つずつ\u003c/strong>調べる方法です。1つずつ調べると、ほかのXの影響をそろえられないので、「どのXが本当にYと関係しているのか」「ほかのXが同じでも関係があるのか」は判断できません。わかるのは、それぞれのXとYに関係があるかどうかだけです。複数のXを同時に使う分析（ロジスティック回帰などの{{多変量解析}}）は、統計ソフトで行います。\u003c/p>\u003c/div>\n \u003ch3>2. この分析でわかること\u003c/h3>\u003cp>結果（Y）が分類型で、Xが2つ以上あるときに「全部のXを同時に使って、Yのどのグループに入るかを予測する」分析（{{ロジスティック回帰}}）は、Excelの標準機能では行えません。代わりに、\u003cstrong>Xを1つずつYと組み合わせて\u003c/strong>、関係があるかどうかを調べます。どのXがYと関係していそうかがわかります。\u003c/p>\n \u003ch3>3. Excelでの操作手順\u003c/h3>\u003col class=\"steps\">\u003cli>Xを1つ選ぶ。\u003c/li>\u003cli>下のボタンで「2つの質問の関係」に進み、1つ目の質問に${u.y}、2つ目の質問にそのXを選ぶ。案内された分析（カイ二乗検定・t検定など）をする。\u003c/li>\u003cli>ほかのXについても同じようにくり返す。\u003c/li>\u003cli>結果を下の見本のような表にまとめる。\u003c/li>\u003c/ol>\n \u003cdiv class=\"btnrow\">\u003cbutton type=\"button\" class=\"primary\" id=\"goRelation\">「2つの質問の関係」で1つずつ調べる\u003c/button>\u003c/div>\n \u003ch3>4. 出力表の見本（まとめ表）\u003c/h3>`)+grid({cols:['A','B','C','D'],rows:[['X（Yはアルバイトの有無）','使った分析','p値','判断'],['居住形態','カイ二乗検定（3×2）',X23.p,'5％水準で有意'],['サークル加入','カイ二乗検定（2×2）',X22.p,'有意とはいえない'],['睡眠時間','Welchのt検定',W.p,'5％水準で有意']],mk:{C2:['①'],C3:['①'],C4:['①']},hd:i=>i===0})+\n `\u003cdiv class=\"read\">\u003cdiv>\u003cb class=\"k\">① どこを見るか\u003c/b>C列のp値。\u003c/div>\u003cdiv>\u003cb class=\"k\">② 数字の意味\u003c/b>居住形態（${pT(X23.p)}）と睡眠時間（${pT(W.p)}）は0.05未満、サークル加入（${pT(X22.p)}）は0.05以上。\u003c/div>\u003cdiv>\u003cb class=\"k\">③ わかったこと\u003c/b>アルバイトの有無は、居住形態や睡眠時間と関係があり、サークル加入とは関係があるとはいえない。\u003c/div>\u003c/div>\n \u003ch3>5. 数字の読み方と判断基準\u003c/h3>${GUIDE.p()}\u003ch3>6. レポートの書き方の例\u003c/h3>\u003cdiv class=\"report\">アルバイトの有無と各項目の関連を1つずつ調べたところ、居住形態（カイ二乗検定, ${pT(X23.p)}）と睡眠時間（Welchのt検定, ${pT(W.p)}）には統計的に有意な関連がみられたが、サークル加入には有意な関連はみられなかった（${pT(X22.p)}）。\u003c/div>\n \u003ch3>7. 発展・注意点\u003c/h3>\u003cdetails class=\"adv\">\u003csummary>発展：もっと知りたい人へ\u003c/summary>\u003cp>例：見本では居住形態も睡眠時間もアルバイトと関係がありましたが、一人暮らしの人は睡眠時間も短いので、どちらが本当にアルバイトと関係しているのかは、1つずつの分析では区別できません。\u003c/p>\u003cp>たくさんの組み合わせを検定すると、偶然の「有意」が出やすくなります。調べる組み合わせは、事前に決めておきます。\u003c/p>\u003c/details>`;\n}\n\n/* ========== 結果画面 ========== */\nfunction methodBody(key,st,opt={}){\n const m=M[key];const u=U(st);\n const steps=m.steps(u).map(s=>T(s));\n if(st&&!opt.noPrep){const prep=prepNotes(st);if(prep)steps.unshift(prep)}\n let h=`\u003ch3>2. この分析でわかること\u003c/h3>\u003cp>${T(m.what(u))}\u003c/p>${opt.extra||''}\n \u003ch3>3. Excelでの操作手順\u003c/h3>\u003col class=\"steps\">${steps.map(s=>'\u003cli>'+s+'\u003c/li>').join('')}\u003c/ol>\n \u003ch3>4. Excel出力表の見本\u003c/h3>\u003cp class=\"small\">${m.sampleNote||'見本データ（架空のアンケート、60人）で実際に計算した結果です。\u003cbutton type=\"button\" class=\"term\" data-data=\"1\">見本データについて\u003c/button>'}\u003c/p>${m.sample()}\n \u003cdiv class=\"read\">${m.read().map(([k,v])=>`\u003cdiv>\u003cb class=\"k\">${k}\u003c/b>${v}\u003c/div>`).join('')}\u003c/div>\n \u003ch3>5. 数字の読み方と判断基準\u003c/h3>${m.guide()}\n \u003ch3>6. レポートの書き方の例\u003c/h3>\u003cp class=\"small\">④ 見本データの結果を、レポートではこう書きます。\u003c/p>\u003cdiv class=\"report\">${m.report()}\u003c/div>\n \u003ch3>7. 発展・注意点\u003c/h3>\u003cdetails class=\"adv\">\u003csummary>発展：もっと知りたい人へ\u003c/summary>${T(m.adv())}${['chi22','chi23','paired','welch','equal','anova3','simple','dsimple','multi','dummy','pairedcat','corr'].includes(key)?pAdv():''}\u003c/details>`;\n return h;\n}\nconst pAdv=()=>`\u003cp>\u003cb>p値についての注意\u003c/b>　p≧0.05は「差（関係）がないことが証明された」という意味ではありません。「差がないと仮定しても、今回くらいの結果はめずらしくない」という意味です。また、p値は「仮説が正しい確率」でもありません。「有意」は「差が大きい」「重要だ」という意味ではありません。人数が多いと小さな差でも有意になるので、差の大きさも一緒に見ます。たくさんの検定をすると、偶然の「有意」が出やすくなります。\u003c/p>`;\nfunction prepNotes(st){\n const out=[];for(const [k,v] of Object.entries(st.vars)){const nm=st.names[k]?'「'+esc(st.names[k])+'」':slotLabel[k];\n  if(v.kind==='M')out.push(`${nm}は複数回答なので、選択肢ごとに列を作り、\u003cb>選んだ＝1、選ばない＝0\u003c/b>を入れる。この質問に答えていない人は空欄のまま（0にしない）。分析では、選択肢1つを「選んだ／選ばない」の2グループとして扱う。`);\n  if(v.kind==='N'&&v.likert)out.push(`${nm}は段階評価なので、この授業の方針にしたがって「とても満足＝5、満足＝4…」のように点数を入力する（先生の指示があればそちらを優先）。「とても不満＝5」のように向きが逆の質問が混ざっていないかも確かめる。`);\n  if(v.kind==='C3'&&v.likert)out.push(`${nm}は3〜4段階の評価なので、点数ではなく分類型として、段階ごとの人数や割合を比べる。`)}\n return out.length?'\u003cb>データの準備\u003c/b>：'+out.join('\u003cbr>'):'';\n}\nfunction conclusion(key,st,reason){\n const m=M[key];const u=U(st);let items='';\n if(st){const p=st.purpose;\n  const nmY=st.names.y?'「'+esc(st.names.y)+'」':'結果の質問',nmX=(G[st.node].m==='multi'||G[st.node].m==='dummy')?'複数の項目':(st.names.x?'「'+esc(st.names.x)+'」':'説明に使う項目');\n  const use=p==='single'?u.v1:p==='relation'?u.v1+' と '+u.v2:'Y＝'+nmY+'、X＝'+nmX;\n  items+=`\u003cdt>使う項目\u003c/dt>\u003cdd>${use}\u003c/dd>`}\n items+=`\u003cdt>見る数字\u003c/dt>\u003cdd>${m.look}\u003c/dd>\u003cdt>判断\u003c/dt>\u003cdd>${m.rule}\u003c/dd>`;\n return `\u003cdiv class=\"concl\">\u003cdiv class=\"tag\">1. 結論：使う分析方法\u003c/div>\u003cdiv class=\"m\">${m.title}\u003c/div>\u003cdl>${items}\u003c/dl>${reason?`\u003cdiv class=\"why\">${reason}\u003c/div>`:''}\u003c/div>`;\n}\nfunction pathText(st){return st.trail.filter(t=>!t.inB).map(t=>t.edge).join(' → ')}\nfunction leafExtra(leaf){\n const t={L_welch_t:`\u003cdiv class=\"note\">\u003cb>データの並べ方（回答者が別々のとき）\u003c/b>\u003cp>1回目の回答と2回目の回答を1つのシートに縦につなげ、「時期」の列（1回目／2回目）を作ります。下の手順の「アルバイト」の列（C列）を「時期」の列に、\"あり\"・\"なし\"を\"1回目\"・\"2回目\"に読み替えてください。\u003c/p>\u003c/div>`,\n  L_chi22_t:`\u003cdiv class=\"note\">\u003cb>データの並べ方（回答者が別々のとき）\u003c/b>\u003cp>1回目の回答と2回目の回答を1つのシートに縦につなげ、「時期」の列（1回目／2回目）を作ります。ピボットテーブルでは「時期」を行、「答え」を列に入れます。表の大きさは「時期（2つ）×答えの選択肢の数」です（賛成・中立・反対の3択なら2×3）。あとは下の手順と同じです。\u003c/p>\u003c/div>`,\n  L_text_xm:`\u003cdiv class=\"btnrow\">\u003cbutton type=\"button\" data-open=\"dummy\">1／0の列にしたあと：ダミー変数を使った重回帰分析の手順を見る\u003c/button>\u003c/div>`};\n t.L_chi23_t=t.L_chi22_t;return t[leaf]||'';\n}\nfunction leafReason(leaf,st){\n const r={L_chi22_y:'結果（Y）が分類型なので、数値の回帰分析は使えません。Xも分類型なので、YとXの関係をカイ二乗検定で調べます。',L_chi23_y:'結果（Y）が分類型なので、数値の回帰分析は使えません。Xも分類型なので、YとXの関係をカイ二乗検定で調べます。',\n  L_anova3_y:'Xが3つ以上のグループなので、ダミー変数の回帰分析（3グループ以上の平均比較と同じ）になります。',L_text_r:'自由記述の質問があるので、まず内容に印をつけて分類型にします。',L_text_y:'結果（Y）が自由記述なので、まず内容に印をつけて分類型にします。',L_text_x:'Xが自由記述なので、まず内容に印をつけて分類型にします。',L_text_x2:'Xが自由記述なので、まず内容に印をつけて分類型にします。',\n  L_text_xm:'Xに自由記述が入っているので、まず内容に印をつけて、1／0の列（数値）に変えます。変えたあとは、ダミー変数を使った重回帰分析に入れられます。',\n  L_welch_t:'同じ内容を2回測っていますが、回答者が別々なので、「1回目の人たち」と「2回目の人たち」を2つのグループとして比べます。',\n  L_chi22_t:'同じ質問を2回していますが、回答者が別々なので、「時期（1回目／2回目）」と「答え」の関係をカイ二乗検定で調べます。',\n  L_chi23_t:'同じ質問を2回していますが、回答者が別々なので、「時期（1回目／2回目）」と「答え」の関係をカイ二乗検定で調べます。',\n  L_partial_c:'同じ質問を2回していますが、回答者が一部だけ重なっている（または照合できない）ので、2回とも答えた人を探して比べます。',\n  L_partial_n:'同じ内容を2回測っていますが、回答者が一部だけ重なっている（または照合できない）ので、2回とも答えた人を探して比べます。'}[leaf];\n return r||'';\n}\nfunction renderResult(){\n const leaf=state.node,L=G[leaf];let key=L.m;let h='\u003cdiv class=\"tag\">診断結果\u003c/div>';\n const why='選んだ道筋：'+esc(pathText(state));\n if(key==='catYmulti'){h+=catYmultiHTML(state)}\n else if(key==='catpred'){const info=catpredInfo(state);key=info.k===3?'anova3':'welch';\n  h+=conclusion(key,state,'結果がグループ（分類型）で、もう一方が数値なので、向きを逆にして平均を比べます。\u003cbr>'+why);\n  h+=methodBody(key,state,{extra:info.intro});}\n else{const r=leafReason(leaf,state);h+=conclusion(key,state,(r?r+'\u003cbr>':'')+why);h+=methodBody(key,state,{extra:leafExtra(leaf)})}\n h+=`\u003ch3>ここまでの選択\u003c/h3>\u003cdetails class=\"trail\" open>\u003csummary>選んだ答えを確認\u003c/summary>\u003col>${state.trail.filter(t=>t.title).map(t=>'\u003cli>'+esc(t.title)+' → '+esc(t.label||t.edge)+'\u003c/li>').join('')}\u003c/ol>\u003c/details>\u003cdiv class=\"btnrow\">\u003cbutton class=\"primary\" id=\"printRes\">この結果を印刷\u003c/button>\u003c/div>`;\n return h;\n}\n\n/* ========== 画面の描画 ========== */\nconst screen=document.getElementById('screen');let lockUntil=0;\nfunction statusBar(){\n const v=state.vars;const parts=[];\n const show=k=>{if(!v[k])return;const nm=state.names[k]?'「'+esc(state.names[k])+'」':'';parts.push(`\u003cb>${{v1:state.purpose==='single'?'質問':'1つ目',v2:'2つ目',y:'結果（Y）',x:'説明（X）'}[k]}${nm}\u003c/b>：${kindName[v[k].kind]}${v[k].likert&&v[k].kind==='N'?'（段階を点数に）':''}`)};\n ['v1','v2','y','x'].forEach(show);\n return parts.length?`\u003cdiv class=\"status\">${parts.join('　／　')}\u003c/div>`:'';\n}\nfunction render(){\n document.getElementById('back').disabled=!history.length;\n document.querySelector('header .lead').hidden=state.node!=='start';\n parent.postMessage({type:'excelnav-state',state:JSON.stringify({state,history})},'*');const n=G[state.node];\n if(n.t==='leaf'){screen.innerHTML=renderResult();for(const hd of [...screen.querySelectorAll('h3')]){if(!/Excelでの操作手順|出力表の見本/.test(hd.textContent))continue;let d=document.createElement('details'),su=document.createElement('summary');su.textContent='参考（見本データの場合）：'+hd.textContent;d.append(su);hd.before(d);let nx=hd.nextElementSibling;hd.remove();while(nx&&nx.tagName!=='H3'&&nx.tagName!=='DETAILS'){let nn=nx.nextElementSibling;d.append(nx);nx=nn}}const use=document.createElement('button');use.className='primary';use.style.width='100%';use.textContent='この方法で自分のデータを分析';use.onclick=()=>{let key=G[state.node].m;if(key==='catpred')key=catpredInfo(state).k===3?'anova3':'welch';let order=state.purpose==='reg'?['y','x']:['v1','v2'];if(['welch','equal','anova3'].includes(key)&&state.vars[order[0]]?.kind==='N')order.reverse();parent.postMessage({type:'excelnav-method',key,leaf:state.node,route:pathText(state),names:state.names,vars:state.vars,order},'*')};const conclusionBox=screen.querySelector(\".concl\");if(conclusionBox)conclusionBox.after(use);else screen.append(use);const pb=document.getElementById('printRes');if(pb)pb.onclick=()=>doPrint('result');const gr=document.getElementById('goRelation');if(gr)gr.onclick=()=>startRelation(true);}\n else{\n  const title=resolve(n.title),help=resolve(n.help);\n  let h=statusBar()+`\u003cdiv class=\"tag\">ステップ ${history.length+1}${n.sub?'　\u003cspan style=\"font-weight:normal\">（図B 質問の種類の見分け方）\u003c/span>':''}\u003c/div>\u003ch2>${esc(title)}\u003c/h2>\u003cp>${esc(help)}\u003c/p>`;\n  if(state.node==='B_how'){const k=state.sub.slot;h+=`\u003cdiv class=\"namebox\">\u003clabel for=\"qname\">この質問の名前（書かなくてもOK。書くと結果の説明に使われます）\u003c/label>\u003cinput id=\"qname\" maxlength=\"30\" autocomplete=\"off\" placeholder=\"例：${{v1:'睡眠時間',v2:'アルバイトの有無',y:'期末テストの点数',x:'勉強時間'}[k]}\" value=\"${esc(state.names[k]||'')}\">\u003c/div>`}\n  h+=n.ch.map((c,i)=>`\u003cbutton class=\"choice\" data-i=\"${i}\">\u003cstrong>${esc(c.label)}\u003c/strong>\u003cspan>${esc(c.ex)}\u003c/span>\u003c/button>`).join('');\n  screen.innerHTML=h;\n  screen.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',ev=>{if(performance.now()\u003clockUntil){ev.preventDefault();return}const inp=document.getElementById('qname');choose(Number(b.dataset.i),inp?inp.value:'');render();window.scrollTo(0,0)}));\n }\n lockUntil=performance.now()+400;\n updateChart();\n}\nfunction startRelation(keep){const yn=keep?state.names.y:null;history.push(JSON.stringify(state));state=fresh();state.purpose='relation';state.trail=[{from:'start',to:'r_types',edge:'2つの関係',title:G.start.title,label:G.start.ch[1].label}];state.node='r_types';if(yn)state.names.v1=yn;settle();render();window.scrollTo(0,0)}\ndocument.getElementById('back').onclick=()=>{if(history.length){state=JSON.parse(history.pop());render();window.scrollTo(0,0)}};\ndocument.getElementById('reset').onclick=()=>{if(history.length>=2&&!confirm('ここまでの選択を消して、最初からやり直しますか？'))return;state=fresh();history=[];render();window.scrollTo(0,0)};\n\n/* ========== フローチャート ========== */\nconst NW=128,LW=184,GAP=106,LH=15;\nfunction nodeText(id){const n=G[id];if(n.t==='leaf')return [M[n.m].title.replace(/（ダミー変数の回帰分析）/,'').replace('3グループ以上の平均比較','3グループ以上の平均比較')].map(shortLeaf);return n.chart.split('\\n')}\nfunction shortLeaf(t){return ({'単純集計（人数と割合）':'単純集計（人数・割合）','単純集計（平均・中央値・ばらつき）':'単純集計（平均など）','内容分析（自由記述のまとめ）':'内容分析（自由記述）','クロス集計（ピボットテーブル）':'クロス集計（ピボット）','回答の変化を調べる（同じ質問を2回）':'回答の変化（前後比較）','相関係数（ピアソンの r）':'相関係数 r','対応のないt検定（Welch法）':'t検定（Welch法）','対応のないt検定（等分散を仮定）':'t検定（等分散を仮定）','ダミー変数を使った単回帰分析':'ダミー変数の単回帰','ダミー変数を使った重回帰分析':'ダミー変数の重回帰','グループを予測したいとき':'グループの予測（読み替え）','結果（Y）が分類型で、Xが2つ以上':'Yが分類・Xが複数','一部だけ同じ人の前後比較':'一部だけ同じ人の前後比較'})[t]||t}\nfunction boxSizeBase(id,pad=14){const n=G[id];const lines=nodeText(id);const w=(n.t==='leaf'||n.t==='out')?LW:NW;return {w,h:lines.length*LH+pad,lines}}\nfunction layoutTree(root,opt={}){\n const VG=opt.vg??10,PAD=opt.pad??14;const boxSize=id=>boxSizeBase(id,PAD);\n const nodes=[],edges=[];const memo={};\n const H=id=>{if(memo[id]!==undefined)return memo[id];const k=kids(id);const own=boxSize(id).h;if(!k.length)return memo[id]=own;const sum=k.reduce((a,c)=>a+H(c.to),0)+VG*(k.length-1);return memo[id]=Math.max(own,sum)};\n const place=(id,depth,top)=>{const b=boxSize(id);const k=kids(id);const x=depth*(NW+GAP);let cy;\n  if(k.length){const sum=k.reduce((a,c)=>a+H(c.to),0)+VG*(k.length-1);let t=top+(H(id)-sum)/2;const cs=[];\n   k.forEach(c=>{cs.push(place(c.to,depth+1,t));t+=H(c.to)+VG});cy=(cs[0].cy+cs[cs.length-1].cy)/2;\n   k.forEach((c,i)=>edges.push({from:id,to:c.to,label:c.edge,x1:x+b.w,y1:cy,x2:cs[i].x,y2:cs[i].cy}));}\n  else cy=top+H(id)/2;\n  nodes.push({id,x,y:cy-b.h/2,w:b.w,h:b.h,cy,lines:b.lines,t:G[id].t});return {x,cy}};\n place(root,0,0);\n let W=0,Hh=0;nodes.forEach(n=>{W=Math.max(W,n.x+n.w);Hh=Math.max(Hh,n.y+n.h)});\n return {nodes,edges,W,H:Hh};\n}\nfunction svgOf(L,ox,oy,pref){\n let s='';\n L.edges.forEach(e=>{const mx=e.x1+14;s+=`\u003cg class=\"ed\" data-from=\"${e.from}\" data-to=\"${e.to}\">\u003cpath d=\"M${e.x1+ox},${e.y1+oy} H${mx+ox} V${e.y2+oy} H${e.x2-2+ox}\" marker-end=\"url(#${pref}ar)\"/>\u003ctext x=\"${mx+6+ox}\" y=\"${e.y2-5+oy}\">${esc(e.label)}\u003c/text>\u003c/g>`});\n L.nodes.forEach(n=>{const cls='nd '+n.t;const x=n.x+ox,y=n.y+oy;\n  s+=`\u003cg class=\"${cls}\" data-id=\"${n.id}\"${n.t==='leaf'?' tabindex=\"0\" role=\"button\"':''}>\u003ctitle>${esc(n.t==='q'?resolveStatic(G[n.id].title):n.lines.join(''))}\u003c/title>\u003crect x=\"${x}\" y=\"${y}\" width=\"${n.w}\" height=\"${n.h}\" rx=\"${n.t==='leaf'?12:6}\"/>${n.t==='sub'?`\u003crect class=\"inner\" x=\"${x+5}\" y=\"${y}\" width=\"${n.w-10}\" height=\"${n.h}\" rx=\"0\"/>`:''}`;\n  const ty=y+(n.h-n.lines.length*LH)/2;n.lines.forEach((ln,i)=>{s+=`\u003ctext x=\"${x+n.w/2}\" y=\"${ty+LH*(i+1)-3.5}\" text-anchor=\"middle\">${esc(ln)}\u003c/text>`});s+='\u003c/g>'});\n return s;\n}\nconst resolveStatic=t=>typeof t==='function'?'（質問）の答え方はどれですか？':t;\nconst defs=p=>`\u003cdefs>\u003cmarker id=\"${p}ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"9\" markerHeight=\"9\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#7f9aa3\"/>\u003c/marker>\u003c/defs>`;\nconst VIEWS=[{id:'all',label:'全体図',root:'start'},{id:'single',label:'1つの質問',root:'s_type'},{id:'relation',label:'2つの関係',root:'r_types'},{id:'reg',label:'数値を説明',root:'y_type'},{id:'B',label:'図B 種類の見分け方',root:'B_how'}];\nconst svgCache={};\nfunction buildView(v){\n if(svgCache[v.id])return svgCache[v.id];\n const L=layoutTree(v.root);const pad=14,top=v.id==='B'?34:pad;\n let inner=svgOf(L,pad,top,v.id);\n if(v.id==='B')inner=`\u003ctext class=\"ttl\" x=\"${pad}\" y=\"22\">図B　質問の種類の見分け方（それぞれの質問について使います）\u003c/text>`+inner;\n const W=L.W+pad*2,H=L.H+top+pad;\n return svgCache[v.id]=`\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"${W}\" height=\"${H}\" viewBox=\"0 0 ${W} ${H}\" font-family=\"system-ui,'Hiragino Sans','Noto Sans JP',sans-serif\">${defs(v.id)}${inner}\u003c/svg>`;\n}\nfunction buildPrintSVG(){\n const A=layoutTree('start',{vg:4,pad:8}),B=layoutTree('B_how',{vg:4,pad:8});const pad=16,gapY=46;\n const W=Math.max(A.W,B.W)+pad*2;const H=40+A.H+gapY+B.H+pad;\n let s=`\u003ctext class=\"ttl\" x=\"${pad}\" y=\"24\" style=\"font-size:20px\">統計分析ナビ　分析方法を選ぶフローチャート（全体図）\u003c/text>`;\n s+=svgOf(A,pad,40,'P');\n const by=40+A.H+gapY;s+=`\u003cline x1=\"${pad}\" x2=\"${W-pad}\" y1=\"${by-26}\" y2=\"${by-26}\" stroke=\"#c5d3d8\" stroke-dasharray=\"6 4\"/>\u003ctext class=\"ttl\" x=\"${pad}\" y=\"${by-8}\">図B　質問の種類の見分け方（二重線の箱で、それぞれの質問について使います）\u003c/text>`;\n s+=svgOf(B,pad,by+6,'P');\n return `\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 ${W} ${H+6}\" preserveAspectRatio=\"xMidYMid meet\" font-family=\"system-ui,'Hiragino Sans','Noto Sans JP',sans-serif\">${defs('P')}${s}\u003c/svg>`;\n}\nlet curView=null,userView=null;\nconst tabs=document.getElementById('tabs'),chartbox=document.getElementById('chartbox');\ntabs.innerHTML=VIEWS.map(v=>`\u003cbutton role=\"tab\" data-v=\"${v.id}\" aria-selected=\"false\">${v.label}\u003c/button>`).join('');\ntabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;userView=b.dataset.v;showView(userView,true)});\nfunction autoView(){if(state.sub)return 'B';if(!state.purpose)return 'all';return state.purpose}\nfunction showView(id,keepScroll){\n curView=id;tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===id)));\n chartbox.innerHTML=buildView(VIEWS.find(v=>v.id===id));paint(chartbox);\n const cur=chartbox.querySelector('.nd.cur');\n if(cur){const r=cur.querySelector('rect');const x=+r.getAttribute('x'),y=+r.getAttribute('y');chartbox.scrollLeft=Math.max(0,x-chartbox.clientWidth/2+80);chartbox.scrollTop=Math.max(0,y-chartbox.clientHeight/2+20)}\n}\nfunction paint(root){\n const past=new Set(),taken=new Set();\n state.trail.forEach(t=>{if(!t.inB){past.add(t.from);past.add(t.to);taken.add(t.from+'>'+t.to)}});\n state.btrail.forEach(t=>{past.add(t.from);past.add(t.to);taken.add(t.from+'>'+t.to)});\n const cur=new Set([mainCurrent()]);if(state.sub)cur.add(state.node);\n root.querySelectorAll('.nd').forEach(g=>{const id=g.dataset.id;g.classList.toggle('past',past.has(id)&&!cur.has(id));g.classList.toggle('cur',cur.has(id))});\n root.querySelectorAll('.ed').forEach(g=>g.classList.toggle('taken',taken.has(g.dataset.from+'>'+g.dataset.to)));\n}\nfunction updateChart(){userView=null;showView(autoView())}\ndocument.getElementById('fitchk').addEventListener('change',e=>{chartbox.classList.toggle('fit',e.target.checked)});\nchartbox.addEventListener('click',e=>{const g=e.target.closest('.nd.leaf');if(!g)return;openLeaf(g.dataset.id)});\nchartbox.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const g=e.target.closest('.nd.leaf');if(!g)return;e.preventDefault();openLeaf(g.dataset.id)});\nfunction openLeaf(id){const key=G[id].m;const useState=state.node===id;openMethod(key,useState?state:null,id)}\n\n/* ========== ダイアログ ========== */\nconst dlg=document.getElementById('dlg'),dlgbody=document.getElementById('dlgbody');\nfunction openMethod(key,st,leaf){\n let h;\n if(key==='catYmulti'){h=catYmultiHTML(st)}\n else if(key==='catpred'){const info=catpredInfo(st);\n  if(info.k){const k2=info.k===3?'anova3':'welch';h=conclusion(k2,st,'結果がグループで、もう一方が数値なので、向きを逆にして平均を比べます。')+methodBody(k2,st,{extra:info.intro,noPrep:true})}\n  else h=`\u003cdiv class=\"concl\">\u003cdiv class=\"tag\">分析方法\u003c/div>\u003cdiv class=\"m\">グループの予測（読み替え）\u003c/div>\u003cp>数値から「どのグループに入るか」を予測したいときの案内です。\u003c/p>\u003c/div>`+info.intro+`\u003cdiv class=\"btnrow\">\u003cbutton type=\"button\" data-open=\"welch\">グループが2つ：Welchのt検定\u003c/button>\u003cbutton type=\"button\" data-open=\"anova3\">グループが3つ以上：3グループ以上の平均比較\u003c/button>\u003c/div>`;}\n else{const r=leaf?leafReason(leaf,st):'';h=conclusion(key,st,r)+methodBody(key,st,{noPrep:true,extra:leaf?leafExtra(leaf):''})}\n document.getElementById('dlgtitle').textContent=M[key].title;dlgbody.innerHTML=h;\n const gr=dlgbody.querySelector('#goRelation');if(gr){gr.onclick=()=>{dlg.close();startRelation(false)}}\n if(!dlg.open)dlg.showModal();dlgbody.scrollTop=0;dlg.scrollTop=0;\n}\ndocument.getElementById('dlgclose').onclick=()=>dlg.close();\ndlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});\n\n/* ========== 用語の辞書 ========== */\nconst DICT={\n '分類型':'答えがグループ名になる質問。例：居住形態（実家・一人暮らし・寮）、賛成・反対。足し算や平均には使いません。',\n '数値型':'答えが計算できる数の質問。例：睡眠時間 6.5時間、テスト72点。平均を出せます。5段階以上の評価も点数にして数値型として扱うのが、この授業の方針です（先生の指示があればそちらを優先）。',\n '複数回答':'いくつでも選べる質問。例：「使っているSNSをすべて選んでください」。選択肢ごとに「選んだ＝1、選ばない＝0」の列に分けて分析します。',\n '自由記述':'文章で自由に答える質問。例：「大学生活で困っていること」。',\n 'リッカート尺度':'「とてもそう思う〜全くそう思わない」のように、段階で答える質問の形。段階評価ともいいます。',\n '平均':'全員の値を足して、人数で割った値。例：3人の睡眠時間が5・6・7時間なら、平均は6時間。',\n '中央値':'値を小さい順に並べたとき、真ん中にくる値。例：5・6・20時間なら、中央値は6時間（平均は約10.3時間）。極端な値に引っ張られにくい。',\n '標準偏差':'値が平均のまわりにどれくらい散らばっているかを表す数。小さいほど、みんなが平均に近い。',\n '外れ値':'ほかの人から極端に離れた値。例：睡眠時間がほとんど6〜7時間なのに、1人だけ15時間。入力ミスのこともあるので確かめます。',\n 'ピボットテーブル':'Excelの集計機能。マウスで項目をドラッグするだけで、人数や平均の表を作れます。',\n 'クロス集計':'2つの質問を組み合わせた人数表。例：居住形態（縦）×アルバイトの有無（横）。',\n 'コード化':'自由記述を読んで、「授業」「お金」などのテーマの印をつけること。印をつけると数えられるようになります。',\n '検定':'「差や関係がない」と仮定したとき、今回の結果がどれくらい起こりにくいかを、確率（p値）で判断する方法。',\n 'p値':'本当は差や関係がないと仮定したとき、今回と同じくらい、またはそれ以上に極端な結果が偶然に出る確率。0.05未満なら5％水準で有意とします。',\n '有意':'「統計的に有意」とは、差や関係がないと仮定すると今回の結果はめったに起きない（p値が基準の0.05や0.01より小さい）という意味。例：ふつうのコインで10回中9回以上表が出る確率は約1.1％（片側）。それが起きたら「偏っているのでは？」と考えるのと同じです。「差が大きい」「重要だ」という意味ではありません。',\n '片側検定':'「上がった」のように、一方の向きの差だけを調べる検定。このナビでは使いません。',\n '有意水準':'p値がいくつ未満なら「有意」とするかの基準。ふつうは5％（0.05）。より厳しい1％（0.01）も使います。',\n '期待度数':'「2つの質問に関係がない」としたら、人数表の各マスに入るはずの人数。行の合計×列の合計÷全体の人数で計算します。',\n 'カイ二乗値':'実際の人数と期待度数のずれの大きさを、表全体でまとめた数（χ²と書きます）。大きいほどずれが大きい。',\n 'クラメールのV':'クロス集計の2つの質問の関連の強さを、0〜1で表す数。p値とちがい、人数の多さに左右されにくい。',\n '自由度':'レポートで「χ²(2)」「F(2,57)」のように、かっこの中に書く数。表の大きさや人数から決まります。Excelの出力表にも書かれています。',\n 'マクネマー検定':'同じ人に同じ質問を2回したとき、答えの変化（反対→賛成、賛成→反対）の人数の差が、変化がないと仮定したときに起こりにくい差かを確かめる検定。',\n 't検定':'2つの平均の差が、「本当は差がない」と仮定したときに起こりにくい差かどうかを、p値で確かめる検定。',\n '対応あり':'同じ人を2回測ったデータ（授業の前と後など）。1人ひとりの差をもとに比べます。',\n '対応なし':'別々の人のグループどうしのデータ（アルバイトをしている人／していない人など）。',\n '両側検定':'「上がった」「下がった」のどちらの向きの差も見つけようとする検定。ふつうはこちらを使います。T.TESTの3つ目の数を2にします。',\n 'Welch法':'2つのグループのばらつきがちがっていても使えるt検定の方法。迷ったらこれを使います。T.TESTの4つ目の数を3にします。',\n '等分散':'2つのグループで、値のばらつき（散らばり方）が同じであること。',\n '相関係数':'2つの数値が一緒に動く程度を−1〜＋1で表す数（r）。＋は同じ向き、−は逆向き。0に近いほど関係が弱い。',\n '散布図':'1人を1つの点にして、横軸と縦軸に2つの数値をとったグラフ。点の並び方で関係の形がわかります。',\n '回帰分析':'結果（Y）を、ほかの項目（X）で説明する式を作る分析。「Xが1増えるとYがいくつ増えるか」がわかります。',\n '係数':'回帰分析で、「Xが1増えるとYがいくつ増えるか」を表す数。−なら減ります。ダミー変数の係数は「基準グループとの平均の差」。',\n '切片':'回帰分析で、Xがすべて0のときのYの予測値。ダミー変数だけの回帰では、基準グループの平均になります。',\n '決定係数':'R²（Excelでは「重決定 R2」）。Yの人による違いのうち、Xで説明できる割合。0〜1の数で、0.40なら40％。',\n '補正R²':'Xの数を増やすだけでR²が上がってしまう点を調整した値（Excelでは「補正 R2」）。Xの数がちがう式どうしを比べるときに使います。説明できる割合は、R²のほうで読みます。',\n '有意F':'回帰分析で、「Xはどれも Y と関係がない」と仮定したときに、今回と同じくらい、またはそれ以上にYを説明できる結果が出る確率（p値）。Excelでは「有意 F」。0.05未満なら式全体として有意。',\n 'ダミー変数':'分類型の答えを0と1で表した列。例：一人暮らし＝1、それ以外＝0。グループの数より1本少なく作ります。',\n '基準グループ':'ダミー変数を作らなかったグループ（全部の列が0になるグループ）。ほかのグループの係数は、このグループとの差を表します。',\n '多重共線性':'回帰分析で、Xどうしが強く関係しているために、どのXの影響なのかを分けられず、係数が大きくぶれたりP-値が大きくなったりすること。Xどうしの相関係数を確かめ、強く関係する組み合わせはどちらか1つにします。',\n 'E表記':'とても小さい（大きい）数の書き方。6.14E-08は0.0000000614のこと。「E-08」は小数点を左へ8けた動かすという意味。',\n '多変量解析':'たくさんの項目を同時に使って、それぞれの影響をそろえながら分析する方法の総称。重回帰分析やロジスティック回帰など。',\n 'ロジスティック回帰':'数値などから「どのグループに入るか（はい／いいえなど）」を予測する分析。Excelの標準機能では難しく、統計ソフトを使います。',\n '分析ツール':'Excelに付いている統計の道具（アドイン）。有効にすると「データ」タブに「データ分析」が出て、回帰分析などができます。'\n};\nconst tdlg=document.getElementById('termdlg');\nfunction openTerm(k){document.getElementById('termtitle').textContent=k;document.getElementById('termbody').innerHTML=`\u003cp>${esc(DICT[k]||'（辞書にありません）')}\u003c/p>`;if(!tdlg.open)tdlg.showModal()}\ndocument.getElementById('termclose').onclick=()=>tdlg.close();\ntdlg.addEventListener('click',e=>{if(e.target===tdlg)tdlg.close()});\ndocument.addEventListener('click',e=>{const t=e.target.closest('.term[data-t]');if(t){e.preventDefault();openTerm(t.dataset.t);return}\n const d=e.target.closest('[data-data]');if(d){e.preventDefault();openData();return}\n const o=e.target.closest('[data-open]');if(o){e.preventDefault();openMethod(o.dataset.open,null)}});\n\n/* ========== 見本データ ========== */\nfunction csv(){const q=v=>{const s=String(v);return /[\",\\n]/.test(s)?'\"'+s.replace(/\"/g,'\"\"')+'\"':s};return '﻿'+[COLS.join(','),...ROWS.map(r=>COLS.map(c=>q(r[c])).join(','))].join('\\r\\n')+'\\r\\n'}\nfunction dataInfoHTML(){\n const desc={ID:'回答者の番号','居住形態':'実家／一人暮らし／寮（分類型）','アルバイト':'あり／なし（分類型）','サークル':'加入／未加入（分類型）','Instagram':'使っているSNS（複数回答）：選んだ＝1、選ばない＝0','TikTok':'同上','YouTube':'同上','勉強時間':'1週間の勉強時間（時間、数値型）','睡眠時間':'1日の平均睡眠時間（時間、数値型）','期末テスト':'期末テストの点数（100点満点）','小テスト前':'授業前の小テスト（100点満点）','小テスト後':'授業後の小テスト（同じ学生）','授業前の賛否':'賛成／反対（授業前）','授業後の賛否':'賛成／反対（授業後、同じ質問）'};\n return `\u003cp>このナビの見本の数字は、架空の大学生60人のアンケート（下の列）から実際に計算したものです。CSVをダウンロードしてExcelで開き、同じ操作をすると、見本と同じ数字が出ます（1行目が見出し、2〜61行目がデータ）。\u003c/p>\u003cdiv class=\"btnrow\">\u003cbutton type=\"button\" class=\"primary\" id=\"dlcsv\">見本データ（CSV）をダウンロード\u003c/button>\u003c/div>\u003ctable class=\"rule\">\u003ctr>\u003cth>列\u003c/th>\u003cth>見出し\u003c/th>\u003cth>中身\u003c/th>\u003c/tr>${COLS.map((c,i)=>`\u003ctr>\u003ctd>${LET[i]}\u003c/td>\u003ctd>${esc(c)}\u003c/td>\u003ctd>${esc(desc[c]||'')}\u003c/td>\u003c/tr>`).join('')}\u003c/table>`;\n}\nfunction openData(){document.getElementById('dlgtitle').textContent='見本データについて';dlgbody.innerHTML=dataInfoHTML();bindCsv(dlgbody);if(!dlg.open)dlg.showModal()}\nfunction bindCsv(root){const b=root.querySelector('#dlcsv');if(b)b.onclick=()=>{const blob=new Blob([csv()],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='survey-analysis-navi-v1.3.2-sample-data.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}}\n\n/* ========== 一覧 ========== */\nconst LIST=[['1つの質問をまとめる',['single_cat','single_multi','single_num','text']],['2つの質問の関係',['cross','chi22','chi23','pairedcat','corr','paired','welch','equal','anova3','partial']],['数値を説明する',['simple','dsimple','multi','dummy']],['読み替えの案内',['catpred','catYmulti']]];\ndocument.getElementById('library').innerHTML='\u003ch3>分析方法の一覧\u003c/h3>'+LIST.map(([g,ks])=>`\u003cp>\u003cb>${g}\u003c/b>\u003c/p>\u003cdiv class=\"lib\">${ks.map(k=>`\u003cbutton type=\"button\" class=\"lnk\" data-open=\"${k}\">${M[k].title}\u003c/button>`).join('')}\u003c/div>`).join('')+'\u003ch3>用語の辞書\u003c/h3>\u003cdl class=\"dict\">'+Object.entries(DICT).map(([k,v])=>`\u003cdt id=\"dict-${k}\">${k}\u003c/dt>\u003cdd>${esc(v)}\u003c/dd>`).join('')+'\u003c/dl>\u003ch3>見本データ\u003c/h3>'+dataInfoHTML();\nbindCsv(document.getElementById('library'));\n\n/* ========== 印刷 ========== */\nconst pagesize=document.getElementById('pagesize');\nfunction doPrint(kind){\n if(kind==='chart'){document.getElementById('printChart').innerHTML=buildPrintSVG();paint(document.getElementById('printChart'));pagesize.textContent='@page{size:A4 landscape;margin:12mm 14mm}';document.body.classList.add('print-chart')}\n else{pagesize.textContent='@page{size:A4 portrait;margin:14mm}';document.body.classList.remove('print-chart')}\n setTimeout(()=>window.print(),30);\n}\nwindow.addEventListener('afterprint',()=>{document.body.classList.remove('print-chart');pagesize.textContent='@page{size:A4 portrait;margin:14mm}'});\ndocument.getElementById('printChartBtn').onclick=()=>doPrint('chart');\n\n/* 検証用（画面には出ない） */\nwindow.__navi={G,M,DICT,get state(){return state},load(js){state=JSON.parse(js);history=[];render()},openMethod,choose,fresh:()=>{state=fresh();history=[];render()},layoutTree,buildPrintSVG,kids,render};\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>

function assumptionText(m){if(['welch','equal','indcols'].includes(m))return '結果シートのB2・C2（人数）、B4・C4（標準偏差）、B7:C8（最小・最大）を見て、ありえない値や極端な値がないか確認します。等分散法の場合はばらつきの違いにも注意。箱ひげ図は発展：疑問があれば教員に相談します。';if(m==='paired')return '原データの行が同一人物の前後か確認します。結果シートH2から下に有効ペアの後−前の差を自動計算しています。H2:H'+(completeMatrix().length+1)+' を名前ボックスで選択し、［挿入］タブの統計グラフアイコン→ヒストグラムで極端な値を確認します。';if(m==='corr')return '結果シートのD1:E'+(completeMatrix().length+1)+' を名前ボックスに入力しEnter。［挿入］タブの点のアイコン→散布図を作り、極端な点や曲線状の関係がないか確認します。後のグラフ工程ではこの図を使って構いません。';if(regMethods.includes(m))return '回帰出力の新しいシートを下へスクロールし、「残差出力」の表を探します。予測値と残差の見出しを含む隣り合う2列を最後の行まで選び、［挿入］タブの点のアイコン→散布図。横軸は予測値、縦軸は残差です。偏りや広がりに疑問があれば教員に相談します。多重共線性などの詳細診断は発展扱いです。';return '各グループが別々の回答者であることと、分析出力の分散が大きく異ならないかを確認します。';}
function readInfo(m){if(m==='desc')return '結果シート：B2は有効人数、B3は平均、B4は中央値、B5は標本分散、B6は標準偏差、B7・B8は最小・最大。平均6時間、標準偏差1時間なら、睡眠時間の散らばりの大きさが約1時間という意味です。';if(m==='chi'){let r=makeResults().rows;let cells=['χ²','自由度','p値','CramérのV'].map(x=>x+'：B'+(r.findIndex(a=>a[0]===x)+1)).join('、');return cells+'。観測度数、期待度数、χ²、自由度、p値、CramérのVを確認。φは2×2の場合の絶対値です。期待度数が1未満、または5未満のセルが20％超なら近似を保留。2×2は全セル5以上を保守的な目安にし、必要なら教員に正確検定を相談。p<0.05を事前に決めた場合に有意と判断します。'}if(m==='corr')return '結果シート：B2はペア数、B3は相関係数r、B4は両側p値。rは−1〜1で、符号は方向、絶対値は直線関係の強さ。授業の目安として絶対値0.2未満＝非常に弱い、0.2以上0.4未満＝弱い、0.4以上0.7未満＝中程度、0.7以上＝強い。授業の便宜的な目安です。分野や散布図も確認します。B4のp値は丸める前の値で判断します。例：6.14E-08なら1％水準で統計的に有意（p<0.001）です。';if(regMethods.includes(m))return (m==='groupreg'?'結果シートの '+makeResults().extra.group+' に各群の平均・人数・標準偏差があります。':'')+'回帰出力（新規シートのA1から出力した標準配置）：① B5のR²、B6の補正R²、B8の観測数。R²が0.40なら標本内のYのばらつきの40%を説明。授業の目安：0.2未満＝小さい、0.2以上0.5未満＝ある程度、0.5以上＝比較的多く。② F12の有意F（モデル全体）。③ B17から下の係数とE17から下のP値、95%信頼区間。切片は17行目、説明変数は18行目以降。配置が異なる場合は必ず行・列の項目名で照合。ダミー係数は基準群との差（他の条件が同じ場合）。残差・外れ値・多重共線性も確認。' ;if(['welch','equal','indcols','paired'].includes(m))return '結果シート：B2・C2は人数、B3・C3は平均、B4・C4は標準偏差、B5は平均差、B6は両側p値。事前に5％水準とした場合、p<0.05なら「5％水準で統計的に有意」と書きます。p≥0.05は差がない証明ではありません。'+(m==='paired'?'同じ人の前後の差を検定しています。B5は後−前の平均差で、正なら後の平均が大きく、負なら小さくなっています。':'別々の人の平均を比較します。');if(m==='anova')return '各グループ人数・平均、F値、自由度、p値を確認。全体の検定で有意でも、どの群の差かはわかりません。等分散・独立性などの前提を確認し、多重比較は教員に相談。';if(m==='mcnemar')return '結果シート：B'+(makeResults().rows.length-1)+'は変化した人数、B'+makeResults().rows.length+'は両側正確p値。対角線は変化しなかった人です。同じ人の前後を対応づけた場合のみ使えます。';return ['cross'].includes(m)?'結果シートの上の観測度数表と下の行割合表を見ます。各行の人数と分母を確認してください。':'結果シートのB列は人数、C列は有効人数、D列は割合。割合の分母を明記します。'+(m==='multiresponse'||m==='text'?'複数選択・複数テーマでは合計が100%を超えても問題ありません。':'')}
function graphInfo(m,R){let choice=p.graph;if(choice==='rank')return '結果シートで数式バー左の名前ボックスに A1:B'+R.rows.length+' と半角入力してEnter。'+(p.os==='mac'?'Command+C':'Ctrl+C')+' でコピーします。画面左下の［＋］で空の新しいシートを作り、A1を右クリック（MacではControl+クリックでも可）し、貼り付けのオプションから［値］（または［形式を選択して貼り付け］→［値］）を選びます。貼った2列 A1:B'+R.rows.length+' を見出しごと選択し、上部［データ］タブ→［並べ替え］で先頭行を見出しとして扱い、人数をキーに大きい順（降順）を指定して［OK］。項目名と人数を必ず一緒に並べ替えます。その2列を選んだまま［挿入］タブの棒グラフのアイコン→集合横棒を選びます。長い棒が下に来たら、項目名の軸を右クリック→［軸の書式設定］→［軸のオプション］で項目を逆順にする設定を探します。元の結果シートの数式は変更しません。';if(m==='desc')return '結果シートの '+R.extra.hist+' を選び、［挿入］タブの統計グラフのアイコン→ヒストグラム。空欄を0にしないことを確認。';if(m==='corr')return '結果シートの D1:E'+(1+completeMatrix().length)+' を選択し、［挿入］タブの点が並ぶアイコン→散布図。D列を横軸、E列を縦軸にします。';if(m==='groupreg'||(m==='simple'&&setting(p.sel[1]).kind==='cat'))return '結果シートの '+R.extra.mean+' を選び、画面上部の［挿入］タブの縦棒アイコン→［2-D 縦棒］の左端（集合縦棒）。グループ別平均の比較です。人数・標準偏差も確認してください。';if(regMethods.includes(m))return m==='simple'?'結果シートの '+R.extra.scatter+' を選び、［挿入］タブの点が並ぶアイコン→散布図。左がX、右がYです。必要なら近似曲線を追加します。':'回帰出力の係数と95%信頼区間を表にまとめます。単位の違う係数を棒の長さだけで比較しません。必要なら残差の散布図を作ります。';if(['cross','chi','mcnemar'].includes(m))return '結果シートの行割合表 '+R.extra.pct+' を名前ボックスで半角入力してEnter。［挿入］タブの縦棒アイコン→100%積み上げ縦棒（または集合縦棒）を選びます。';if(['welch','equal','paired','indcols'].includes(m))return '結果シートの '+R.extra.mean+' を選択し、画面上部の［挿入］タブの縦棒アイコン→［2-D 縦棒］の左端（集合縦棒）。平均だけで判断せず、標準偏差も報告します。';if(m==='anova')return '結果シートの '+R.extra.mean+' を名前ボックスで選び、画面上部の［挿入］タブの縦棒アイコン→［2-D 縦棒］の左端（集合縦棒）。ばらつきも報告し、平均だけで判断しません。';return '結果シートで名前ボックスに A1:B'+R.rows.length+' と半角入力してEnter。［挿入］タブの棒グラフのアイコンから横棒グラフを選びます（人数の比較）。割合を使う場合はA列とD列の対応範囲を '+(p.os==='mac'?'Command':'Ctrl')+' を押しながら選びます。'}

function renderCore(){let next=$('next');$('back').disabled=mode==='setup'&&setup===0;next.disabled=false;next.textContent='次へ';if(mode==='setup'){let h=progress(setup,4);if(setup===0){h+=head('準備 1 / 4','Excelで、自分の調査を分析しよう','まずAIと対話して、使うパソコンと調査目的を決めます。')+`<button id="introAI" class="primary block">最初のAIとの対話へ移動</button><p class="muted">Excel・ナビ・AIを別々に開きます。WindowsはAlt+Tab、MacはCommand+Tabでアプリを切り替えます。同じブラウザ内のナビとAIはタブをクリック。AIの下の入力欄を1回クリックし、WindowsはCtrl+V、MacはCommand+Vで貼り付けて送信します。</p><label for="os">使用するパソコン</label><select id="os"><option value="">選んでください</option><option value="win" ${p.os==='win'?'selected':''}>Windows（Excel 365 デスクトップ版）</option><option value="mac" ${p.os==='mac'?'selected':''}>Mac（Excel 365 デスクトップ版）</option><option value="other" ${p.os==='other'?'selected':''}>スマホ・Web版・その他／わからない</option></select><label for="goal">何を調べたいですか？</label><textarea id="goal" maxlength="1200" placeholder="例：アルバイトの有無で睡眠時間に違いがあるか">${esc(p.goal)}</textarea><p class="muted">分析の計算はExcelで行います。このページは道案内と数式の準備を担当します。</p>`;next.textContent='回答データを読み込む'}else if(setup===1){h+=head('準備 2 / 4','Googleフォームの回答を取り込む','Googleフォームの回答タブからCSVをダウンロードし、下で選びます。')+`<div class="panel"><label for="csvFile">回答のCSVファイル（UTF-8）</label><input id="csvFile" type="file" accept=".csv,text/csv"><p class="muted">先頭行に質問名、2行目から回答。CSVは自動送信しません。AI用の情報は別途確認してコピーします。Excelとナビは同じファイルを使ってください。実データは初期設定で自動保存しません。設定・記録には回答由来の選択肢や数式が含まれ得ます。再開には同じCSVが必要です。</p>${resume?.state?.sampleMode?'<p class="panel">練習データからの再開です。保存した練習CSVを上で選ぶか、下の「練習用の架空データを使う」を押してください。</p>':''}${p.data?`<b>${esc(p.file)}</b><p>${p.data.rows.length}件・${p.data.headers.length}列を読み込みました。</p>${p.sampleMode?'<button id="sampleDownload" class="block">Excelで使う練習CSVを保存</button>':''}<details><summary>質問名と列を確認（回答は表示しません）</summary><div class="scroll"><table>${p.data.headers.map((x,i)=>`<tr><td>${letter(i)}</td><td>${esc(x||'（空欄）')}</td></tr>`).join('')}</table></div></details>${!p.sampleMode?`<label class="check"><input id="allowLocal" type="checkbox" ${p.allowLocal
